<script>
const BANK={"coso":[{"id":1,"question":"Hoạt động đầu tư trực tiếp bất động sản là?","options":{"A":"Việc bỏ tiền để góp vốn mua nhà hình thành trong tương lai","B":"Mua cổ phiếu của các chủ đầu tư kinh doanh bất động sản mà không thực hiện quản lý hoạt động đầu tư.","C":"Việc bỏ vốn đầu tư và tham gia quản lý hoạt động đầu tư bất động sản.","D":"Cả A, B,C đều đúng."},"answer":"C"},{"id":2,"question":"Luật Đất đai 2024 quy định thống nhất tên gọi của giấy chứng nhận là gì?","options":{"A":"Giấy chứng nhận quyền sử dụng đất.","B":"Giấy chứng nhận quyền sở hữu nhà ở và quyền sử dụng đất ở.","C":"Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất.","D":"Sổ đỏ và Sổ hồng."},"answer":"C"},{"id":3,"question":"Ông U muốn lập di chúc để lại căn nhà cho con trai. Ông đến UBND xã yêu cầu chứng thực di chúc. Cán bộ tư pháp xã từ chối vì vợ của cán bộ này là con dâu của ông U. Việc từ chối của cán bộ tư pháp xã có đúng quy định không?","options":{"A":"Sai, vì vợ cán bộ không phải là người hưởng thừa kế trực tiếp.","B":"Đúng, vì người có thẩm quyền chứng thực không được chứng thực di chúc nếu vợ/chồng của họ có quan hệ gia đình (cha, mẹ, vợ, chồng, con) với người hưởng thừa kế.","C":"Sai, chỉ khi nào chính cán bộ đó là người hưởng thừa kế mới bị cấm."},"answer":"B"},{"id":4,"question":"Công ty bất động sản Y (bên bán) ký hợp đồng bán căn hộ chung cư cho bà Z (bên mua). Hợp đồng này có cần công chứng/chứng thực không?","options":{"A":"Bắt buộc phải công chứng.","B":"Bắt buộc phải chứng thực.","C":"Không bắt buộc, việc công chứng/chứng thực thực hiện theo yêu cầu của các bên.","D":"Chỉ bắt buộc nếu bà Z yêu cầu."},"answer":"C"},{"id":5,"question":"Công thức cơ bản tính giá trị BĐS theo Cách tiếp cận Chi phí là gì?","options":{"A":"Giá trị = Thu nhập Thuần (NOI) / Tỷ suất Vốn hóa.","B":"Giá trị = Chi phí tạo mới/thay thế tài sản - Hao mòn tích lũy + Giá trị đất đai.","C":"Giá trị = Giá giao dịch so sánh + Điều chỉnh.","D":"Giá trị = Tổng chi phí xây dựng - Lợi nhuận nhà thầu."},"answer":"B"},{"id":6,"question":"Trong chu kỳ thị trường bất động sản, giai đoạn nào thường có đặc điểm là nguồn cung khan hiếm, giá tăng mạnh và giao dịch sôi động?","options":{"A":"Giai đoạn khủng hoảng và suy thoái.","B":"Giai đoạn phục hồi.","C":"Giai đoạn tăng trưởng (Nóng).","D":"Giai đoạn ổn định."},"answer":"C"},{"id":7,"question":"Hành vi mượn chứng chỉ hành nghề môi giới BĐS để hành nghề bị phạt tiền bao nhiêu đối với tổ chức?","options":{"A":"Từ 40.000.000 đến 60.000.000 đồng.","B":"Từ 60.000.000 đến 80.000.000 đồng.","C":"Từ 80.000.000 đến 100.000.000 đồng.","D":"Từ 100.000.000 đến 120.000.000 đồng."},"answer":"A"},{"id":8,"question":"Sau khi phát hiện giao dịch đáng ngờ, thời hạn tối đa để đối tượng báo cáo gửi báo cáo cho Cơ quan PCRT là bao lâu?","options":{"A":"01 ngày làm việc kể từ ngày phát hiện giao dịch đáng ngờ.","B":"03 ngày làm việc kể từ ngày giao dịch phát sinh.","C":"24 giờ kể từ khi ký hợp đồng.","D":"07 ngày kể từ ngày nghi ngờ."},"answer":"A"},{"id":9,"question":"Một hợp đồng chuyển nhượng bất động sản được ghi nhận sai giá (không phản ánh đúng giá giao dịch thực tế). Hậu quả của việc kê khai sai giá này là:","options":{"A":"Doanh nghiệp được giảm thuế phải nộp hợp pháp","B":"Dễ dẫn đến tính sai số thuế phải nộp và bị xử phạt","C":"Không ảnh hưởng vì chỉ là lỗi về hình thức","D":"Chỉ cần điều chỉnh hồ sơ trong lần kê khai sau"},"answer":"B"},{"id":10,"question":"Văn bản công chứng có giá trị pháp lý như thế nào?","options":{"A":"Chỉ có giá trị tham khảo.","B":"Có hiệu lực thi hành đối với các bên và có giá trị chứng cứ cao.","C":"Cần phải được Tòa án phê duyệt mới có hiệu lực.","D":"Có giá trị tương đương văn bản chứng thực."},"answer":"B"},{"id":11,"question":"Ai KHÔNG thuộc diện người thừa kế không phụ thuộc vào nội dung di chúc theo Điều 644 BLDS 2015?","options":{"A":"Con chưa thành niên của người để lại di sản.","B":"Vợ hoặc chồng của người để lại di sản.","C":"Cha, mẹ của người để lại di sản.","D":"Anh, chị, em ruột của người để lại di sản."},"answer":"D"},{"id":12,"question":"Một tư nhân dự định xây dựng một khu du lịch sinh thái. Sau khi dự án đã được phê duyệt, nhà đầu tư này đã tiến hành xin giao đất, xin phép xây dựng và khai thác tài nguyên. Bước kế tiếp ông ta nên làm gì?","options":{"A":"Thẩm định, phê duyệt thiết kế và tổng dự toán, dự toán công trình.","B":"Đền bù giải phóng mặt bằng, thực hiện kế hoạch tái định cư và phục hồi, chuẩn bị mặt bằng xây dựng.","C":"Mua sắm thiết bị và công nghệ.","D":"Thực hiện việc khảo sát – thiết kế xây dựng."},"answer":"B"},{"id":13,"question":"Cá nhân G có thửa đất ở đã được Giấy chứng nhận quyền sử dụng đất (LURC). Nay G muốn dùng QSDĐ này để góp vốn cùng bạn thành lập Công ty TNHH kinh doanh dịch vụ ăn uống. Việc góp vốn này có cần làm thủ tục gì về đất đai?","options":{"A":"Không cần, chỉ cần thỏa thuận trong nội bộ công ty.","B":"Phải làm thủ tục đăng ký biến động đất đai (chuyển quyền do góp vốn) và hợp đồng góp vốn phải được công chứng hoặc chứng thực.","C":"Chỉ cần thông báo cho cơ quan thuế.","D":"Phải xin phép UBND cấp tỉnh."},"answer":"B"},{"id":14,"question":"Thỏa thuận đặt cọc để mua nhà ở hình thành trong tương lai theo Luật KD BĐS 2023 phải bao gồm nội dung gì về giá?","options":{"A":"Không cần ghi giá, chỉ cần ghi số tiền cọc.","B":"Chỉ cần ghi khoảng giá tham khảo.","C":"Phải ghi rõ giá bán hoặc giá cho thuê mua dự kiến tại thời điểm ký thỏa thuận đặt cọc.","D":"Giá sẽ được xác định khi ký hợp đồng mua bán chính thức."},"answer":"C"},{"id":15,"question":"Nhà ở, công trình xây dựng có sẵn đưa vào kinh doanh phải đáp ứng điều kiện nào về pháp lý?","options":{"A":"Phải có Giấy phép xây dựng và biên bản nghiệm thu.","B":"Phải có Giấy chứng nhận quyền sở hữu và không đang bị kê biên để thi hành án.","C":"Chưa có bất kỳ khiếu nại, tố cáo nào liên quan đến quyền sở hữu.","D":"Đã hoàn thành xây dựng theo đúng thiết kế được duyệt."},"answer":"B"},{"id":16,"question":"Nội dung nào không bắt buộc phải có trong hợp đồng mua bán nhà ở giữa chủ đầu tư và khách hàng?","options":{"A":"Thời hạn bảo hành và trách nhiệm bảo trì.","B":"Thông tin về tổ chức hành nghề công chứng (nếu có công chứng).","C":"Thời điểm chuyển giao quyền sở hữu.","D":"Giá bán và phương thức thanh toán."},"answer":"B"},{"id":17,"question":"Người Việt Nam định cư ở nước ngoài được sở hữu nhà ở tại Việt Nam khi đáp ứng điều kiện gì?","options":{"A":"Được phép nhập cảnh vào Việt Nam và có giấy tờ chứng minh quốc tịch Việt Nam hoặc xác nhận gốc Việt Nam.","B":"Có nguồn thu nhập hợp pháp để mua nhà và được phép nhập cảnh.","C":"Có thẻ căn cước công dân hoặc giấy khai sinh.","D":"Có dự án đầu tư tại Việt Nam."},"answer":"A"},{"id":18,"question":"Theo Luật Đất đai 2024, tổ chức kinh tế được Nhà nước giao đất có thu tiền sử dụng đất được thực hiện quyền nào sau đây?","options":{"A":"Bán tài sản gắn liền với đất trong thời gian thuê đất trả tiền hằng năm.","B":"Cho thuê lại quyền sử dụng đất dưới hình thức trả tiền thuê đất một lần cho cả thời gian thuê.","C":"Thế chấp bằng quyền sử dụng đất tại các tổ chức tín dụng nước ngoài không hoạt động tại Việt Nam.","D":"Chuyển nhượng quyền sử dụng đất, tài sản gắn liền với đất thuộc sở hữu của mình."},"answer":"D"},{"id":19,"question":"Cá nhân có hành vi “kinh doanh bất động sản khi không đủ điều kiện” sẽ bị phạt tiền trong mức nào sau đây?","options":{"A":"Từ 80.000.000 đồng đến dưới 100.000.000 đồng","B":"Từ 120.000.000 đồng đến 160.000.000 đồng","C":"Từ trên 160.000.000 đồng đến 200.000.000 đồng","D":"Trên 200.000.000 đồng"},"answer":"A"},{"id":20,"question":"Mức phạt vi phạm hành chính đối với cá nhân so với tổ chức trong lĩnh vực bất động sản thường như thế nào?","options":{"A":"Cá nhân bị phạt cao hơn tổ chức","B":"Cá nhân và tổ chức bị phạt mức như nhau","C":"Cá nhân bị phạt với mức phạt bằng một nửa mức phạt đối với tổ chức","D":"Cá nhân không bị phạt, chỉ có tổ chức bị phạt"},"answer":"C"},{"id":21,"question":"Ông S có một mảnh đất nông nghiệp tại tỉnh A. Ông muốn chuyển đổi mảnh đất này cho anh T để lấy mảnh đất của anh T (cả hai đều là cá nhân). Họ ký hợp đồng viết tay. Hợp đồng chuyển nhượng quyền sử dụng đất nông nghiệp này có bắt buộc phải công chứng hoặc chứng thực không?","options":{"A":"Bắt buộc phải công chứng.","B":"Bắt buộc phải chứng thực tại UBND xã.","C":"Không bắt buộc, nhưng nên làm để đảm bảo pháp lý.","D":"Bắt buộc vì là giao dịch bất động sản."},"answer":"C"},{"id":22,"question":"Theo Nghị định 339/2026/NĐ-CP, hành nghề môi giới bất động sản nhưng không có chứng chỉ hành nghề theo quy định thì bị phạt tiền?","options":{"A":"Từ 20 triệu đồng đến 40 triệu đồng","B":"Từ 40 triệu đồng đến 60 triệu đồng","C":"Từ 60 triệu đồng đến 80 triệu đồng","D":"Từ 80 triệu đồng đến 100 triệu đồng"},"answer":"B"},{"id":23,"question":"Đối với hành vi không đủ số người có chứng chỉ môi giới bất động sản theo quy định thì doanh nghiệp kinh doanh dịch vụ môi giới bất động sản sẽ bị phạt tiền?","options":{"A":"Từ 20.000.000 đồng đến 40.000.000 đồng","B":"Từ 50.000.000 đồng đến 80.000.000 đồng","C":"Từ 120.000.000 đồng đến 160.000.000 đồng","D":"Từ 60.000.000 đồng đến 80.000.000 đồng"},"answer":"D"},{"id":24,"question":"Một Cá nhân hành nghề môi giới bất động sản nhưng không hành nghề trong một doanh nghiệp kinh doanh dịch vụ sàn giao dịch bất động sản hoặc một doanh nghiệp kinh doanh dịch vụ môi giới bất động sản. Người này sẽ bị xử phạt như thế nào?","options":{"A":"Phạt tiền từ 40.000.000 - 60.000.000 đồng và không có hình phạt bổ sung.","B":"Phạt tiền từ 40.000.000 - 60.000.000 đồng và tước quyền sử dụng chứng chỉ hành nghề từ 03 đến 06 tháng.","C":"Phạt tiền từ 120.000.000 - 160.000.000 đồng và tước quyền sử dụng chứng chỉ hành nghề từ 06 đến 09 tháng.","D":"Chỉ bị tước quyền sử dụng chứng chỉ hành nghề vĩnh viễn."},"answer":"A"},{"id":25,"question":"Khái niệm \"Bất động sản\" được hiểu là gì theo pháp luật Việt Nam (Luật Đất đai 2024, Bộ luật Dân sự 2015)?","options":{"A":"Là đất đai và tài sản gắn liền với đất đai, bao gồm nhà ở, công trình xây dựng, rừng sản xuất là rừng tự nhiên.","B":"Là các tài sản bao gồm đất đai; nhà, công trình xây dựng gắn liền với đất; tài sản khác gắn liền với đất, tài sản khác theo quy định của pháp luật.","C":"Là tài sản không thể di dời, chỉ bao gồm đất đai và nhà ở.","D":"Là quyền sử dụng đất và các công trình hình thành trong tương lai trên đất."},"answer":"B"},{"id":26,"question":"Yếu tố kinh tế nào sau đây có tác động lớn nhất đến tổng cầu và khả năng chi trả của người mua trên thị trường bất động sản?","options":{"A":"Sự phát triển của công nghệ xây dựng.","B":"Tốc độ tăng trưởng GDP, lạm phát và thu nhập bình quân đầu người.","C":"Thay đổi trong quy hoạch sử dụng đất và hạ tầng giao thông.","D":"Yếu tố về văn hóa, phong tục tập quán trong xây dựng."},"answer":"B"},{"id":27,"question":"Vai trò của Chính phủ (Nhà nước) đối với thị trường bất động sản được thể hiện rõ nhất qua hoạt động nào sau đây?","options":{"A":"Trực tiếp tham gia vào mọi giao dịch mua bán để niêm yết giá.","B":"Trực tiếp cấp vốn cho mọi dự án phát triển bất động sản.","C":"Ban hành các quy định pháp luật về giao dịch, thuế, quản lý và sử dụng đất đai.","D":"Kiểm soát quy hoạch, kế hoạch sử dụng đất, điều tiết cung cầu thông qua các công cụ tài chính, pháp luật."},"answer":"D"},{"id":28,"question":"Theo quy định, bất động sản bao gồm những loại tài sản nào?","options":{"A":"Đất đai và nhà ở.","B":"Đất đai, tài sản gắn liền với đất đai và các tài sản khác theo luật định.","C":"Nhà ở và các công trình xây dựng.","D":"Đất đai, cây trồng và vật nuôi trên đất."},"answer":"B"},{"id":29,"question":"Phân đoạn thị trường là gì?","options":{"A":"Là quá trình phân chia thị trường thành những đoạn nhỏ hơn mang tính không đồng nhất","B":"Là quá trình phân chia thị trường thành những đoạn nhỏ hơn mang tính đồng nhất cao theo các tiêu chí cụ thể.","C":"Là quá trình phân chia thị trường thành những đoạn khác biệt mang tính không đồng nhất.","D":"Cả A, B và C."},"answer":"B"},{"id":30,"question":"Bà Q là chủ sở hữu một căn hộ chung cư mini được cấp GCN riêng theo Luật Nhà ở 2023. Bà muốn bán căn hộ này cho anh R. Hợp đồng mua bán căn hộ chung cư mini này giữa bà Q và anh R có cần công chứng hoặc chứng thực không?","options":{"A":"Không cần, vì là chung cư mini.","B":"Có, vì đây là giao dịch mua bán nhà ở giữa các cá nhân với nhau.","C":"Chỉ cần nếu giá trị căn hộ trên 1 tỷ đồng.","D":"Theo yêu cầu của anh R."},"answer":"B"},{"id":31,"question":"Đối tượng nào sau đây KHÔNG được hành nghề thẩm định giá theo quy định tại Khoản 2 Điều 45 Luật Giá 2023?","options":{"A":"Người có Thẻ thẩm định viên về giá hết hạn.","B":"Người đang trong thời gian bị khởi tố, truy tố, xét xử.","C":"Người có bằng đại học chuyên ngành thẩm định giá.","D":"Người làm việc tại doanh nghiệp thẩm định giá."},"answer":"B"},{"id":32,"question":"Việc xây dựng Bảng giá đất chi tiết đến từng thửa đất theo Luật Đất đai 2024 yêu cầu phải có điều kiện gì về hạ tầng thông tin?","options":{"A":"Mạng lưới internet tốc độ cao","B":"Hệ thống định vị toàn cầu","C":"Bản đồ địa chính số và cơ sở dữ liệu giá đất","D":"Hệ thống camera giám sát"},"answer":"C"},{"id":33,"question":"Mối quan hệ giữa Luật Giá và các Chuẩn mực thẩm định giá Việt Nam là gì?","options":{"A":"Chuẩn mực TĐG VN có giá trị pháp lý cao hơn Luật Giá.","B":"Luật Giá quy định các nguyên tắc chung và quản lý nhà nước, Chuẩn mực TĐG VN là các hướng dẫn kỹ thuật, nghiệp vụ chi tiết để thực hiện Luật Giá.","C":"Hai hệ thống này hoàn toàn độc lập, không liên quan.","D":"Luật Giá chỉ áp dụng cho Nhà nước, Chuẩn mực áp dụng cho doanh nghiệp."},"answer":"B"},{"id":34,"question":"Nguyên tắc thẩm định giá nào là nền tảng cho Cách tiếp cận So sánh và Cách tiếp cận Chi phí?","options":{"A":"Nguyên tắc Thay đổi.","B":"Nguyên tắc Thay thế.","C":"Nguyên tắc Phù hợp.","D":"Nguyên tắc Đóng góp."},"answer":"B"},{"id":35,"question":"Bước đầu tiên và quan trọng nhất trong quy trình xác định giá bất động sản là gì?","options":{"A":"Thu thập dữ liệu giao dịch thị trường.","B":"Phân tích Sử dụng tốt nhất và hiệu quả nhất (HBU).","C":"Xác định vấn đề thẩm định giá (mục đích, đối tượng, thời điểm, cơ sở giá trị).","D":"Áp dụng các phương pháp tính toán."},"answer":"C"},{"id":36,"question":"Vợ chồng anh N, chị P cùng đứng tên trên GCN quyền sử dụng đất và sở hữu nhà ở. Anh N muốn dùng căn nhà này để thế chấp vay vốn ngân hàng phục vụ kinh doanh riêng của mình. Anh N có thể tự mình ký hợp đồng thế chấp với ngân hàng không?","options":{"A":"Có, vì anh là một trong hai đồng sở hữu.","B":"Có, nếu việc kinh doanh riêng mang lại lợi ích cho gia đình.","C":"Không, việc thế chấp tài sản chung là bất động sản phải có sự thỏa thuận bằng văn bản của cả vợ và chồng (chị P).","D":"Chỉ cần chị P đồng ý bằng lời nói là đủ."},"answer":"C"},{"id":37,"question":"Sự khác biệt cốt lõi giữa \"Thẩm định giá\" và \"Tư vấn giá\" bất động sản là gì?","options":{"A":"Thẩm định giá đưa ra một con số ước tính duy nhất; Tư vấn giá cung cấp phân tích, lời khuyên và các kịch bản giá trị.","B":"Thẩm định giá là của nhà nước; Tư vấn giá là của tư nhân.","C":"Thẩm định giá bắt buộc dùng phương pháp so sánh; Tư vấn giá dùng phương pháp chi phí.","D":"Không có sự khác biệt giữa hai hoạt động này."},"answer":"A"},{"id":38,"question":"Việc thẩm định pháp lý (due diligence) trước khi mua bất động sản đặc biệt cần chú trọng kiểm tra tình trạng hôn nhân của bên bán vì lý do gì?","options":{"A":"Để biết hoàn cảnh gia đình của bên bán.","B":"Để xác định bất động sản là tài sản chung hay riêng, từ đó biết cần sự đồng ý của cả vợ/chồng hay không khi định đoạt.","C":"Để đánh giá khả năng tài chính của bên bán.","D":"Để làm quen với gia đình bên bán."},"answer":"B"},{"id":39,"question":"Khi “cầu” BĐS tăng sẽ ảnh hưởng như thế nào đến giá bán và tiền thuê BĐS trong ngắn hạn?","options":{"A":"Giá và tiền thuê sẽ giảm.","B":"Giá sẽ giảm nhưng tiền thuê sẽ tăng.","C":"Giá và tiền thuê sẽ tăng.","D":"Giá sẽ tăng nhưng tiền thuê sẽ giảm."},"answer":"C"},{"id":40,"question":"Một khách hàng nhờ thẩm định giá căn nhà riêng lẻ để mua và sử dụng lâu dài. Trong trường hợp này, thẩm định viên nên ưu tiên cách tiếp cận nào để đưa ra kết quả phù hợp nhất?","options":{"A":"Cách tiếp cận từ thu nhập","B":"Cách tiếp cận chi phí","C":"Cách tiếp cận so sánh","D":"Cách tiếp cận thặng dư"},"answer":"C"},{"id":41,"question":"Khi một môi giới cùng một thẩm định viên thẩm định giá trị một căn nhà ở Block A, Khu đô thị X, họ nên chọn cách tiếp nào dưới đây để đưa ra mô hình thẩm định giá BĐS phù hợp. Biết rằng, khách hàng dự định mua căn nhà này để cùng gia đình sinh sống lâu dài?","options":{"A":"Cách tiếp cận thu nhập.","B":"Cách tiếp cận so sánh.","C":"Cách tiếp cận chi phí.","D":"Tất cả các cách trên."},"answer":"B"},{"id":42,"question":"Hành vi nào sau đây bị nghiêm cấm theo Luật KDBĐS 2023?","options":{"A":"Kinh doanh BĐS đủ điều kiện theo quy định.","B":"Công khai đầy đủ thông tin về dự án BĐS.","C":"Thu tiền đặt cọc mua nhà hình thành trong tương lai không quá 5% giá bán.","D":"Giả mạo tài liệu, cố ý làm sai lệch thông tin về BĐS."},"answer":"D"},{"id":43,"question":"Điểm khác biệt cơ bản trong quyền của Người Việt Nam định cư ở nước ngoài là CÔNG DÂN Việt Nam và người GỐC Việt Nam định cư ở nước ngoài liên quan đến đất ở theo Luật Đất đai 2024 là gì?","options":{"A":"Không có sự khác biệt, quyền như nhau.","B":"Chỉ công dân VN định cư ở nước ngoài mới được sở hữu nhà ở.","C":"Công dân VN định cư ở nước ngoài có đầy đủ quyền như công dân trong nước; người gốc Việt Nam được nhận QSDĐ ở thông qua hình thức mua, thuê mua nhà ở gắn liền QSDĐ và được đầu tư kinh doanh BĐS.","D":"Người gốc Việt Nam chỉ được thuê nhà ở."},"answer":"C"},{"id":44,"question":"Doanh nghiệp kinh doanh dịch vụ sàn giao dịch bất động sản có quyền:","options":{"A":"Tự ý bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua tất cả các bất động sản được đưa lên sàn giao dịch bất động sản.","B":"Quản lý, giám sát việc khai thác, sử dụng bất động sản của khách hàng","C":"Được thu phí dịch vụ của khách hàng có bất động sản được đưa lên sàn giao dịch bất động sản.","D":"Yêu cầu khách hàng bồi thường tất cả các thiệt hại khi xảy ra"},"answer":"C"},{"id":45,"question":"Theo Luật Kinh doanh bất động sản 2023, điều kiện chung đối với tổ chức kinh doanh BĐS là gì (ngoại trừ trường hợp quy mô nhỏ)?","options":{"A":"Phải có vốn pháp định tối thiểu là 20 tỷ đồng.","B":"Phải thành lập doanh nghiệp hoặc hợp tác xã.","C":"Phải có Giấy phép kinh doanh BĐS do cơ quan có thẩm quyền cấp.","D":"Phải có ít nhất 02 người có chứng chỉ môi giới BĐS."},"answer":"B"},{"id":46,"question":"Trường hợp nào sau đây chủ đầu tư bị nghiêm cấm chuyển nhượng dự án?","options":{"A":"Dự án đang trong quá trình thế chấp tại ngân hàng.","B":"Dự án chưa hoàn thành xong phần móng công trình.","C":"Có quyết định thu hồi đất hoặc chấm dứt hoạt động của dự án từ cơ quan có thẩm quyền.","D":"Dự án đã chuyển nhượng một phần trước đó."},"answer":"C"},{"id":47,"question":"Nếu hợp đồng mua bán nhà ở giữa doanh nghiệp kinh doanh BĐS và cá nhân không công chứng/chứng thực (vì không bắt buộc), giá trị chứng cứ của hợp đồng này tại Tòa án sẽ như thế nào so với hợp đồng có công chứng?","options":{"A":"Tương đương hợp đồng có công chứng.","B":"Thấp hơn, các tình tiết trong hợp đồng vẫn có thể phải chứng minh lại.","C":"Cao hơn vì thể hiện đúng ý chí tự do thỏa thuận.","D":"Không có giá trị chứng cứ."},"answer":"B"},{"id":48,"question":"Điều kiện đối với nhà ở có sẵn đưa vào kinh doanh theo Luật Kinh doanh Bất động sản 2023 là gì?","options":{"A":"Phải được xây dựng bằng vật liệu cao cấp.","B":"Phải có Giấy chứng nhận; không tranh chấp; không bị kê biên; tuân thủ giấy phép xây dựng và đảm bảo chất lượng.","C":"Phải nằm trong khu đô thị loại I.","D":"Phải có giá trị tối thiểu 1 tỷ đồng."},"answer":"B"},{"id":49,"question":"Ông An (công dân Việt Nam) mua một căn hộ chung cư thương mại từ chủ đầu tư B. Ông An đã thanh toán 95% giá trị hợp đồng và nhận bàn giao nhà. Tuy nhiên, Giấy chứng nhận chưa được cấp. Theo quy định, quyền sở hữu của ông An đối với căn hộ này được xác lập khi nào?","options":{"A":"Khi ông An ký hợp đồng mua bán.","B":"Khi ông An thanh toán đủ 100% giá trị hợp đồng.","C":"Khi ông An thanh toán đủ tiền (theo thỏa thuận hoặc 95% trong trường hợp này) và nhận bàn giao nhà ở (trừ khi có thỏa thuận khác).","D":"Khi Giấy chứng nhận được cấp cho ông An."},"answer":"C"},{"id":50,"question":"Doanh nghiệp muốn góp vốn bằng QSDĐ thuê trả tiền hàng năm vào liên doanh thì có được không?","options":{"A":"Được phép góp vốn bằng quyền sử dụng đất.","B":"Không được phép góp vốn bằng QSDĐ, chỉ được góp vốn bằng tài sản gắn liền với đất.","C":"Được phép nếu có sự đồng ý của UBND cấp tỉnh.","D":"Được phép nếu thời gian thuê còn trên 20 năm."},"answer":"B"},{"id":51,"question":"Hồ sơ hoàn thành công trình xây dựng (hồ sơ hoàn công) do ai lập và lưu trữ?","options":{"A":"Nhà thầu thi công.","B":"Đơn vị tư vấn giám sát.","C":"Chủ đầu tư.","D":"Cơ quan cấp phép xây dựng."},"answer":"C"},{"id":52,"question":"Hợp đồng nào sau đây là hợp đồng mà hiệu lực phụ thuộc vào hợp đồng chính?","options":{"A":"Hợp đồng song vụ.","B":"Hợp đồng chính.","C":"Hợp đồng phụ.","D":"Hợp đồng vì lợi ích của người thứ ba."},"answer":"C"},{"id":53,"question":"Thời hạn công chứng hợp đồng, giao dịch thông thường là bao lâu kể từ ngày nhận đủ hồ sơ hợp lệ?","options":{"A":"Không quá 01 ngày làm việc.","B":"Không quá 02 ngày làm việc.","C":"Không quá 05 ngày làm việc.","D":"Không quá 10 ngày làm việc."},"answer":"B"},{"id":54,"question":"Trong giao dịch mua bán nhà đất giữa vợ và chồng (quan hệ hôn nhân), loại thuế nào được miễn theo quy định?","options":{"A":"Thuế thu nhập cá nhân","B":"Thuế giá trị gia tăng","C":"Thuế sử dụng đất phi nông nghiệp","D":"Thuế môn bài"},"answer":"A"},{"id":55,"question":"Hoạt động nào sau đây trong lĩnh vực bất động sản KHÔNG thuộc đối tượng phải báo cáo phòng chống rửa tiền theo Luật phòng chống rửa tiền 2022?","options":{"A":"Kinh doanh dịch vụ môi giới bất động sản.","B":"Đầu tư, phát triển dự án bất động sản.","C":"Dịch vụ tư vấn bất động sản.","D":"Hoạt động của sàn giao dịch bất động sản."},"answer":"C"},{"id":56,"question":"Khi xử phạt vi phạm hành chính, cơ quan có thẩm quyền sẽ dựa vào yếu tố nào sau đây để xác định mức phạt cụ thể?","options":{"A":"Mong muốn người vi phạm","B":"Sự nổi tiếng của người vi phạm","C":"Mức độ, hậu quả của hành vi vi phạm","D":"Ý kiến từ người dân xung quanh"},"answer":"C"},{"id":57,"question":"Thị trường bất động sản thường được phân loại theo cấp độ nào?","options":{"A":"Thị trường sơ cấp và thị trường thứ cấp.","B":"Thị trường nội địa và thị trường quốc tế.","C":"Thị trường nhà ở và thị trường đất nông nghiệp.","D":"Thị trường giao dịch và thị trường thế chấp."},"answer":"A"},{"id":58,"question":"Tình huống: Nhà nước thu hồi đất nông nghiệp của hộ gia đình, cá nhân để xây dựng khu công nghiệp. Việc xác định giá đất để tính tiền bồi thường sẽ áp dụng Điều nào theo Luật Đất đai 2024?","options":{"A":"Áp dụng giá đất trong Bảng giá đất.","B":"Áp dụng Giá đất cụ thể được xác định tại thời điểm thu hồi đất.","C":"Thỏa thuận giữa Nhà nước và người bị thu hồi đất.","D":"Áp dụng giá đất thị trường do tổ chức độc lập khảo sát."},"answer":"B"},{"id":59,"question":"Nếu bên mua, thuê mua nhà ở, công trình xây dựng tự thực hiện việc xin cấp Giấy chứng nhận thì tổng số tiền thanh toán trước khi được cấp giấy không vượt quá bao nhiêu % giá trị hợp đồng?","options":{"A":"70%","B":"80%","C":"90%","D":"95%"},"answer":"D"},{"id":60,"question":"Mức đặt cọc tối đa mà chủ đầu tư được thu khi bán nhà ở hình thành trong tương lai theo Luật KDBĐS 2023 là bao nhiêu?","options":{"A":"10% giá bán","B":"5% giá bán","C":"30% giá bán","D":"Không giới hạn"},"answer":"B"},{"id":61,"question":"Cá nhân hành nghề môi giới BĐS được nhận thù lao/hoa hồng từ đâu theo Luật KDBĐS 2023?","options":{"A":"Trực tiếp từ khách hàng (bên mua/bên bán).","B":"Từ chủ đầu tư dự án.","C":"Từ sàn giao dịch BĐS hoặc doanh nghiệp kinh doanh dịch vụ môi giới BĐS nơi cá nhân đó làm việc.","D":"Từ cơ quan quản lý nhà nước."},"answer":"C"},{"id":62,"question":"Tình huống: Công ty BĐS An Khang đang triển khai dự án nhà ở thương mại quy mô 18 ha. Để đáp ứng điều kiện về vốn chủ sở hữu theo Luật KDBĐS 2023, An Khang cần đảm bảo tỷ lệ vốn chủ sở hữu tối thiểu là bao nhiêu so với tổng mức đầu tư?","options":{"A":"15%, vì dự án dưới 20 ha.","B":"20%, vì dự án dưới 20 ha.","C":"15%, vì là dự án nhà ở thương mại.","D":"20%, bất kể quy mô dự án."},"answer":"B"},{"id":63,"question":"Tình huống: Bà Lan là một nhà môi giới BĐS tự do, có chứng chỉ hành nghề còn hiệu lực. Bà tự mình tìm kiếm khách hàng và thực hiện giao dịch môi giới cho một vụ mua bán nhà đất giữa ông Bình và bà Hoa, nhận hoa hồng trực tiếp từ ông Bình. Hoạt động của bà Lan có vi phạm Luật KDBĐS 2023 không?","options":{"A":"Không vi phạm, vì bà có chứng chỉ hành nghề.","B":"Chỉ vi phạm nếu không kê khai thuế thu nhập.","C":"Vi phạm, vì cá nhân không được hoạt động môi giới độc lập và không được nhận hoa hồng trực tiếp từ khách hàng.","D":"Chỉ vi phạm nếu giá trị giao dịch trên 300 tỷ đồng."},"answer":"C"},{"id":64,"question":"Doanh nghiệp BĐS M ký hợp đồng bán căn hộ hình thành trong tương lai cho khách hàng, trong hợp đồng có điều khoản \"Bên mua đồng ý không yêu cầu Bên bán cung cấp bảo lãnh ngân hàng\". Khách hàng ký vào hợp đồng này. Điều khoản này có hiệu lực pháp lý không?","options":{"A":"Có hiệu lực vì khách hàng đã đồng ý ký.","B":"Không có hiệu lực vì bảo lãnh ngân hàng là bắt buộc theo luật.","C":"Có hiệu lực, vì Luật Kinh doanh BĐS 2023 cho phép người mua lựa chọn không yêu cầu bảo lãnh.","D":"Chỉ có hiệu lực nếu được công chứng."},"answer":"C"},{"id":65,"question":"Yêu cầu đối với dự án đầu tư bất động sản để kinh doanh là gì?","options":{"A":"Dự án đầu tư BĐS để kinh doanh phải phù hợp với quy hoạch, kế hoạch sử dụng đất, quy hoạch đô thị, quy hoạch xây dựng nông thôn và phải theo kế hoạch thực hiện được cơ quan nhà nước có thẩm quyền phê duyệt.","B":"Trình tự, thủ tục đầu tư dự án BĐS để kinh doanh thực hiện theo quy định của pháp luật về đầu tư, đất đai, xây dựng, đô thị, nhà ở và quy định khác của pháp luật có liên quan.","C":"Dự án đầu tư bất động sản phải được thi công đúng tiến độ, bảo đảm chất lượng theo quy định của pháp luật về xây dựng.","D":"Tất cả các phương án trên."},"answer":"D"},{"id":66,"question":"Nếu hợp đồng thế chấp bất động sản đã được công chứng nhưng chưa đăng ký giao dịch bảo đảm, thì hiệu lực của hợp đồng này như thế nào?","options":{"A":"Vô hiệu hoàn toàn.","B":"Có hiệu lực giữa các bên thế chấp và nhận thế chấp, nhưng chưa có hiệu lực đối kháng với người thứ ba.","C":"Chỉ có hiệu lực khi có tranh chấp xảy ra.","D":"Chỉ có hiệu lực về mặt hình thức."},"answer":"B"},{"id":67,"question":"Hợp đồng đặt cọc mua căn hộ hình thành trong tương lai giữa chủ đầu tư và khách hàng có ghi giá bán dự kiến là 3 tỷ đồng, tiền cọc là 150 triệu đồng (5%). Tuy nhiên, khi ký hợp đồng mua bán, chủ đầu tư tăng giá bán lên 3.2 tỷ đồng do biến động thị trường. Khách hàng có bắt buộc phải chấp nhận giá mới không?","options":{"A":"Có, vì giá trong hợp đồng đặt cọc chỉ là dự kiến.","B":"Có, vì thị trường biến động là yếu tố khách quan.","C":"Không, thỏa thuận đặt cọc theo Luật KD BĐS 2023 yêu cầu ghi rõ giá bán/cho thuê mua. Việc tăng giá sau đó mà không có thỏa thuận trước là vi phạm thỏa thuận đặt cọc, khách hàng có quyền từ chối ký HĐMB và yêu cầu trả lại cọc, thậm chí phạt cọc.","D":"Chỉ bắt buộc chấp nhận nếu mức tăng dưới 10%."},"answer":"C"},{"id":68,"question":"Mức thù lao của dịch vụ môi giới bất động sản được xác định:","options":{"A":"Không quá 3% giá trị bất động sản được tư vấn","B":"Theo thỏa thuận trong hợp đồng","C":"Không ít hơn 500.000 đồng cho mỗi lần tư vấn","D":"Đáp án A, B và C đều đúng"},"answer":"B"},{"id":69,"question":"Dự án Bất động sản, công trình xây dựng đủ điều kiện được giao dịch trên thị trường bất động sản khi:","options":{"A":"Có quy hoạch 1/500 được duyệt.","B":"Có chứng nhận đầu tư của cơ quan có thẩm quyền.","C":"Có quyết định cho phép thực hiện dự án của cấp có thẩm quyền, có giấy phép xây dựng công trình.","D":"Cả 3 phương án trên đều đúng."},"answer":"D"},{"id":70,"question":"Mức vốn pháp định tối thiểu đối với ngành nghề kinh doanh bất động sản:","options":{"A":"20 tỷ đồng.","B":"50 tỷ đồng.","C":"10 tỷ đồng.","D":"Pháp luật không quy định."},"answer":"D"},{"id":71,"question":"Tổng số tiền thanh toán trước khi bên mua được cấp Giấy chứng nhận không được vượt quá bao nhiêu % giá trị hợp đồng?","options":{"A":"70%","B":"80%","C":"95%","D":"100%"},"answer":"C"},{"id":72,"question":"Khi áp dụng phương pháp định giá đất \"thặng dư\" theo Luật Đất đai 2024, yếu tố nào là cơ sở chính để xác định giá trị đất?","options":{"A":"Giá chuyển nhượng của các thửa đất tương tự đã giao dịch.","B":"Thu nhập ròng hàng năm dự kiến từ việc sử dụng đất.","C":"Lấy tổng doanh thu phát triển giả định của bất động sản trừ đi tổng chi phí phát triển ước tính.","D":"Hệ số điều chỉnh giá đất do UBND tỉnh ban hành."},"answer":"C"},{"id":73,"question":"Tình huống: Anh L muốn đặt cọc 10% giá trị căn hộ hình thành trong tương lai của chủ đầu tư M vào tháng 6/2025 để giữ chỗ. Dự án đã có giấy phép xây dựng và đã thi công xong phần móng. Chủ đầu tư M có được nhận tiền đặt cọc 10% từ anh L không?","options":{"A":"Được, vì dự án đã có giấy phép và đang thi công.","B":"Được, nếu anh L tự nguyện đồng ý.","C":"Không được, vì mức đặt cọc tối đa chỉ là 5% giá bán/cho thuê mua.","D":"Không được, vì phải xây xong móng mới được nhận đặt cọc."},"answer":"C"},{"id":74,"question":"Theo Luật Kinh doanh bất động sản, tổ chức, cá nhân muốn kinh doanh BĐS phải có điều kiện gì?","options":{"A":"Thành lập doanh nghiệp/HTX, trừ trường hợp cá nhân kinh doanh quy mô nhỏ.","B":"Có vốn pháp định tối thiểu 50 tỷ đồng.","C":"Đăng ký hộ kinh doanh cá thể.","D":"Được Sở Xây dựng cấp phép hành nghề."},"answer":"A"},{"id":75,"question":"Thông tin nào sau đây KHÔNG thuộc thông tin bắt buộc phải công khai đối với dự án BĐS đưa vào kinh doanh?","options":{"A":"Quyết định chủ trương đầu tư hoặc chấp thuận chủ trương đầu tư.","B":"Thông tin về quy hoạch chi tiết được cơ quan nhà nước có thẩm quyền phê duyệt.","C":"Danh sách các nhà thầu phụ và đơn vị giám sát thi công.","D":"Hợp đồng mẫu được sử dụng để ký kết trong giao dịch kinh doanh BĐS."},"answer":"C"},{"id":76,"question":"Doanh nghiệp kinh doanh BĐS phải công khai thông tin dự án ở đâu?","options":{"A":"Website của Bộ Xây dựng.","B":"Báo chí trung ương.","C":"Hệ thống thông tin về nhà ở và thị trường BĐS & website của doanh nghiệp.","D":"Chỉ cần niêm yết tại trụ sở doanh nghiệp."},"answer":"C"},{"id":77,"question":"Bà An bán 03 căn hộ và cho thuê 05 phòng trọ do mình xây dựng. Bà có cần thành lập doanh nghiệp không?","options":{"A":"Bắt buộc phải thành lập doanh nghiệp vì có mục đích sinh lời.","B":"Phải thành lập doanh nghiệp vì số lượng căn hộ vượt quá quy mô nhỏ.","C":"Không cần thành lập doanh nghiệp vì đây là hoạt động kinh doanh BĐS quy mô nhỏ, không thường xuyên.","D":"Không cần thành lập nếu tổng giá trị giao dịch không vượt mức quy định của Bộ Tài chính."},"answer":"C"},{"id":78,"question":"Dự án nhà ở thương mại quy mô 15 ha cần vốn chủ sở hữu tối thiểu là bao nhiêu so với tổng mức đầu tư?","options":{"A":"Không thấp hơn 15% tổng mức đầu tư.","B":"Không thấp hơn 20% tổng mức đầu tư.","C":"Không thấp hơn 25% tổng mức đầu tư.","D":"Không thấp hơn 10% tổng mức đầu tư."},"answer":"B"},{"id":79,"question":"Điều kiện quan trọng nhất để nhà ở hình thành trong tương lai được đưa vào kinh doanh là gì?","options":{"A":"Đã hoàn thành phần thô và có bảo lãnh ngân hàng.","B":"Đã nộp đủ tiền sử dụng đất và được phê duyệt thiết kế kỹ thuật.","C":"Có giấy tờ chứng minh đã được nghiệm thu hoàn thành xây dựng phần móng theo quy định của pháp luật về xây dựng tương ứng theo tiến độ dự án và có văn bản thông báo đủ điều kiện bán của cơ quan quản lý nhà ở cấp tỉnh.","D":"Có văn bản chấp thuận của Sở Xây dựng và đã có Giấy phép xây dựng."},"answer":"C"},{"id":80,"question":"Để kinh doanh quyền sử dụng đất đã có hạ tầng kỹ thuật, điều kiện bắt buộc là gì?","options":{"A":"Đã hoàn thành nghĩa vụ tài chính và được cho phép phân lô bán nền.","B":"Có Giấy chứng nhận QSDĐ và hoàn thành đầu tư xây dựng các công trình hạ tầng kỹ thuật theo tiến độ dự án.","C":"Đất không có tranh chấp và đã nộp đủ 50% tiền sử dụng đất.","D":"Hoàn thành hạ tầng đồng bộ và đảm bảo cung cấp dịch vụ cơ bản."},"answer":"B"},{"id":81,"question":"Trong thời hạn bao nhiêu ngày kể từ ngày bàn giao nhà ở cho bên mua thì Chủ đầu tư phải nộp hồ sơ đề nghị cơ quan nhà nước có thẩm quyền cấp giấy chứng nhận về quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất cho bên mua.","options":{"A":"30 ngày","B":"40 ngày","C":"50 ngày","D":"60 ngày."},"answer":"C"},{"id":82,"question":"Một người lập di chúc truất quyền hưởng di sản của người con chưa thành niên. Di chúc này có hợp pháp về mặt nội dung truất quyền không?","options":{"A":"Có, người lập di chúc có toàn quyền định đoạt.","B":"Không, vì con chưa thành niên thuộc diện người thừa kế không phụ thuộc vào nội dung di chúc nên không thể bị truất quyền hoàn toàn (vẫn được hưởng 2/3 suất theo pháp luật).","C":"Chỉ hợp pháp nếu người con đó hư hỏng, bất hiếu.","D":"Chỉ hợp pháp nếu người con đó đã có tài sản riêng đủ sống."},"answer":"B"},{"id":83,"question":"Điều kiện cốt lõi đối với bên nhận chuyển nhượng toàn bộ hoặc một phần dự án BĐS là gì?","options":{"A":"Phải có kinh nghiệm 03 năm trong lĩnh vực BĐS.","B":"Cam kết tiếp tục triển khai dự án theo đúng nội dung đã được phê duyệt.","C":"Phải hoàn thành 50% nghĩa vụ tài chính về đất đai của dự án.","D":"Không nợ thuế quá 60 ngày."},"answer":"B"},{"id":84,"question":"Cơ quan nào có thẩm quyền cho phép chuyển nhượng dự án do UBND cấp tỉnh quyết định chủ trương đầu tư?","options":{"A":"Sở Xây dựng cấp tỉnh.","B":"Bộ Xây dựng.","C":"Ủy ban nhân dân cấp tỉnh.","D":"Thủ tướng Chính phủ."},"answer":"C"},{"id":85,"question":"Theo Luật Kinh doanh bất động sản 2023 , trường hợp nào đất đã có hạ tầng kỹ thuật trong dự án bất động sản không được chuyển nhượng quyền sử dụng đất cho cá nhân tự xây dựng nhà ở","options":{"A":"Đất nông nghiệp vùng sâu vùng xa.","B":"Đất thuộc khu vực Phường thuộc đô thị loại đặc biệt, loại I, loại II và loại III.","C":"Đất ở nông thôn mới hoàn thiện hạ tầng.","D":"Xã ven đô thị loại đặc biệt."},"answer":"B"},{"id":86,"question":"Chủ đầu tư dự án nhà ở thương mại chỉ được phân lô, bán nền đối với phần diện tích nào?","options":{"A":"Toàn bộ diện tích đất ở của dự án.","B":"Đối với phần diện tích đất Không thuộc khu vực phường, thành phố của đô thị loại đặc biệt, loại I, loại II và loại III.","C":"Phần diện tích đất xây dựng nhà ở cao tầng.","D":"Đất ở thuộc khu vực chưa cần xây dựng nhà ở ngay."},"answer":"B"},{"id":87,"question":"Theo quy định của Luật kinh doanh bất động sản 2023, Hợp đồng kinh doanh bất động sản mà ít nhất một bên tham gia giao dịch là doanh nghiệp kinh doanh bất động sản có bắt buộc công chứng hoặc chứng thực không ?","options":{"A":"Bắt buộc phải công chứng trong mọi trường hợp.","B":"Được công chứng hoặc chứng thực theo yêu cầu của các bên.","C":"Phải có xác nhận của cơ quan đăng ký đất đai.","D":"Phải được lập thành văn bản và có chữ ký người đại diện pháp luật."},"answer":"B"},{"id":88,"question":"Khi phân chia di sản là bất động sản theo pháp luật, nếu hàng thừa kế thứ nhất còn đầy đủ (vợ, 2 con), thì những người ở hàng thừa kế thứ hai (ví dụ: anh trai của người chết) có được hưởng thừa kế không?","options":{"A":"Có, được chia một phần nhỏ hơn.","B":"Có, nếu được những người hàng thứ nhất đồng ý.","C":"Không, vì những người ở hàng sau chỉ được hưởng nếu không còn ai ở hàng trước.","D":"Chỉ được hưởng nếu di sản có giá trị rất lớn."},"answer":"C"},{"id":89,"question":"Việc chuyển nhượng hợp đồng mua bán nhà ở hình thành trong tương lai yêu cầu gì?","options":{"A":"Phải có sự đồng ý bằng văn bản của chủ đầu tư.","B":"Phải được công chứng và thông báo cho cơ quan thuế.","C":"Hợp đồng hợp đồng mua bán nhà ở hình thành trong tương lai không có tranh chấp","D":"Chỉ được thực hiện sau khi có Giấy chứng nhận quyền sử dụng đất."},"answer":"C"},{"id":90,"question":"Hình thức công khai thông tin dự án BĐS nào là bắt buộc theo quy định?","options":{"A":"Tại cổng thông tin Sở Xây dựng và địa điểm kinh doanh.","B":"Trên trang điện tử của chủ đầu tư, Hệ thống thông tin về nhà ở và thị trường BĐS của Bộ Xây dựng và tại Sàn giao dịch BĐS (nếu có).","C":"Chỉ cần trên trang điện tử của doanh nghiệp.","D":"Tại trang điện tử chủ đầu tư và trụ sở Ban quản lý."},"answer":"B"},{"id":91,"question":"Hành vi nào bị nghiêm cấm trong kinh doanh bất động sản theo Luật 2023?","options":{"A":"Không thực hiện đúng cam kết tiến độ xây dựng.","B":"Gian lận, lừa dối, lừa đảo trong kinh doanh bất động sản.","C":"Không thực hiện chuyển nhượng dự án cho bên thứ ba sau khi đã được chấp thuận.","D":"Tiếp tục giao dịch sau khi bị đình chỉ nhưng đã khắc phục xong lỗi."},"answer":"B"},{"id":92,"question":"Theo Luật Nhà ở 2023, tổ chức, cá nhân nước ngoài được sở hữu nhà ở tại Việt Nam trong khu vực nào?","options":{"A":"Trong bất kỳ dự án nhà ở thương mại nào trên toàn quốc.","B":"Trong dự án đầu tư xây dựng nhà ở, trừ dự án thuộc khu vực cần bảo đảm quốc phòng, an ninh theo quy định của pháp luật Việt Nam.","C":"Chỉ được sở hữu nhà ở tại các khu công nghiệp, khu kinh tế.","D":"Trong dự án nhà ở thương mại đã hoàn thành xây dựng và có Giấy chứng nhận."},"answer":"B"},{"id":93,"question":"Hợp đồng cho thuê nhà ở với thời hạn 5 tháng có bắt buộc phải công chứng hoặc chứng thực không?","options":{"A":"Bắt buộc công chứng.","B":"Bắt buộc chứng thực.","C":"Không bắt buộc, trừ khi các bên có nhu cầu.","D":"Bắt buộc nếu giá thuê trên 10 triệu/tháng."},"answer":"C"},{"id":94,"question":"Định nghĩa \"Nhà chung cư\" theo Điều 2 Luật Nhà ở 2023 bao gồm đặc điểm nào?","options":{"A":"Phải có ít nhất 5 tầng và 100 căn hộ.","B":"Có từ 02 tầng trở lên, có nhiều căn hộ, có lối đi, cầu thang chung, có phần sở hữu riêng, phần sở hữu chung.","C":"Chỉ bao gồm các tòa nhà văn phòng cho thuê.","D":"Luôn thuộc sở hữu toàn dân do Nhà nước quản lý."},"answer":"B"},{"id":95,"question":"Việc công nhận quyền sở hữu nhà ở được Nhà nước thực hiện thông qua hình thức nào theo Luật Nhà ở 2023?","options":{"A":"Thông qua hợp đồng mua bán có công chứng.","B":"Thông qua việc cấp Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất (trừ nhà ở thuộc tài sản công).","C":"Thông qua biên bản bàn giao nhà giữa các bên.","D":"Thông qua việc đăng ký tạm trú, thường trú."},"answer":"B"},{"id":96,"question":"Đối tượng nước ngoài nào được sở hữu nhà ở tại Việt Nam theo Luật Nhà ở 2023?","options":{"A":"Cá nhân nước ngoài thuộc diện được miễn thị thực.","B":"Tổ chức nước ngoài có vốn đầu tư tại Việt Nam từ 100 tỷ đồng.","C":"Tổ chức, cá nhân nước ngoài đầu tư xây dựng nhà ở theo dự án tại Việt Nam.","D":"Tổ chức nước ngoài có trụ sở hoặc văn phòng đại diện tại Việt Nam."},"answer":"C"},{"id":97,"question":"Cá nhân nước ngoài được sở hữu tối đa bao nhiêu căn nhà ở riêng lẻ trong một dự án?","options":{"A":"Không quá 10% tổng số lượng nhà ở riêng lẻ trong dự án.","B":"Không quá 30% tổng số lượng nhà ở riêng lẻ trong dự án.","C":"Không quá 250 căn nhà ở riêng lẻ.","D":"Không giới hạn số lượng."},"answer":"C"},{"id":98,"question":"Điều kiện nào sau đây KHÔNG phải là điều kiện bắt buộc để chủ đầu tư được bán nhà ở hình thành trong tương lai theo Luật KD BĐS 2023?","options":{"A":"Có giấy tờ về quyền sử dụng đất, hồ sơ dự án, thiết kế bản vẽ thi công đã được phê duyệt.","B":"Có Giấy phép xây dựng (đối với trường hợp phải có GPXD).","C":"Đã hoàn thành việc xây dựng phần móng của nhà ở.","D":"Đã hoàn thành việc xây dựng toàn bộ phần thô của nhà ở."},"answer":"D"},{"id":99,"question":"Thời gian tối thiểu người mua nhà ở xã hội (NƠXH) được phép bán lại là bao lâu?","options":{"A":"Tối thiểu 05 năm.","B":"Tối thiểu 08 năm.","C":"Tối thiểu 10 năm.","D":"Tối thiểu 03 năm."},"answer":"A"},{"id":100,"question":"Sau 05 năm, khi bán lại NƠXH dạng nhà chung cư, người bán phải thực hiện nghĩa vụ gì đối với Nhà nước?","options":{"A":"Nộp 50% tiền sử dụng đất được phân bổ.","B":"Nộp 100% tiền sử dụng đất theo bảng giá đất hiện hành.","C":"Không phải nộp lại tiền sử dụng đất cho Nhà nước.","D":"Nộp 100% tiền sử dụng đất cho chủ đầu tư."},"answer":"C"},{"id":101,"question":"Người mua NƠXH được cho thuê lại nhà ở không?","options":{"A":"Không được phép cho thuê lại trong mọi trường hợp.","B":"Được phép cho thuê lại nhưng phải bảo đảm quy định của Luật Nhà ở.","C":"Được phép cho thuê lại nếu đã thanh toán xong 50% tiền mua nhà.","D":"Chỉ được cho thuê lại khi đã đủ 08 năm."},"answer":"B"},{"id":102,"question":"Luật Nhà ở 2023 (Luật số 27/2023/QH15) định nghĩa \"Nhà ở\" như thế nào?","options":{"A":"Mọi công trình xây dựng có mái che và tường bao.","B":"Công trình xây dựng với mục đích để ở và phục vụ nhu cầu sinh hoạt của gia đình, cá nhân.","C":"Chỉ bao gồm các căn hộ trong dự án nhà ở thương mại.","D":"Công trình được sử dụng cho cả mục đích ở và sản xuất công nghiệp."},"answer":"B"},{"id":103,"question":"Gia đình chị Hoa (gồm 2 vợ chồng) có tổng thu nhập hàng tháng sau khi trừ các khoản đóng góp bắt buộc là 35 triệu đồng. Gia đình chị chưa có nhà ở và có hộ khẩu tại tỉnh X. Gia đình chị có đủ điều kiện về thu nhập để mua NOXH tại tỉnh X không?","options":{"A":"Đủ điều kiện vì chưa có nhà ở.","B":"Đủ điều kiện vì tổng thu nhập hộ gia đình của người đó có tổng thu nhập bình quân hàng tháng thực nhận không quá 50 triệu đồng .","C":"Đủ điều kiện nếu chứng minh được chi phí sinh hoạt cao.","D":"Chỉ đủ điều kiện nếu có con nhỏ."},"answer":"B"},{"id":104,"question":"Nếu một cá nhân mua căn hộ chung cư sau khi kết hôn và không dùng tài sản riêng, cũng không được tặng cho riêng hay thừa kế riêng, thì việc thế chấp căn hộ này sau đó cần sự đồng ý của ai?","options":{"A":"Chỉ cần người đứng tên trên hợp đồng mua bán.","B":"Chỉ cần người đứng tên trên Giấy chứng nhận (nếu đã có).","C":"Cần sự thỏa thuận bằng văn bản của cả hai vợ chồng.","D":"Chỉ cần thông báo cho người vợ/chồng còn lại."},"answer":"C"},{"id":105,"question":"Ông Tuấn mua một căn hộ tại dự án A. Khi ký hợp đồng, chủ đầu tư yêu cầu ông đóng 2% phí bảo trì tính trên giá bán đã bao gồm VAT. Yêu cầu này có đúng quy định không?","options":{"A":"Đúng, phí bảo trì 2% tính trên tổng giá trị hợp đồng.","B":"Không đúng, phí bảo trì 2% phải được tính trên giá bán căn hộ trước thuế VAT.","C":"Đúng, nếu được ghi rõ trong hợp đồng.","D":"Không đúng, phí bảo trì chỉ 1.5%."},"answer":"B"},{"id":106,"question":"Theo Luật Đất đai 2024, Giấy chứng nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất là gì?","options":{"A":"Là văn bản của cơ quan có thẩm quyền cho phép người sử dụng đất thực hiện các quyền chuyển nhượng, tặng cho.","B":"Là văn bản hành chính do Ủy ban nhân dân cấp tỉnh ban hành để quản lý đất đai.","C":"Là tài liệu ghi nhận sự thỏa thuận về quyền sử dụng đất giữa Nhà nước và người sử dụng đất.","D":"Là chứng thư pháp lý để Nhà nước xác nhận quyền sử dụng đất, quyền sở hữu tài sản gắn liền với đất hợp pháp của người có quyền."},"answer":"D"},{"id":107,"question":"Trường hợp thửa đất là tài sản chung của vợ và chồng, nguyên tắc ghi tên trên GCN được quy định như thế nào?","options":{"A":"Bắt buộc phải ghi tên người chồng (hoặc người vợ) làm đại diện.","B":"Ghi tên một người đại diện cho hộ gia đình.","C":"Phải ghi cả họ, tên vợ và họ, tên chồng, trừ trường hợp vợ và chồng có thỏa thuận ghi tên một người.","D":"Chỉ ghi tên người đứng tên trong hồ sơ giao đất, cho thuê đất ban đầu."},"answer":"C"},{"id":108,"question":"Việc xác định quyền sử dụng đất của dự án chung cư (ổn định lâu dài hay có thời hạn) thuộc phạm vi điều chỉnh chính của luật nào?","options":{"A":"Luật Nhà ở 2023.","B":"Luật Kinh doanh bất động sản 2023.","C":"Luật Xây dựng.","D":"Luật Đất đai 2024."},"answer":"D"},{"id":109,"question":"Nguyên tắc bồi thường về đất khi Nhà nước thu hồi đất là gì?","options":{"A":"Luôn bồi thường bằng tiền mặt.","B":"Bồi thường bằng việc giao đất cùng mục đích sử dụng; nếu không có đất thì bồi thường bằng tiền theo giá đất cụ thể tại thời điểm phê duyệt phương án.","C":"Chỉ bồi thường cho đất ở, không bồi thường cho đất nông nghiệp.","D":"Bồi thường theo giá đất trong Bảng giá đất hàng năm."},"answer":"B"},{"id":110,"question":"Một doanh nghiệp thuê đất trả tiền hàng năm muốn vay vốn ngân hàng, doanh nghiệp có quyền thế chấp gì?","options":{"A":"Thế chấp quyền sử dụng đất tại ngân hàng.","B":"Thế chấp tài sản thuộc sở hữu gắn liền với đất tại tổ chức tín dụng.","C":"Thế chấp quyền thuê đất tại tổ chức tín dụng.","D":"Không có quyền thế chấp bất kỳ tài sản nào."},"answer":"B"},{"id":111,"question":"Khi hết thời hạn thuê đất hàng năm, chủ đầu tư dự án nhà ở xã hội được xử lý thế nào theo Luật Đất đai 2024?","options":{"A":"Phải làm thủ tục xin gia hạn tối thiểu 06 tháng trước khi hết hạn.","B":"Khi hết thời hạn, chủ đầu tư dự án nhà ở xã hội nếu có nhu cầu tiếp tục sử dụng thì được Nhà nước xem xét gia hạn sử dụng đất","C":"Nhà nước sẽ thu hồi đất để đấu giá lại.","D":"Được gia hạn tự động không quá 20 năm."},"answer":"B"},{"id":112,"question":"Một hộ gia đình sử dụng đất ổn định từ trước 01/7/2014 không có giấy tờ thì có được cấp Giấy chứng nhận không?","options":{"A":"Có, nếu sử dụng ổn định và không tranh chấp.","B":"Không, vì đã quá thời hạn đăng ký.","C":"Chỉ được cấp nếu sử dụng đất trước năm 1993.","D":"Có, nhưng phải nộp hồ sơ trước ngày 01/01/2025."},"answer":"A"},{"id":113,"question":"Tổ chức được Nhà nước giao đất có thu tiền hoặc thuê đất trả tiền một lần có được bồi thường về đất khi bị thu hồi không?","options":{"A":"Được bồi thường giá trị quyền sử dụng đất.","B":"Được bồi thường về đất","C":"Được bồi thường 50% giá trị đất theo bảng giá.","D":"Được bồi thường theo giá thị trường."},"answer":"B"},{"id":114,"question":"Công ty A được Nhà nước cho thuê 5ha đất trong Khu Công nghiệp X để xây dựng nhà xưởng, trả tiền thuê đất hằng năm. Sau 5 năm hoạt động, Công ty A muốn chuyển nhượng toàn bộ dự án và quyền sử dụng đất này cho Công ty B. Theo Luật Đất đai 2024, Công ty A có thể thực hiện giao dịch này không?","options":{"A":"Có, được phép chuyển nhượng QSDĐ như đất trả tiền một lần.","B":"Không, vì đất thuê trả tiền hằng năm không được chuyển nhượng QSDĐ.","C":"Có, nhưng chỉ được chuyển nhượng \"quyền thuê trong hợp đồng thuê đất\" và tài sản gắn liền với đất, không phải chuyển nhượng QSDĐ.","D":"Chỉ được chuyển nhượng nếu Công ty B cũng là doanh nghiệp nhà nước."},"answer":"C"},{"id":115,"question":"Hợp đồng nào sau đây bắt buộc phải được công chứng hoặc chứng thực theo Luật Đất đai 2024?","options":{"A":"Hợp đồng cho thuê quyền sử dụng đất.","B":"Hợp đồng chuyển đổi quyền sử dụng đất nông nghiệp.","C":"Hợp đồng thế chấp quyền sử dụng đất.","D":"Hợp đồng cho thuê lại quyền sử dụng đất mà một bên là tổ chức kinh doanh bất động sản."},"answer":"C"},{"id":116,"question":"Quy định bắt buộc thanh toán qua ngân hàng theo Điều 48 Luật KD BĐS 2023 KHÔNG áp dụng cho đối tượng nào?","options":{"A":"Chủ đầu tư dự án bất động sản.","B":"Doanh nghiệp kinh doanh dịch vụ môi giới bất động sản.","C":"Cá nhân kinh doanh bất động sản quy mô nhỏ hoặc bán nhà ở không nhằm mục đích kinh doanh.","D":"Doanh nghiệp kinh doanh sàn giao dịch bất động sản."},"answer":"C"},{"id":117,"question":"Năm 2026, bà Mai được Nhà nước công nhận quyền sử dụng 100m2 đất ở do khai hoang từ năm 1990 (trước 15/10/1993), không có giấy tờ, phù hợp quy hoạch. Bà Mai có phải nộp tiền sử dụng đất không?","options":{"A":"Có, phải nộp 100% theo giá đất cụ thể.","B":"Có, phải nộp 50% theo giá đất trong Bảng giá đất.","C":"Không, trường hợp sử dụng đất ổn định trước 15/10/1993, phù hợp quy hoạch thường không phải nộp tiền sử dụng đất đối với diện tích trong hạn mức công nhận đất ở.","D":"Chỉ phải nộp lệ phí trước bạ."},"answer":"C"},{"id":118,"question":"Hình thức bắt buộc đối với hợp đồng mua bán bất động sản theo quy định chung của Luật đất đai năm 2024 là gì?","options":{"A":"Bằng lời nói.","B":"Phải lập thành văn bản, có công chứng hoặc chứng thực (trừ trường hợp luật có quy định khác).","C":"Chỉ cần lập thành văn bản.","D":"Bằng thông điệp dữ liệu điện tử."},"answer":"B"},{"id":119,"question":"Ông Thành và bà Vân ly hôn, có thỏa thuận phân chia tài sản chung là QSDĐ tại Đồng Nai. Họ muốn công chứng thỏa thuận này. Thỏa thuận phân chia tài sản chung của vợ chồng sau ly hôn liên quan đến QSDĐ có bắt buộc công chứng/chứng thực không?","options":{"A":"Không bắt buộc.","B":"Bắt buộc phải công chứng hoặc chứng thực.","C":"Chỉ bắt buộc nếu giá trị đất trên 1 tỷ đồng.","D":"Chỉ cần có xác nhận của Tòa án đã giải quyết ly hôn."},"answer":"B"},{"id":120,"question":"Trường hợp nào sau đây KHÔNG bắt buộc phải công chứng, chứng thực theo Luật Đất đai 2024?","options":{"A":"Hợp đồng chuyển nhượng quyền sử dụng đất giữa các cá nhân.","B":"Hợp đồng thế chấp quyền sử dụng đất giữa cá nhân và ngân hàng.","C":"Hợp đồng tặng cho quyền sử dụng đất giữa cha mẹ và con cái.","D":"Hợp đồng chuyển nhượng quyền sử dụng đất mà một bên là tổ chức kinh doanh bất động sản."},"answer":"D"},{"id":121,"question":"Văn bản ủy quyền liên quan đến việc thực hiện các quyền đối với bất động sản có thể được công chứng ở đâu?","options":{"A":"Chỉ tại tổ chức hành nghề công chứng nơi có bất động sản.","B":"Tại bất kỳ tổ chức hành nghề công chứng nào trên toàn quốc.","C":"Tại tổ chức hành nghề công chứng nơi người ủy quyền hoặc người được ủy quyền cư trú, hoặc nơi có bất động sản.","D":"Tại tổ chức hành nghề công chứng nơi người ủy quyền cư trú hoặc nơi có bất động sản (không bắt buộc phải là nơi đặt trụ sở của tổ chức công chứng đó)."},"answer":"D"},{"id":122,"question":"Trình tự, thủ tục đầu tư xây dựng dự án bất động sản phải thực hiện theo quy định của các pháp luật nào?","options":{"A":"Pháp luật về đầu tư, đất đai, kinh doanh bất động sản và thuế.","B":"Pháp luật về quy hoạch, xây dựng, nhà ở và đầu tư.","C":"Pháp luật về đấu thầu, xây dựng, đất đai và nhà ở.","D":"Pháp luật về quy hoạch, đầu tư, đất đai, xây dựng, nhà ở và pháp luật có liên quan."},"answer":"D"},{"id":123,"question":"Dự án đầu tư xây dựng khu đô thị được xác định là loại hình nào theo Luật Kinh doanh Bất động sản 2023?","options":{"A":"Dự án đầu tư xây dựng công trình hạ tầng kỹ thuật.","B":"Dự án bất động sản.","C":"Dự án đầu tư xây dựng khu dân cư nông thôn.","D":"Dự án đầu tư xây dựng nhà ở."},"answer":"B"},{"id":124,"question":"Vai trò của quy hoạch chi tiết tỷ lệ 1/500 trong quy trình thực hiện dự án khu đô thị là gì?","options":{"A":"Là căn cứ để xin Chấp thuận chủ trương đầu tư.","B":"Là cơ sở để lập báo cáo Đánh giá tác động môi trường.","C":"Là căn cứ pháp lý trực tiếp để lập dự án đầu tư xây dựng, cấp Giấy phép xây dựng và giao đất, cho thuê đất chi tiết.","D":"Là cơ sở để tính tiền sử dụng đất phải nộp."},"answer":"C"},{"id":125,"question":"Giao dịch chuyển đổi quyền sử dụng đất nông nghiệp giữa các hộ gia đình, cá nhân có bắt buộc phải công chứng, chứng thực theo Luật Đất đai 2024 không?","options":{"A":"Bắt buộc phải công chứng.","B":"Bắt buộc phải chứng thực tại UBND xã.","C":"Chỉ bắt buộc nếu giá trị đất lớn.","D":"Không bắt buộc, nhưng có thể công chứng/chứng thực theo yêu cầu."},"answer":"D"},{"id":126,"question":"Trình tự thực hiện một dự án đầu tư BĐS thông thường bao gồm các giai đoạn nào?","options":{"A":"Chuẩn bị đầu tư -> Thực hiện dự án -> Kết thúc đầu tư và khai thác vận hành.","B":"Chấp thuận chủ trương -> Quyết định đầu tư -> Đấu thầu -> Kết thúc.","C":"Lập quy hoạch -> Thu hồi đất -> Xây dựng -> Bàn giao.","D":"Chuẩn bị đầu tư -> Thực hiện dự án -> Thẩm định thiết kế cơ sở."},"answer":"A"},{"id":127,"question":"Vốn chủ sở hữu tối thiểu của nhà đầu tư cho dự án có quy mô sử dụng đất dưới 20 ha là?","options":{"A":"15% tổng vốn đầu tư.","B":"20% tổng vốn đầu tư.","C":"25% tổng vốn đầu tư.","D":"10% tổng vốn đầu tư."},"answer":"B"},{"id":128,"question":"Thủ tục nào theo Luật Đầu tư 2020 thường áp dụng cho các dự án BĐS quy mô lớn?","options":{"A":"Chỉ cần xin Giấy phép xây dựng.","B":"Chấp thuận chủ trương đầu tư.","C":"Chỉ cần đăng ký kinh doanh.","D":"Chỉ cần thẩm định giá đất."},"answer":"B"},{"id":129,"question":"Theo Luật Đầu tư 2020, thẩm quyền chấp thuận chủ trương đầu tư dự án nhà ở/khu đô thị có quy mô sử dụng đất trên 300 ha thuộc về ai?","options":{"A":"Ủy ban nhân dân cấp tỉnh.","B":"Bộ Xây dựng.","C":"Quốc hội.","D":"Thủ tướng Chính phủ."},"answer":"D"},{"id":130,"question":"Theo Bộ luật Dân sự (BLDS) 2015, loại tài sản nào sau đây được xem là bất động sản?","options":{"A":"Chỉ có đất đai.","B":"Đất đai; Nhà, công trình xây dựng gắn liền với đất đai; Tài sản khác gắn liền với đất đai, nhà, công trình xây dựng; Tài sản khác do pháp luật quy định.","C":"Chỉ có nhà ở và công trình xây dựng.","D":"Chỉ có quyền sử dụng đất."},"answer":"B"},{"id":131,"question":"Bên thuê bất động sản có được phép cho thuê lại không?","options":{"A":"Không được phép trong mọi trường hợp.","B":"Được phép nếu có sự đồng ý bằng văn bản của bên cho thuê.","C":"Chỉ được phép khi thời hạn thuê còn trên 1 năm.","D":"Được phép tự do mà không cần sự đồng ý."},"answer":"B"},{"id":132,"question":"Hợp đồng được giao kết hợp pháp có hiệu lực từ thời điểm nào?","options":{"A":"Từ thời điểm các bên ký kết văn bản hợp đồng.","B":"Từ thời điểm hợp đồng được công chứng, chứng thực theo quy định của pháp luật.","C":"Từ thời điểm các bên hoàn thành nghĩa vụ chính.","D":"Từ thời điểm giao kết, trừ trường hợp có thỏa thuận khác hoặc luật liên quan có quy định khác."},"answer":"D"},{"id":133,"question":"Trụ sở của pháp nhân được xác định là nơi nào?","options":{"A":"Nơi đặt trụ sở chính và địa điểm liên lạc.","B":"Địa điểm diễn ra phần lớn các hoạt động kinh doanh.","C":"Nơi đặt cơ quan điều hành và được ghi trong điều lệ hoặc quyết định thành lập.","D":"Nơi đăng ký văn phòng giao dịch chính thức."},"answer":"C"},{"id":134,"question":"Hàng thừa kế thứ hai theo pháp luật (Điều 651 BLDS 2015) chỉ được hưởng thừa kế khi nào?","options":{"A":"Khi không còn ai ở hàng thừa kế thứ nhất hoặc những người đó không có quyền hưởng, từ chối nhận hoặc đã chết.","B":"Khi tổng giá trị di sản vượt quá một mức nhất định.","C":"Khi được những người ở hàng thừa kế thứ nhất đồng ý nhường.","D":"Khi di chúc chỉ định họ là người hưởng một phần di sản."},"answer":"A"},{"id":135,"question":"Hình thức của giao dịch dân sự bao gồm những gì?","options":{"A":"Lời nói và văn bản.","B":"Văn bản có công chứng và văn bản thông thường.","C":"Lời nói, văn bản hoặc hành vi cụ thể.","D":"Chỉ bằng văn bản đối với bất động sản."},"answer":"C"},{"id":136,"question":"Hợp đồng dân sự được giao kết hợp pháp có hiệu lực từ thời điểm nào?","options":{"A":"Thời điểm các bên bắt đầu thực hiện nghĩa vụ.","B":"Thời điểm hợp đồng được giao kết.","C":"Thời điểm hợp đồng được công chứng.","D":"Thời điểm hợp đồng được lập thành văn bản."},"answer":"B"},{"id":137,"question":"Trường hợp nào sau đây KHÔNG thuộc diện người thừa kế không phụ thuộc vào nội dung di chúc theo Điều 644 BLDS 2015?","options":{"A":"Con đã thành niên nhưng đang thất nghiệp.","B":"Cha, mẹ nuôi hợp pháp của người để lại di sản.","C":"Vợ đang mang thai tại thời điểm người chồng chết.","D":"Con thành niên bị mất khả năng lao động hoàn toàn do tai nạn."},"answer":"A"},{"id":138,"question":"Doanh nghiệp BĐS X bán căn hộ cho khách hàng Y và thu tiền đợt đầu là 30%. Sau đó, dự án bị chậm tiến độ nghiêm trọng so với cam kết trong hợp đồng. Khách hàng Y có quyền gì trong trường hợp này?","options":{"A":"Chỉ có thể chờ đợi chủ đầu tư tiếp tục xây dựng.","B":"Có quyền tạm dừng thanh toán các đợt tiếp theo và yêu cầu bồi thường thiệt hại (nếu có) hoặc thỏa thuận lại tiến độ.","C":"Phải tiếp tục thanh toán theo đúng lịch trong hợp đồng.","D":"Có quyền yêu cầu ngân hàng bảo lãnh trả lại tiền ngay lập tức."},"answer":"B"},{"id":139,"question":"Hợp đồng tặng cho bất động sản có hiệu lực kể từ thời điểm nào nếu bất động sản đó phải đăng ký quyền sở hữu?","options":{"A":"Kể từ thời điểm các bên ký hợp đồng.","B":"Kể từ thời điểm hợp đồng được công chứng/chứng thực.","C":"Kể từ thời điểm đăng ký quyền sở hữu.","D":"Kể từ thời điểm bên được tặng cho nhận tài sản."},"answer":"C"},{"id":140,"question":"Công chứng viên hoặc người có thẩm quyền chứng thực tại UBND cấp xã có được phép công chứng, chứng thực di chúc nếu con của họ là người được hưởng thừa kế theo di chúc đó không?","options":{"A":"Được phép nếu người lập di chúc đồng ý.","B":"Được phép nếu giá trị di sản không lớn.","C":"Không được phép.","D":"Chỉ không được phép nếu chính họ là người hưởng thừa kế."},"answer":"C"},{"id":141,"question":"Ông N muốn bán căn nhà đứng tên mình. Ông N đã ly hôn bà T cách đây 5 năm và căn nhà này được tạo lập trong thời kỳ hôn nhân nhưng Tòa án chưa phân chia khi ly hôn. Ông N có thể tự mình bán căn nhà này không?","options":{"A":"Có, vì đã ly hôn và nhà đứng tên ông N.","B":"Có, nhưng phải trích một nửa tiền bán nhà cho bà T.","C":"Chỉ cần thông báo cho bà T biết về việc bán nhà.","D":"Không, vì đây vẫn được xem là tài sản chung chưa chia sau ly hôn, việc bán cần có sự đồng ý của bà T hoặc quyết định của Tòa án về phân chia tài sản."},"answer":"D"},{"id":142,"question":"Theo Luật Công chứng 2024, tổ chức hành nghề công chứng bao gồm những loại hình nào?","options":{"A":"Chỉ có Phòng Công chứng.","B":"Chỉ có Văn phòng công chứng.","C":"Phòng Công chứng và Văn phòng công chứng.","D":"Văn phòng công chứng và Công ty luật có chức năng công chứng."},"answer":"C"},{"id":143,"question":"Trường hợp nào sau đây vẫn bắt buộc phải công chứng hoặc chứng thực theo quy định của Luật Đất đai 2024?","options":{"A":"Hợp đồng cho thuê Quyền sử dụng đất giữa hai doanh nghiệp.","B":"Hợp đồng chuyển nhượng Quyền sử dụng đất mà một bên là doanh nghiệp kinh doanh BĐS.","C":"Văn bản về thừa kế Quyền sử dụng đất giữa các cá nhân.","D":"Hợp đồng chuyển đổi Quyền sử dụng đất nông nghiệp."},"answer":"C"},{"id":144,"question":"Di chúc miệng chỉ được công nhận hợp pháp trong điều kiện nào sau đây?","options":{"A":"Người lập di chúc minh mẫn và có ít nhất 1 người làm chứng.","B":"Tính mạng người lập di chúc bị đe dọa không thể lập di chúc viết, có ít nhất 2 người làm chứng ghi chép lại ngay và ký tên/điểm chỉ.","C":"Người lập di chúc trên 70 tuổi và không biết chữ.","D":"Di chúc được ghi âm và có xác nhận của người thân."},"answer":"B"},{"id":145,"question":"Điểm mới quan trọng nhất của Luật Công chứng 2024 là gì?","options":{"A":"Tăng lệ phí công chứng.","B":"Bỏ hoàn toàn Văn phòng công chứng.","C":"Quy định về công chứng điện tử.","D":"Yêu cầu công chứng viên phải là Thẩm phán."},"answer":"C"},{"id":146,"question":"Thẩm quyền chứng thực bản sao từ bản chính thuộc về cơ quan nào?","options":{"A":"Văn phòng công chứng.","B":"Sở Tư pháp.","C":"Ủy ban nhân dân cấp xã.","D":"Cơ quan Tài nguyên và Môi trường."},"answer":"C"},{"id":147,"question":"Theo BLDS 2015, trong hợp đồng mua bán bất động sản, bên bán có nghĩa vụ chịu trách nhiệm về khuyết tật của tài sản không?","options":{"A":"Không, bên mua phải tự kiểm tra trước khi nhận.","B":"Có, luôn phải chịu trách nhiệm về mọi khuyết tật.","C":"Có, phải chịu trách nhiệm trừ khi có thỏa thuận khác hoặc bên mua biết hoặc phải biết về khuyết tật đó.","D":"Chỉ chịu trách nhiệm đối với khuyết tật ẩn giấu."},"answer":"C"},{"id":148,"question":"Loại hình doanh nghiệp nào mà thành viên chịu trách nhiệm hữu hạn trong phạm vi vốn góp và không được phát hành cổ phần?","options":{"A":"Công ty Cổ phần.","B":"Doanh nghiệp Tư nhân.","C":"Công ty Hợp danh.","D":"Công ty Trách nhiệm hữu hạn."},"answer":"D"},{"id":149,"question":"Luật Kinh doanh BĐS 2023 ghi nhận chủ thể nào, bên cạnh doanh nghiệp, được phép kinh doanh BĐS?","options":{"A":"Chỉ tổ chức phi chính phủ.","B":"Hộ kinh doanh cá thể.","C":"Hợp tác xã, liên hiệp hợp tác xã.","D":"Quỹ đầu tư."},"answer":"C"},{"id":150,"question":"Hậu quả pháp lý trực tiếp của việc một giao dịch dân sự về bất động sản có mục đích hoặc nội dung vi phạm điều cấm của luật hoặc trái đạo đức xã hội là gì?","options":{"A":"Giao dịch chỉ bị hạn chế hiệu lực.","B":"Giao dịch bị coi là vô hiệu.","C":"Các bên phải thỏa thuận lại nội dung.","D":"Chỉ bên vi phạm phải chịu trách nhiệm."},"answer":"B"},{"id":151,"question":"Việc không công khai thông tin về BĐS, dự án BĐS theo quy định có phải là hành vi bị cấm không?","options":{"A":"Không, chỉ là thiếu sót nhỏ.","B":"Chỉ bị nhắc nhở.","C":"Có, đây là hành vi bị nghiêm cấm theo Luật kinh doanh BĐS 2023.","D":"Chỉ bị cấm nếu gây hậu quả nghiêm trọng."},"answer":"C"},{"id":152,"question":"Mức giao dịch tiền mặt hoặc ngoại tệ tiền mặt có giá trị lớn phải báo cáo theo Quyết định 11/2023/QĐ-TTg là bao nhiêu?","options":{"A":"Từ 100 triệu đồng trở lên.","B":"Từ 300 triệu đồng trở lên.","C":"Từ 400 triệu đồng trở lên.","D":"Từ 500 triệu đồng trở lên."},"answer":"C"},{"id":153,"question":"Thời hạn SỞ HỮU nhà chung cư theo Luật Nhà ở 2023 được xác định như thế nào?","options":{"A":"Có thời hạn theo thời hạn sử dụng đất của dự án.","B":"Có thời hạn theo thiết kế của tòa nhà (ví dụ 50 năm, 70 năm).","C":"Không quy định thời hạn sở hữu, chỉ có thời hạn sử dụng theo hồ sơ thiết kế và kết luận kiểm định. Quyền sử dụng đất là ổn định lâu dài.","D":"Phụ thuộc vào thỏa thuận trong hợp đồng mua bán."},"answer":"C"},{"id":154,"question":"Hoạt động kinh doanh bất động sản tại Việt Nam chịu sự điều chỉnh của những luật cốt lõi nào?","options":{"A":"Chỉ Luật Kinh doanh bất động sản.","B":"Luật Kinh doanh bất động sản, Luật Doanh nghiệp, Luật Đầu tư, Luật Đất đai, Luật Nhà ở.","C":"Chỉ Luật Đất đai và Luật Nhà ở.","D":"Luật Doanh nghiệp và Luật Đầu tư."},"answer":"B"},{"id":155,"question":"Doanh nghiệp kinh doanh BĐS có bắt buộc phải đăng ký ngành nghề kinh doanh BĐS là ngành chính không?","options":{"A":"Bắt buộc vì đây là ngành nghề có điều kiện.","B":"Không bắt buộc, miễn là đáp ứng đủ điều kiện kinh doanh theo pháp luật.","C":"Bắt buộc đối với Doanh nghiệp tư nhân.","D":"Không bắt buộc nhưng phải chiếm tỷ trọng doanh thu lớn nhất."},"answer":"B"},{"id":156,"question":"Thời hạn cấp Giấy chứng nhận đăng ký doanh nghiệp kể từ ngày nhận đủ hồ sơ hợp lệ là bao lâu?","options":{"A":"03 ngày làm việc.","B":"05 ngày làm việc.","C":"07 ngày làm việc.","D":"10 ngày làm việc."},"answer":"A"},{"id":157,"question":"Trong thủ tục tách thửa đất, nếu bản đồ giải thửa do đơn vị đo đạc không chính xác, hậu quả có thể là:","options":{"A":"Quá trình tách thửa bị chậm và có thể phải điều chỉnh lại bản đồ","B":"Giấy chứng nhận được cấp mà không cần điều chỉnh","C":"Doanh nghiệp chịu thêm lệ phí xử lý hồ sơ","D":"Hệ thống đăng ký đất tự động cập nhật thông tin đúng"},"answer":"A"},{"id":158,"question":"Hợp đồng mua bán nhà ở, công trình xây dựng giữa các cá nhân với nhau có bắt buộc công chứng/chứng thực theo Luật Kinh doanh Bất động sản (KD BĐS) 2023 không?","options":{"A":"Không, chỉ cần lập văn bản.","B":"Có, bắt buộc phải công chứng hoặc chứng thực.","C":"Chỉ bắt buộc nếu giá trị trên 1 tỷ đồng.","D":"Theo yêu cầu của một trong các bên."},"answer":"B"},{"id":159,"question":"Trường hợp nào sau đây áp dụng thừa kế theo pháp luật?","options":{"A":"Chỉ khi người chết không để lại di chúc.","B":"Khi không có di chúc, di chúc không hợp pháp, người thừa kế theo di chúc chết trước/cùng thời điểm, từ chối/không có quyền hưởng, hoặc di chúc chỉ định đoạt một phần di sản.","C":"Chỉ khi di chúc bị Tòa án tuyên vô hiệu.","D":"Chỉ khi người thừa kế duy nhất theo di chúc từ chối nhận di sản."},"answer":"B"},{"id":160,"question":"Trong một giao dịch mua bán bất động sản, hai bên sử dụng “vi bằng” thay cho hợp đồng công chứng. Hệ quả của việc này là:","options":{"A":"Vi bằng có giá trị pháp lý như hợp đồng công chứng","B":"Người mua có thể không được đảm bảo quyền sử dụng tài sản do không có căn cứ pháp lý cao","C":"Vi bằng giúp giảm chi phí giao dịch mà không có rủi ro pháp lý","D":"Vi bằng chỉ áp dụng đối với giao dịch thương mại, không phải bất động sản"},"answer":"B"},{"id":161,"question":"Anh Nguyễn là người bán bất động sản, đây là bất động sản duy nhất anh sở hữu và đã giữ trên 183 ngày. Khi thực hiện giao dịch chuyển nhượng, anh Nguyễn có phải đóng Thuế Thu Nhập Cá Nhân không?","options":{"A":"Có, tính theo 2% giá trị chuyển nhượng","B":"Không, được miễn theo quy định","C":"Có, nhưng tính theo biểu thuế lũy tiến","D":"Không, nhưng phải đóng lệ phí công chứng"},"answer":"B"},{"id":162,"question":"Doanh thu tính thuế TNDN đối với hoạt động cho thuê BĐS là số tiền nào?","options":{"A":"Tổng số tiền thuê đã thu trong năm tính thuế.","B":"Số tiền thuê trả từng kỳ theo hợp đồng thuê.","C":"Số tiền ghi nhận một lần tại thời điểm ký hợp đồng.","D":"Số tiền sau khi đã trừ đi chi phí môi giới."},"answer":"B"},{"id":163,"question":"Theo Luật Thuế thu nhập cá nhân và các văn bản hướng dẫn, trong trường hợp nào cá nhân được miễn thuế TNCN khi chuyển nhượng nhà ở, đất ở?","options":{"A":"Khi chuyển nhượng nhà ở, quyền sử dụng đất ở duy nhất của cá nhân đó.","B":"Khi chuyển nhượng bất kỳ loại bất động sản nào có giá trị dưới 1 tỷ đồng.","C":"Khi chuyển nhượng nhà ở trong vòng 5 năm kể từ ngày mua..","D":"Khi chuyển nhượng bất động sản cho bạn thân."},"answer":"A"},{"id":164,"question":"Chủ đầu tư khi bán bất động sản phải nộp những loại thuế gì sau đây?","options":{"A":"Thuế thu nhập doanh nghiệp.","B":"Thuế chuyển nhượng bất động sản.","C":"Không phải nộp thuế.","D":"Thuế trước bạ."},"answer":"A"},{"id":165,"question":"Theo Luật phòng chống rửa tiền 2022, \"Rửa tiền\" được định nghĩa là gì?","options":{"A":"Hành vi che giấu nguồn gốc tài sản hợp pháp.","B":"Hành vi sử dụng tài sản để tài trợ khủng bố.","C":"Hành vi của tổ chức, cá nhân nhằm hợp pháp hóa nguồn gốc của tài sản do phạm tội mà có.","D":"Hành vi không báo cáo giao dịch đáng ngờ."},"answer":"C"},{"id":166,"question":"Mức giao dịch tiền mặt có giá trị lớn phải báo cáo theo luật phòng chống rửa tiền hiện hành theo Quyết định 11/2023/QĐ-TTg là bao nhiêu?","options":{"A":"Từ 300 triệu đồng trở lên.","B":"Từ 400 triệu đồng trở lên.","C":"Từ 500 triệu đồng trở lên.","D":"Không quy định mức cụ thể, tùy thuộc vào đánh giá rủi ro."},"answer":"B"},{"id":167,"question":"Ai chịu trách nhiệm chính trong việc triển khai các biện pháp phòng chống rửa tiền tại một doanh nghiệp kinh doanh bất động sản?","options":{"A":"Nhân viên môi giới.","B":"Khách hàng.","C":"Doanh nghiệp bất động sản đó (Đối tượng báo cáo).","D":"Ngân hàng Nhà nước."},"answer":"C"},{"id":168,"question":"Đối tượng báo cáo trong lĩnh vực kinh doanh BĐS theo Luật Phòng, chống rửa tiền 2022 gồm những ai?","options":{"A":"Tổ chức, cá nhân kinh doanh dịch vụ quản lý, tư vấn, sàn giao dịch BĐS, thuê, cho thuê mua BĐS.","B":"Chỉ gồm sàn giao dịch BĐS và doanh nghiệp phát triển dự án.","C":"Tất cả cá nhân tham gia giao dịch mua bán nhà đất.","D":"Tổ chức kinh doanh BĐS có giao dịch từ 500 triệu đồng trở lên."},"answer":"A"},{"id":169,"question":"Mức giá trị giao dịch phải báo cáo (giao dịch lớn) đối với kinh doanh BĐS hiện nay là bao nhiêu?","options":{"A":"Từ 300 triệu đồng trở lên.","B":"Từ 400 triệu đồng trở lên.","C":"Từ 500 triệu đồng trở lên.","D":"Từ 01 tỷ đồng trở lên."},"answer":"B"},{"id":170,"question":"Theo Luật Phòng, chống rửa tiền 2022, tổ chức, cá nhân kinh doanh bất động sản (trừ cho thuê, tư vấn) có nghĩa vụ báo cáo giao dịch đáng ngờ (STR) không?","options":{"A":"Không, chỉ ngân hàng mới phải báo cáo.","B":"Chỉ báo cáo khi có yêu cầu của cơ quan công an.","C":"Có, đây là một trong các nghĩa vụ phòng chống rửa tiền.","D":"Chỉ báo cáo các giao dịch trên 1 tỷ đồng."},"answer":"C"},{"id":171,"question":"Nghĩa vụ báo cáo giao dịch có giá trị lớn (LCTR) theo Luật Phòng, chống rửa tiền áp dụng cho loại giao dịch nào của tổ chức, cá nhân kinh doanh bất động sản?","options":{"A":"Mọi giao dịch bất động sản.","B":"Chỉ giao dịch mua bán bất động sản.","C":"Giao dịch bằng tiền mặt hoặc ngoại tệ tiền mặt từ 400 triệu đồng trở lên.","D":"Chỉ giao dịch với khách hàng nước ngoài."},"answer":"C"},{"id":172,"question":"Bà P cho Bà Q vay 500 triệu đồng tiền mặt để mua đất. Giao dịch này có phải báo cáo theo quy định về phòng chống rửa tiền không?","options":{"A":"Có, vì liên quan đến mua bán bất động sản.","B":"Có, vì giá trị giao dịch trên 400 triệu đồng.","C":"Không, vì đây là giao dịch cho vay cá nhân, không phải do đối tượng báo cáo (như kinh doanh BĐS, ngân hàng) thực hiện.","D":"Chỉ phải báo cáo nếu bà Q dùng tiền này mua đất qua sàn giao dịch BĐS."},"answer":"C"},{"id":173,"question":"Chủ thể nào KHÔNG phải là đối tượng báo cáo theo Luật Phòng, chống rửa tiền 2022 trong lĩnh vực bất động sản?","options":{"A":"Doanh nghiệp kinh doanh dịch vụ môi giới bất động sản.","B":"Doanh nghiệp kinh doanh sàn giao dịch bất động sản.","C":"Chủ đầu tư dự án bất động sản.","D":"Cá nhân cho thuê nhà ở của chính mình."},"answer":"D"},{"id":174,"question":"Trong trường hợp nào sau đây, người vi phạm trong lĩnh vực bất động sản sẽ không bị xử phạt vi phạm hành chính?","options":{"A":"Khi người vi phạm chưa gây thiệt hại nghiêm trọng","B":"Khi người vi phạm là tổ chức phi lợi nhuận","C":"Khi hành vi vi phạm đã hết thời hiệu xử phạt","D":"Khi người vi phạm không biết đó là hành vi bị cấm"},"answer":"C"},{"id":175,"question":"Yếu tố nào là quan trọng nhất ảnh hưởng trực tiếp đến giá trị của bất động sản đất đai?","options":{"A":"Diện tích và vị trí thửa đất.","B":"Mục đích sử dụng đất và thời hạn sử dụng đất.","C":"Tình trạng pháp lý người sử dụng.","D":"Hình dạng thửa đất."},"answer":"B"},{"id":176,"question":"Ông Dũng đang sử dụng 5ha đất trồng cây lâu năm do Nhà nước giao không thu tiền tại tỉnh Đồng Nai. Nay ông muốn nhận chuyển nhượng thêm 2ha đất trồng lúa từ một hộ gia đình khác trong cùng xã. Giao dịch này có được phép không, xét về yếu tố hạn mức?","options":{"A":"Được phép, vì không vượt quá hạn mức về giao đất nông nghiệp.","B":"Không được phép, vì tổng diện tích sẽ vượt hạn mức nhận chuyển nhượng đất nông nghiệp do Nhà nước quy định.","C":"Được phép, nhưng phải chuyển 2ha đất lúa sang trồng cây lâu năm.","D":"Chỉ được phép nếu ông Dũng thành lập doanh nghiệp nông nghiệp."},"answer":"A"},{"id":177,"question":"Giấy chứng nhận QSDĐ của ông Khoa bị rách, nhòe thông tin. Ông muốn xin cấp đổi Giấy chứng nhận quyền sử dụng đất mới. Đây có phải là trường hợp đăng ký biến động không?","options":{"A":"Không, đây là thủ tục hành chính riêng.","B":"Có, việc cấp đổi Giấy chứng nhận quyền sử dụng đất là một trong các trường hợp phải đăng ký biến động theo Điều 133.","C":"Chỉ là đăng ký biến động nếu có thay đổi về diện tích.","D":"Chỉ là đăng ký biến động nếu có thay đổi về chủ sử dụng."},"answer":"B"},{"id":178,"question":"Công ty K được Nhà nước cho thuê đất thương mại, dịch vụ để xây dựng khách sạn. Trong khuôn viên khách sạn, Công ty K muốn xây thêm một số căn hộ du lịch (condotel) để bán cho khách hàng. Việc này có phù hợp không?","options":{"A":"Hoàn toàn phù hợp, không cần làm gì thêm.","B":"Không phù hợp, vì đất thương mại dịch vụ không được xây căn hộ để bán.","C":"Phù hợp nếu Công ty K xin phép chuyển đổi một phần diện tích sang đất ở (không hình thành đơn vị ở) hoặc thực hiện theo quy định pháp luật về kinh doanh BĐS đối với loại hình condotel (nếu được phép).","D":"Chỉ phù hợp nếu các căn hộ đó chỉ để cho thuê, không được bán."},"answer":"C"},{"id":179,"question":"Doanh nghiệp N được Nhà nước cho thuê đất sản xuất kinh doanh phi nông nghiệp với thời hạn 50 năm. Khi hết thời hạn 50 năm, nếu Doanh nghiệp N vẫn có nhu cầu sử dụng và chấp hành tốt pháp luật đất đai, có được xem xét gia hạn không?","options":{"A":"Không, phải trả lại đất cho Nhà nước để đấu giá lại.","B":"Có, được xem xét gia hạn sử dụng đất nếu có nhu cầu và việc sử dụng đất phù hợp với quy hoạch, nhưng phải thực hiện nghĩa vụ tài chính cho thời gian gia hạn.","C":"Chỉ được gia hạn tối đa thêm 20 năm.","D":"Được tự động gia hạn mà không cần làm thủ tục."},"answer":"B"},{"id":180,"question":"Doanh nghiệp A thuê đất của Nhà nước trả tiền một lần và xây dựng nhà xưởng. Sau đó, Doanh nghiệp A bán toàn bộ nhà xưởng và chuyển nhượng quyền sử dụng đất thuê này cho Doanh nghiệp B. Giá trị quyền sử dụng đất khi tính thuế thu nhập doanh nghiệp từ việc chuyển nhượng này được xác định như thế nào?","options":{"A":"Bằng giá trong Bảng giá đất tại thời điểm chuyển nhượng.","B":"Bằng giá trị thỏa thuận trong hợp đồng chuyển nhượng.","C":"Bằng số tiền thuê đất đã trả cho Nhà nước, được phân bổ cho thời gian thuê còn lại.","D":"Bằng không, vì là đất thuê."},"answer":"C"}],"chuyenmon":[{"id":1,"question":"Vai trò quan trọng nhất của nhà môi giới đối với thị trường bất động sản là gì?","options":{"A":"Giúp tăng giá trị bất động sản thông qua hoạt động quảng cáo.","B":"Đảm bảo tất cả các giao dịch đều có lợi nhuận cao.","C":"Là cầu nối, làm tăng tính thanh khoản và hiệu quả của thị trường.","D":"Cung cấp nguồn vốn cho các nhà đầu tư bất động sản."},"answer":"C"},{"id":2,"question":"Trong một giao dịch chuyển nhượng bất động sản của cá nhân đã kết hôn, ai là người được xác định là đối tượng tham gia ký kết hợp đồng bán?","options":{"A":"Chỉ người đứng tên trên Giấy chứng nhận quyền sử dụng đất.","B":"Bất kỳ ai trong gia đình nếu có giấy ủy quyền.","C":"Người đứng tên trên Giấy chứng nhận và người còn lại trong quan hệ vợ chồng.","D":"Chỉ cần người đứng tên trên hợp đồng mua bán trước đây."},"answer":"C"},{"id":3,"question":"Khi tiếp xúc khách hàng, để tránh sự phản ứng hay chống đối, môi giới bất động sản chuyên nghiệp cần thể hiện rõ mục tiêu gì trong công việc?","options":{"A":"Tìm kiếm thu nhập từ hoa hồng","B":"Phát triển nghề nghiệp cá nhân","C":"Vì yêu thích và phù hợp với nghề môi giới","D":"Đặt lợi ích của khách hàng song song với lợi ích của mình"},"answer":"D"},{"id":4,"question":"Trong môi giới, nghiệp vụ tư vấn vay vốn mua nhà thường được tiến hành thường xuyên và rất quan trọng. Bước đầu tiên nhà môi giới có nhiệm vụ tiếp xúc, tìm hiểu và hướng dẫn khách hàng làm thủ tục vay và những vấn đề liên quan. Trong giai đoạn này, anh ta không cần phải thực hiện nội dung nào sau đây?","options":{"A":"Xác định năng lực tài chính của khách hàng (vốn pháp định, vốn tự có, nguồn tài trợ chủ yếu, điểm hòa vốn, khả năng sinh lợi…).","B":"Tư vấn những vấn đề cụ thể mà khách hàng trình bày và tư cách pháp lý của khách hàng.","C":"Xem xét tính khả thi của phương án sản xuất kinh doanh hay dự án đầu tư của khách hàng.","D":"Tìm hiểu về tình hình hoạt động sản xuất kinh doanh của khách hàng (Doanh thu, năng lực sản xuất đầu tư, khả năng đầu tư, thị trường tiêu thụ, mạng lưới phân phối…)."},"answer":"C"},{"id":5,"question":"Một nhà môi giới bất động sản có quyền hành nghề xây dựng không?","options":{"A":"Nếu nhà môi giới này có chứng chỉ hành nghề xây dựng phù hợp theo luật quy định của Luật Xây dựng.","B":"Nếu anh ta thích làm và có đủ điều kiện và kinh nghiệm cho phép, anh ta có thể làm được.","C":"Không. Hai lĩnh vực này hoàn toàn khác nhau.","D":"Có. Muốn môi giới được thì nhà môi giới phải am hiểu nhiều khía cạnh của lĩnh vực xây dựng, do đó anh ta thừa khả năng làm điều này."},"answer":"A"},{"id":6,"question":"Kỹ năng lắng nghe tích cực (Active Listening) trong giao tiếp có mục đích gì?","options":{"A":"Để tìm ra điểm yếu và sơ hở của khách hàng để đàm phán dễ hơn.","B":"Chỉ để khách hàng cảm thấy được tôn trọng.","C":"Để hiểu rõ nhu cầu thực sự, các mối quan tâm và động cơ của khách hàng.","D":"Để xác định khách hàng có tiền sử nợ xấu hay không."},"answer":"C"},{"id":7,"question":"Ông X bán nhà đứng tên riêng nhưng ông đã kết hôn. Môi giới cần yêu cầu gì?","options":{"A":"Chỉ cần ông X cam kết tài sản riêng.","B":"Bỏ qua vì tên trên sổ đỏ chỉ có mình ông X.","C":"Yêu cầu văn bản chứng minh tài sản riêng hoặc văn bản đồng ý bán của vợ ông X.","D":"Yêu cầu ông X ly hôn để giao dịch được thực hiện."},"answer":"C"},{"id":8,"question":"Nhà hướng Tây rất nắng, môi giới nên giới thiệu thế nào?","options":{"A":"Che giấu thông tin, chỉ nói về view đẹp.","B":"Chỉ dẫn khách đi xem nhà vào buổi sáng để tránh nắng.","C":"Công khai hướng Tây và đề xuất giải pháp như rèm chống nắng, cây xanh.","D":"Nói hướng Tây là phong thủy tốt."},"answer":"C"},{"id":9,"question":"Một trong các nguyên nhân khiến giá BĐS không phản ánh đúng cung cầu là:","options":{"A":"Thông tin không hoàn hảo","B":"Tất cả giao dịch đều minh bạch","C":"Nhà nước kiểm soát chặt","D":"Giá đất cố định"},"answer":"A"},{"id":10,"question":"Phát biểu nào sau đây không đúng khi nói về tố chất cần có của một nhà môi giới bất động sản?","options":{"A":"Nhà môi giới cần có khả năng giao tiếp tốt, tạo dựng niềm tin với khách hàng.","B":"Nhà môi giới cần hiểu biết pháp luật, thị trường và sản phẩm bất động sản.","C":"Nhà môi giới cần trung thực, khách quan, đặt lợi ích khách hàng lên hàng đầu.","D":"Nhà môi giới cần thường xuyên che giấu thông tin để đạt được thỏa thuận nhanh chóng."},"answer":"D"},{"id":11,"question":"Nội dung môi giới bất động sản bao gồm?","options":{"A":"Tìm kiếm đối tác đáp ứng các điều kiện của khách hàng để tham gia đàm phán, ký kết hợp đồng.","B":"Đại diện theo ủy quyền để thực hiện các công việc liên quan đến các thủ tục mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản.","C":"Cung cấp thông tin, hỗ trợ cho các bên trong việc đàm phán, ký kết hợp đồng mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản.","D":"Tất cả các mục trên."},"answer":"D"},{"id":12,"question":"Để tránh sự phản ứng, chống đối của khách hàng khi người môi giới tiếp xúc với khách hàng, với tư cách hành nghề môi giới chuyên nghiệp, mục tiêu cần ưu tiên số 1 mà người môi giới bất động sản cần thể hiện rõ để khách hàng nhận biết được lý do khiến họ quyết định trở thành người môi giới bất động sản là:","options":{"A":"Vì hoa hồng môi giới","B":"Vì khẳng định bản thân.","C":"Vì thích nghề môi giới bất động sản.","D":"Vì lợi ích của khách hàng và của mình."},"answer":"D"},{"id":13,"question":"Khi tư vấn và lập phương án tài chính cho
