function saveDB(){store(K_DB,data)}
function saveSession(){if(state.session&&!state.session.finished)store(K_SESSION,state.session);else delstore(K_SESSION)}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(n){return new Intl.NumberFormat('vi-VN').format(n)}
function dateFmt(ts){return new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function count(s){return BANK[s].length}
function checkList(a,v){return Array.isArray(a)&&a.includes(v)}
function toast(message){const e=document.querySelector('#toast');e.textContent=message;e.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>e.style.display='none',2500)}
function header(){return `<header class="site-header"><div class="shell header-row"><button class="brand" onclick="home()"><span class="brand-mark">⌂</span><span><strong>ÔN THI MÔI GIỚI BĐS</strong><small>Vĩnh Long • Bộ đề ngày 31/10</small></span></button><div class="header-right"><span class="header-pill">350 câu • 2 học phần</span>${state.view==='home'?`<button class="header-link" onclick="browse()">⌕ Tra cứu câu hỏi</button>`:`<button class="header-link" onclick="home()">⌂ Trang chủ</button>`}</div></div></header>`}
function render(){document.getElementById('app').innerHTML=header()+`<main><div class="shell">${state.view==='home'?homePage():state.view==='setup'?setupPage():state.view==='quiz'?quizPage():state.view==='result'?resultPage():browsePage()}</div></main><footer class="site-footer"><div class="shell">Phiên bản 31/10 • Toàn bộ 180 câu Cơ sở + 170 câu Chuyên môn được nhập từ 2 PDF mới. Đáp án lấy theo phần tô vàng trong tài liệu, không phải xác nhận hiệu lực pháp luật hiện hành.<br>Dữ liệu làm bài được lưu trên trình duyệt của thiết bị này • Hoạt động không cần Internet sau khi lưu file.</div></footer>`;if(state.view==='quiz'){refreshTimer();window.scrollTo(0,0)}if(state.view==='browse')filterBrowse()}
function homePage(){let recent=data.history.slice(-4).reverse();return `<section class="hero"><div class="hero-content"><div class="eyebrow">BỘ ĐỀ VĨNH LONG 31/10 • 350 CÂU HỎI</div><h1>Chinh phục kỳ thi chứng chỉ<br>hành nghề Môi giới Bất động sản</h1><p>Đã nhập lại đầy đủ 2 bộ câu hỏi 31/10. Ôn theo từng phần, kiểm tra đáp án đánh dấu vàng, thi thử có tính giờ và luyện lại các câu làm sai.</p><div class="hero-actions"><button class="btn btn-teal" onclick="setup('coso','study')">▶ Bắt đầu ôn tập</button><button class="btn btn-outline" onclick="setup('chuyenmon','exam')">◷ Vào thi thử</button>${readJSON(K_SESSION,null)?`<button class="btn btn-outline" onclick="resume()">↺ Tiếp tục bài trước</button>`:''}</div></div></section><section class="stats"><div class="stat"><b>350</b><small>Tổng câu hỏi</small></div><div class="stat"><b>180</b><small>Kiến thức cơ sở</small></div><div class="stat"><b>170</b><small>Kiến thức chuyên môn</small></div><div class="stat"><b>${num(data.history.length)}</b><small>Lượt hoàn thành</small></div></section><div class="section-top"><h2>Chọn học phần</h2><span>Ôn tập hoặc thi thử theo từng phần</span></div><section class="subject-grid">${Object.entries(SUBJECTS).map(([key,s])=>`<article class="subject-card"><div class="subject-head"><div class="subject-icon ${key==='chuyenmon'?'cm':''}">${s.icon}</div><div><h3>${esc(s.name)}</h3><span class="subject-count">${count(key)} câu hỏi có đáp án</span></div></div><p>${esc(s.desc)}</p><div class="subject-actions"><button class="btn btn-primary" onclick="setup('${key}','study')">Ôn tập ngay →</button><button class="btn btn-light" onclick="setup('${key}','exam')">Thi thử</button>${data.wrong[key].length?`<button class="btn btn-soft" onclick="setup('${key}','wrong')">Câu sai (${data.wrong[key].length})</button>`:''}</div></article>`).join('')}</section><div class="section-top"><h2>Tiến độ gần đây</h2><button class="btn btn-sm btn-light" onclick="browse()">⌕ Tìm câu hỏi</button></div>${recent.length?`<div class="recent-list">${recent.map(h=>`<div class="history-row"><div><b>${esc(SUBJECTS[h.subject].short)} • ${esc(h.mode==='exam'?'Thi thử':'Ôn tập')}</b><small>${dateFmt(h.date)} · ${h.total} câu · Đúng ${h.correct} câu</small></div><div class="history-score">${h.percent}%</div></div>`).join('')}</div>`:`<div class="empty">🗂️<b>Chưa có kết quả làm bài</b>Sau khi hoàn thành một lần thi hoặc ôn tập, thành tích sẽ xuất hiện ở đây.</div>`}<p class="note">Lưu ý: Điểm số dùng để tự đánh giá khi ôn thi; website không tự xác định đậu/rớt vì chưa có thang chuẩn do đơn vị tổ chức kỳ thi xác nhận.</p>`}
function setup(subject='coso',mode='study'){state.subject=subject;state.mode=mode;state.view='setup';render()}
function modeChoose(mode){state.mode=mode;render()}
function setupPage(){const s=SUBJECTS[state.subject],mode=state.mode,list=mode==='wrong'?data.wrong[state.subject]:mode==='saved'?data.stars[state.subject]:BANK[state.subject].map(x=>x.id);const n=list.length;const options=[10,20,40,60,100].filter(v=>v<=n);let def=mode==='exam'?60:20;if(def>n)def=n;return `<div class="page-head"><div><div class="crumb">Trang chủ / ${esc(s.name)}</div><h1>Thiết lập buổi ${mode==='exam'?'thi thử':'ôn tập'}</h1></div><span class="pill">${n} câu khả dụng</span></div><div class="setup-grid"><section class="paper"><h2>${s.icon} ${esc(s.name)}</h2><div class="form-label">1. Chọn hình thức học</div><div class="mode-grid">${[['study','📖 Ôn tập','Chọn đáp án, bấm kiểm tra để biết đúng sai.'],['exam','⏱ Thi thử','Giữ kín đáp án đến khi nộp bài.'],['wrong','↻ Ôn câu sai',`${data.wrong[state.subject].length} câu đã trả lời sai.`],['saved','☆ Câu đánh dấu',`${data.stars[state.subject].length} câu cần ghi nhớ.`]].map(([k,label,desc])=>`<button class="mode-card ${mode===k?'active':''}" aria-pressed="${mode===k}" onclick="modeChoose('${k}')"><b>${label}</b><small>${esc(desc)}</small></button>`).join('')}</div><div class="form-row"><div><label for="numQuestions" class="form-label">2. Số câu muốn làm</label><select id="numQuestions" class="select">${options.map(n=>`<option value="${n}" ${n===def?'selected':''}>${n} câu</option>`).join('')}<option value="all" ${!options.length?'selected':''}>Toàn bộ (${n} câu)</option></select></div><div><label for="timerSelect" class="form-label">3. Thời gian</label><select id="timerSelect" class="select" ${mode!=='exam'?'disabled':''}>${[[30,'30 phút'],[45,'45 phút'],[60,'60 phút'],[90,'90 phút'],[120,'120 phút'],[0,'Không giới hạn']].map(([v,l])=>`<option value="${v}" ${v===60?'selected':''}>${l}</option>`).join('')}</select></div></div><label class="checkbox-row"><input type="checkbox" id="shuffleCheck" ${mode==='exam'?'checked':''}> Trộn thứ tự câu hỏi ngẫu nhiên</label><button class="btn btn-primary btn-full" onclick="start()" ${n===0?'disabled':''}>${mode==='exam'?'Bắt đầu thi thử':'Bắt đầu làm bài'} →</button>${!n?`<p class="note">Chưa có câu ${mode==='wrong'?'trả lời sai':'được đánh dấu'} trong học phần này. Hãy làm bài hoặc đánh dấu câu trước.</p>`:''}</section><aside class="side-note"><h3>Hướng dẫn nhanh</h3><ul><li><strong>Ôn tập:</strong> Chọn A/B/C/D, nhấn “Kiểm tra đáp án” để hiện đáp án đúng.</li><li><strong>Thi thử:</strong> Làm bài trong thời gian đã chọn; hệ thống tự chấm điểm sau khi nộp.</li><li><strong>Điều hướng:</strong> Chuyển câu trước/sau, mở bảng câu hỏi và đánh dấu câu cần xem lại.</li><li><strong>Ôn câu sai:</strong> Câu đã làm sai được lưu tự động để luyện tập tiếp.</li></ul><p>Đáp án dựa trên tài liệu bạn cung cấp, không bổ sung giải thích ngoài PDF.</p></aside></div>`}
function start(){const mode=state.mode,subject=state.subject;let pool=mode==='wrong'?[...data.wrong[subject]]:mode==='saved'?[...data.stars[subject]]:BANK[subject].map(x=>x.id);if(!pool.length){toast('Chưa có câu hỏi trong nhóm này');return}let limit=document.getElementById('numQuestions')?.value||'all';let n=limit==='all'?pool.length:Math.min(pool.length,Math.max(1,Number(limit)));const shuffle=document.getElementById('shuffleCheck')?.checked; if(shuffle){for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}pool=pool.slice(0,n);const duration=mode==='exam'?Number(document.getElementById('timerSelect').value)*60:0;state.session={subject,mode,ids:pool,index:0,answers:{},checked:{},duration,startedAt:Date.now(),finished:false};state.view='quiz';saveSession();render();timerLoop()}
function resume(){const s=readJSON(K_SESSION,null);if(!s||!BANK[s.subject]){toast('Không tìm thấy bài đang làm');return}if(!Array.isArray(s.ids)||!s.ids.every(id=>BANK[s.subject][id-1])){delstore(K_SESSION);toast('Bài cũ không thể khôi phục');return}state.session=s;state.view='quiz';render();timerLoop()}
function timerLoop(){clearInterval(tick);tick=setInterval(()=>{if(state.view!=='quiz'||!state.session||state.session.finished){clearInterval(tick);return}refreshTimer();if(state.session.duration&&Date.now()-state.session.startedAt>=state.session.duration*1000){submit(false,true)}},1000)}
function secLeft(){const s=state.session;const now=s.finished&&s.submittedAt?s.submittedAt:Date.now();return s.duration?Math.max(0,s.duration-Math.floor((now-s.startedAt)/1000)):Math.floor((now-s.startedAt)/1000)}
function formatTime(sec){let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function refreshTimer(){const el=document.querySelector('#timeValue');if(el){el.textContent=formatTime(secLeft());const wrap=document.querySelector('#timerBox');if(wrap)wrap.classList.toggle('danger',!!state.session.duration&&secLeft()<300)}}
function getQ(s=state.session){return BANK[s.subject][s.ids[s.index]-1]}
function answeredCount(s){return s.ids.filter(id=>!!s.answers[id]).length}
function gridHTML(s){return s.ids.map((id,i)=>`<button class="qnum ${s.answers[id]?'done':''} ${i===s.index?'current':''} ${checkList(data.stars[s.subject],id)?'flagged':''}" onclick="jump(${i})" aria-label="Câu ${i+1}${s.answers[id]?', đã chọn':''}" ${i===s.index?'aria-current="step"':''}>${i+1}</button>`).join('')}
function quizPage(){const s=state.session;if(!s){state.view='home';return homePage()}const q=getQ(),answer=s.answers[q.id]||'',show=s.finished||!!s.checked[q.id],grade=answer===q.answer,practice=s.mode!=='exam',total=s.ids.length,progress=answeredCount(s)/total*100;return `<div class="quiz-top"><div class="quiz-title"><b>${esc(SUBJECTS[s.subject].name)}</b><br>${s.finished?'Đang xem lại bài đã nộp':s.mode==='exam'?'Chế độ thi thử':'Chế độ ôn tập'} • Câu ${s.index+1}/${total}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${s.finished?`<span class="review-tag">✓ Đã chấm điểm</span>`:''}<div class="timer" id="timerBox">◷ <span id="timeValue">${formatTime(secLeft())}</span></div></div></div><div class="quiz-layout"><div class="quiz-main"><div class="progress-track" title="Tỷ lệ số câu đã chọn"><div class="progress-fill" style="width:${progress.toFixed(2)}%"></div></div><section class="paper"><div class="q-meta"><span class="q-label">CÂU ${s.index+1} / ${total} <span class="muted" style="font-weight:500">• Mã câu gốc ${q.id}</span></span><button class="flag ${checkList(data.stars[s.subject],q.id)?'on':''}" onclick="toggleStar()">${checkList(data.stars[s.subject],q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><h2 class="q-text">${esc(q.question)}</h2><div class="options">${Object.entries(q.options).map(([k,v])=>{let cls=show?(k===q.answer?'correct':k===answer?'wrong':''):(answer===k?'selected':'');return `<button class="option ${cls}" onclick="choose('${k}')" ${show?'disabled':''} aria-pressed="${answer===k}"><span class="letter">${k}</span><span>${esc(v)}</span></button>`}).join('')}</div>${show?`<div class="feedback ${!answer?'':grade?'good':'bad'}"><strong>${!answer?'Chưa chọn đáp án':grade?'✓ Chính xác!':'✕ Chưa chính xác'}</strong><p>Đáp án đúng: <strong>${q.answer}. ${esc(q.options[q.answer])}</strong></p><small>Đáp án lấy nguyên từ tài liệu ôn thi.</small></div>`:''}<div class="quiz-actions"><button class="btn btn-light" onclick="prev()" ${s.index===0?'disabled':''}>← Câu trước</button><div class="right-actions">${practice&&!s.finished&&!s.checked[q.id]?`<button class="btn btn-primary" onclick="checkAnswer()" ${!answer?'disabled':''}>Kiểm tra đáp án</button>`:''}<button class="btn ${s.index<total-1?'btn-primary':'btn-soft'}" onclick="next()" ${s.index===total-1?'disabled':''}>Câu tiếp →</button></div></div></section><div class="exam-footer" style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap"><button class="btn btn-light mobile-grid-btn" onclick="openGrid()">▦ Danh sách câu</button>${s.finished?`<button class="btn btn-primary" onclick="state.view='result';render()">← Xem kết quả</button>`:`<button class="btn btn-danger" onclick="submit(true)">${s.mode==='exam'?'Nộp bài thi':'Kết thúc & tổng kết'}</button>`}</div></div><aside class="paper sticky-aside"><div class="side-head"><b>Danh sách câu hỏi</b><span class="pill">${answeredCount(s)}/${total}</span></div><div class="legend"><span><i class="dot current"></i>Đang xem</span><span><i class="dot done"></i>Đã chọn</span><span><i class="dot marked"></i>Đánh dấu</span></div><div class="question-grid">${gridHTML(s)}</div><div class="aside-stats"><span>Đã trả lời: <b>${answeredCount(s)}</b></span><span>Chưa làm: <b>${total-answeredCount(s)}</b></span></div></aside></div><div class="overlay" id="gridPanel" onclick="if(event.target===this)closeGrid()"><div class="grid-sheet"><div class="side-head"><b>Chọn câu hỏi</b><button class="btn btn-sm btn-light" onclick="closeGrid()">✕ Đóng</button></div><div class="legend"><span><i class="dot current"></i>Đang xem</span><span><i class="dot done"></i>Đã chọn</span><span><i class="dot marked"></i>Đánh dấu</span></div><div class="question-grid">${gridHTML(s)}</div><p class="note">${answeredCount(s)} / ${total} câu đã chọn đáp án</p></div></div>`}
function choose(letter){const s=state.session;if(!s||s.finished)return;const q=getQ();if(s.mode!=='exam'&&s.checked[q.id])return;s.answers[q.id]=letter;saveSession();renderQuizNoScroll()}
function renderQuizNoScroll(){const scroll=window.scrollY;render();window.scrollTo(0,scroll)}
function checkAnswer(){const s=state.session,q=getQ();if(!s.answers[q.id])return;s.checked[q.id]=true;recordWrong(s.subject,q.id,s.answers[q.id]===q.answer);saveSession();renderQuizNoScroll()}
function recordWrong(subject,id,correct){let a=data.wrong[subject];if(correct){data.wrong[subject]=a.filter(v=>v!==id)}else if(!a.includes(id)){a.push(id)}saveDB()}
function toggleStar(){const s=state.session,q=getQ(),a=data.stars[s.subject];data.stars[s.subject]=a.includes(q.id)?a.filter(v=>v!==q.id):[...a,q.id].sort((x,y)=>x-y);saveDB();renderQuizNoScroll()}
function jump(i){state.session.index=Math.max(0,Math.min(state.session.ids.length-1,i));saveSession();render()}
function next(){if(state.session.index<state.session.ids.length-1)jump(state.session.index+1)}
function prev(){if(state.session.index>0)jump(state.session.index-1)}
function openGrid(){document.getElementById('gridPanel')?.classList.add('open')}
function closeGrid(){document.getElementById('gridPanel')?.classList.remove('open')}
function gradeSession(s){let correct=0,wrong=0,unanswered=0;for(let id of s.ids){let ans=s.answers[id];if(!ans)unanswered++;else if(ans===BANK[s.subject][id-1].answer)correct++;else wrong++}return {correct,wrong,unanswered,total:s.ids.length,percent:Math.round(correct/s.ids.length*100)}}
function submit(ask=true,auto=false){const s=state.session;if(!s||s.finished)return;const unanswered=s.ids.length-answeredCount(s);if(ask&&!window.confirm(`Bạn muốn ${s.mode==='exam'?'nộp bài thi':'kết thúc buổi ôn tập'}?${unanswered?'\nCòn '+unanswered+' câu chưa trả lời.':''}`))return;let r=gradeSession(s);for(const id of s.ids){if(s.answers[id])recordWrong(s.subject,id,s.answers[id]===BANK[s.subject][id-1].answer)}s.finished=true;s.submittedAt=Date.now();s.result=r;delstore(K_SESSION);data.history.push({subject:s.subject,mode:s.mode,date:Date.now(),...r});data.history=data.history.slice(-50);saveDB();state.view='result';clearInterval(tick);render();if(auto)toast('Đã hết thời gian — hệ thống tự nộp bài')}
function resultPage(){const s=state.session;if(!s)return homePage();let r=s.result||gradeSession(s),mistakes=s.ids.map((id,i)=>({id,i,choice:s.answers[id],q:BANK[s.subject][id-1]})).filter(x=>!x.choice||x.choice!==x.q.answer);return `<div class="page-head"><div><div class="crumb">${esc(SUBJECTS[s.subject].name)} / Kết quả</div><h1>Kết quả ${s.mode==='exam'?'bài thi thử':'buổi ôn tập'}</h1></div></div><div class="result-hero"><div class="result-ring" style="--percent:${r.percent}%"><b>${r.percent}%</b></div><h1>${r.correct} / ${r.total} câu trả lời đúng</h1><p>Đã chấm theo đáp án gốc PDF • ${esc(SUBJECTS[s.subject].name)} • ${formatTime(Math.floor((s.submittedAt-s.startedAt)/1000))}</p><div class="result-stats"><div><b style="color:var(--green)">${r.correct}</b><small>Câu đúng</small></div><div><b style="color:var(--red)">${r.wrong}</b><small>Câu sai</small></div><div><b style="color:var(--amber)">${r.unanswered}</b><small>Chưa trả lời</small></div></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-primary" onclick="review(0)">Xem lại toàn bộ đáp án</button><button class="btn btn-light" onclick="setup('${s.subject}','${s.mode==='exam'?'exam':'study'}')">Làm đề mới</button><button class="btn btn-soft" onclick="setup('${s.subject}','wrong')">Ôn lại câu sai</button></div></div><section class="review-list"><div class="section-top" style="margin:0 0 8px"><h2 style="font-size:18px">Câu cần xem lại (${mistakes.length})</h2><span>Chọn một câu để xem đáp án</span></div>${mistakes.length?mistakes.map(x=>`<button class="review-item" onclick="review(${x.i})"><div><strong>Câu ${x.i+1} · ${esc(x.q.question)}</strong><small>Đã chọn: ${x.choice||'Chưa trả lời'} • Đáp án đúng: ${x.q.answer}</small></div><span class="pill ${x.choice?'bad':'warn'}">${x.choice?'Sai':'Bỏ qua'} →</span></button>`).join(''):`<div class="empty">🎉<b>Bạn đã trả lời đúng tất cả các câu!</b>Có thể thử đề mới hoặc chuyển sang phần học khác.</div>`}</section><p class="note">Kết quả dùng để luyện tập, không phải điểm thi chính thức. Những câu làm sai được lưu vào mục “Ôn câu sai”.</p>`}
function review(i){const s=state.session;s.index=i;state.view='quiz';render()}
function home(){if(state.view==='quiz'&&state.session&&!state.session.finished)saveSession();state.view='home';clearInterval(tick);render()}
function browse(subject='all'){state.browseSubject=subject;state.browseQuery='';state.view='browse';render()}
function browsePage(){return `<div class="page-head"><div><div class="crumb">Trang chủ / Tra cứu</div><h1>Tra cứu bộ đề Vĩnh Long 31/10 • 350 câu hỏi</h1></div><span class="pill">Theo dữ liệu PDF 31/10</span></div><section class="paper"><div class="search-form"><input class="input" id="searchQuery" value="${esc(state.browseQuery)}" oninput="filterBrowse()" placeholder="Nhập từ khóa, số câu, nội dung cần tìm…" aria-label="Tìm câu hỏi"><select class="select" id="searchSubject" onchange="filterBrowse()"><option value="all" ${state.browseSubject==='all'?'selected':''}>Tất cả học phần</option><option value="coso" ${state.browseSubject==='coso'?'selected':''}>Kiến thức cơ sở</option><option value="chuyenmon" ${state.browseSubject==='chuyenmon'?'selected':''}>Kiến thức chuyên môn</option></select></div><p id="matchCount" class="muted" style="font-size:13px"></p><div id="searchResults" class="search-results"></div></section>`}
function filterBrowse(){const out=document.getElementById('searchResults'),input=document.getElementById('searchQuery'),select=document.getElementById('searchSubject');if(!out||!input||!select)return;let q=input.value.trim().toLocaleLowerCase('vi-VN'),subject=select.value;state.browseQuery=input.value;state.browseSubject=subject;let all=Object.entries(BANK).flatMap(([s,qs])=>qs.map(item=>({...item,subject:s})));let match=all.filter(item=>(subject==='all'||item.subject===subject)&&(!q||('câu '+item.id+' '+item.question+' '+Object.values(item.options).join(' ')).toLocaleLowerCase('vi-VN').includes(q)));document.getElementById('matchCount').textContent=`Tìm thấy ${match.length} câu hỏi${match.length>50?' • Hiển thị 50 câu đầu tiên':''}`;out.innerHTML=match.slice(0,50).map(item=>`<div class="search-card"><small>${esc(SUBJECTS[item.subject].name)} • Câu ${item.id}</small><p><b>${esc(item.question)}</b></p><button class="btn btn-sm btn-soft" onclick="single('${item.subject}',${item.id})">Luyện câu này →</button></div>`).join('')||`<div class="empty">Không tìm thấy câu hỏi phù hợp. Hãy thử một từ khóa khác.</div>`}
function single(subject,id){state.session={subject,mode:'study',ids:[id],index:0,answers:{},checked:{},duration:0,startedAt:Date.now(),finished:false};state.view='quiz';saveSession();render();timerLoop()}
window.addEventListener('keydown',event=>{if(state.view!=='quiz'||event.altKey||event.ctrlKey||event.metaKey)return;const tag=document.activeElement?.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;const s=state.session;if(!s)return;let k=event.key.toUpperCase();if(letters.includes(k)){choose(k)}else if(event.key==='ArrowRight'){next()}else if(event.key==='ArrowLeft'){prev()}});
render();
</script>
</body>
</html>
