 quyết định mua bất động sản của khách hàng, bước đầu tiên mà môi giới cần thực hiện là gì?","options":{"A":"Đánh giá các rủi ro có thể xảy ra và khả năng ứng phó từ góc độ dòng tiền","B":"Kiểm tra số liệu để xác định mức độ chính xác và đáng tin cậy","C":"Xem xét quy mô đầu tư so với khả năng huy động vốn của khách hàng","D":"Đề xuất các phương án, giải pháp thay thế khác nhau"},"answer":"C"},{"id":14,"question":"Những điều cần tránh làm khi giới thiệu sản phẩm bất động sản là?","options":{"A":"Giới thiệu bằng trực quan sống động.","B":"Luôn sử dụng các từ và thuật ngữ chuyên môn.","C":"Gợi ý những viễn cảnh tốt đẹp nếu khách hàng mua sản phẩm.","D":"Cả đáp án B và C đúng."},"answer":"B"},{"id":15,"question":"Quy trình môi giới BĐS gồm các bước","options":{"A":"Tìm khách hàng, ký kết hợp đồng, quảng bá BĐS, bán hàng","B":"Tìm người bán, ký kết hợp đồng, quảng bá BĐS, bán hàng","C":"Tìm người bán, khảo sát thẩm định giá, ký kết hợp đồng, quảng bá BĐS, bán hàng","D":"Khảo sát thẩm định giá, ký kết hợp đồng, quảng bá BĐS, bán hàng"},"answer":"C"},{"id":16,"question":"Theo khảo sát về cầu bất động sản mục đích để ở, yếu tố nào thường được khách hàng ưu tiên hàng đầu khi đưa ra quyết định mua?","options":{"A":"Thời gian, chất lượng, tiện lợi, giá cả.","B":"Giá cả, chất lượng, tiện lợi, thời gian.","C":"Giá cả, thời gian, chất lượng, tiện lợi.","D":"Chất lượng, thời gian, tiện lợi, giá cả."},"answer":"B"},{"id":17,"question":"Việc nhà môi giới bất động sản từ chối tham gia vào một giao dịch có dấu hiệu rửa tiền, mặc dù có thể mang lại hoa hồng rất lớn, thể hiện việc tuân thủ nguyên tắc nào?","options":{"A":"Nguyên tắc lấy lợi ích khách hàng làm định hướng.","B":"Nguyên tắc tuân thủ pháp luật và đạo đức nghề nghiệp.","C":"Nguyên tắc công khai, minh bạch.","D":"Nguyên tắc hoạt động dựa trên chuyên môn."},"answer":"B"},{"id":18,"question":"Nhà môi giới bất động sản thường xuyên thực hiện các công việc nào sau đây?","options":{"A":"Xác định lượng cung bất động sản nói chung trên thị trường.","B":"Xác định tính cần thiết của việc đầu tư, nhu cầu mua nhà của người dân trên một thị trường nhất định.","C":"Xác định chi phí, lợi nhuận, thủ tục pháp lý, hỗ trợ khách hàng thực hiện các giao dịch mua bán.","D":"Xác định chu kỳ phát triển của bất động sản, đưa ra phương hướng đầu tư thích hợp."},"answer":"C"},{"id":19,"question":"Việc nhà nước ngày càng siết chặt quản lý và yêu cầu cao hơn về điều kiện hành nghề môi giới bất động sản... thể hiện xu hướng gì?","options":{"A":"Muốn loại bỏ nghề môi giới bất động sản.","B":"Chuyên nghiệp hóa ngành nghề, nâng cao chất lượng dịch vụ, bảo vệ quyền lợi người tiêu dùng và tăng cường sự minh bạch của thị trường.","C":"Giảm bớt gánh nặng quản lý cho nhà nước.","D":"Khuyến khích hoạt động môi giới tự do, không cần quản lý."},"answer":"B"},{"id":20,"question":"Trường hợp nào thì việc sử dụng \"Hợp đồng Ủy quyền\" để mua bán bất động sản là hợp lệ và ít rủi ro nhất?","options":{"A":"Người ủy quyền đang ở nước ngoài không thể về ký bán.","B":"Người ủy quyền và người được ủy quyền là vợ chồng/cha mẹ con cái ruột, nội dung ủy quyền rõ ràng, hợp pháp và còn hiệu lực.","C":"Người mua muốn nhờ người khác đứng tên hộ.","D":"Hợp đồng ủy quyền được lập bằng giấy viết tay."},"answer":"B"},{"id":21,"question":"Khi gặp một khách hàng có kiến thức sâu về bất động sản và thị trường, nhà môi giới nên thể hiện vai trò của mình như thế nào?","options":{"A":"Tranh luận để chứng tỏ mình giỏi hơn.","B":"Thể hiện sự tôn trọng kiến thức của khách hàng, tập trung vào việc cung cấp giá trị gia tăng khác","C":"Lảng tránh các câu hỏi chuyên sâu","D":"Chỉ đóng vai trò người dẫn đi xem nhà."},"answer":"B"},{"id":22,"question":"Chủ thể nào được phép cung cấp dịch vụ môi giới bất động sản tại Việt Nam?","options":{"A":"Tổ chức, cá nhân kinh doanh dịch vụ bất động sản.","B":"Tổ chức, cá nhân có đủ điều kiện và được cấp phép hoạt động môi giới.","C":"Tổ chức có đăng ký kinh doanh ngành nghề môi giới và cá nhân có chứng chỉ môi giới.","D":"Doanh nghiệp có đăng ký ngành nghề kinh doanh bất động sản."},"answer":"C"},{"id":23,"question":"Thù lao môi giới bất động sản được xác định như thế nào?","options":{"A":"Do pháp luật quy định một mức cố định theo tỷ lệ phần trăm giá trị giao dịch.","B":"Do các bên thỏa thuận trong hợp đồng dịch vụ môi giới bất động sản.","C":"Do Hiệp hội Bất động sản quy định mức sàn thù lao.","D":"Luôn được tính bằng 2% giá trị hợp đồng chuyển nhượng bất động sản."},"answer":"B"},{"id":24,"question":"Dịch vụ môi giới bất động sản phải được thực hiện thông qua hình thức nào?","options":{"A":"Giao dịch miệng giữa nhà môi giới và khách hàng.","B":"Văn bản thỏa thuận ghi nhớ giữa hai bên.","C":"Hợp đồng dịch vụ môi giới bất động sản.","D":"Biên bản xác nhận việc hoàn thành giao dịch."},"answer":"C"},{"id":25,"question":"Khi thực hiện môi giới, nhà môi giới có được phép cùng lúc làm trung gian cho cả hai bên (bên bán và bên mua) trong cùng một giao dịch không?","options":{"A":"Không được phép vì có thể dẫn đến xung đột lợi ích.","B":"Tùy thuộc vào loại hình bất động sản và giá trị giao dịch.","C":"Luôn được phép nếu có hợp đồng môi giới với cả hai bên.","D":"Được phép nếu đã thông báo và được sự đồng ý của cả hai bên."},"answer":"A"},{"id":26,"question":"Nhà môi giới có được phép định đoạt (mua hoặc bán) bất động sản được môi giới hay không?","options":{"A":"Không bao giờ được phép để đảm bảo tính khách quan.","B":"Được phép nếu là người duy nhất nắm giữ thông tin bất động sản đó.","C":"Được phép nếu có hợp đồng ủy quyền của chủ sở hữu bất động sản.","D":"Chỉ được phép nếu giá trị bất động sản dưới 1 tỷ đồng."},"answer":"C"},{"id":27,"question":"Điều kiện kinh doanh dịch vụ môi giới bất động sản của tổ chức tại Việt Nam là gì?","options":{"A":"Phải có vốn pháp định tối thiểu 20 tỷ đồng.","B":"Phải đăng ký kinh doanh tại địa phương và có 01 người có chứng chỉ môi giới.","C":"Phải thành lập doanh nghiệp, có tối thiểu 01 người có chứng chỉ môi giới bất động sản.","D":"Phải đăng ký thành lập Hợp tác xã và có giấy phép của Bộ Xây dựng."},"answer":"C"},{"id":28,"question":"Chứng chỉ hành nghề môi giới bất động sản có giá trị sử dụng trong bao lâu?","options":{"A":"Vô thời hạn, không cần gia hạn.","B":"03 năm kể từ ngày cấp, cần thi lại để cấp mới.","C":"05 năm kể từ ngày cấp.","D":"05 năm kể từ ngày cấp."},"answer":"C"},{"id":29,"question":"Ở nhiều nước phát triển (ví dụ: Mỹ, Canada), nhà môi giới cá nhân (Agent) thường quản lý theo mô hình nào?","options":{"A":"Cá nhân môi giới hoạt động độc lập và không cần chứng chỉ.","B":"Hoạt động chủ yếu thông qua các hiệp hội nghề nghiệp tự quản lý.","C":"Phải đăng ký với một sàn giao dịch hoặc công ty môi giới (brokerage firm) để được hoạt động.","D":"Được quản lý bởi Bộ Tài chính và không cần có chứng chỉ."},"answer":"C"},{"id":30,"question":"Điều kiện về nhân sự bắt buộc để một tổ chức được thành lập và hoạt động Sàn giao dịch bất động sản là gì?","options":{"A":"Phải có vốn pháp định tối thiểu 10 tỷ đồng và người quản lý sàn có chứng chỉ môi giới.","B":"Phải có ít nhất 03 cá nhân có chứng chỉ hành nghề môi giới bất động sản làm việc thường xuyên.","C":"Người quản lý, điều hành sàn giao dịch bất động sản phải hoàn thành khóa đào tạo về quản lý, điều hành sàn giao dịch bất động sản và được cơ sở đào tạo cấp giấy chứng nhận hoàn thành khóa học quản lý, điều hành sàn giao dịch bất động sản.","D":"Phải có người quản lý có bằng cử nhân chuyên ngành bất động sản và có kinh nghiệm trên 02 năm."},"answer":"C"},{"id":31,"question":"Một trong những nghĩa vụ chính của Sàn giao dịch bất động sản đối với các giao dịch được thực hiện tại Sàn là gì?","options":{"A":"Có trách nhiệm hoàn toàn về tính pháp lý và quy hoạch của bất động sản được giao dịch.","B":"Bảo lãnh tài chính cho các bên tham gia giao dịch bất động sản để đảm bảo an toàn.","C":"Chịu trách nhiệm về thông tin và hỗ trợ các bên trong việc ký kết hợp đồng, hoàn tất thủ tục giao dịch.","D":"Bắt buộc các bên phải sử dụng dịch vụ định giá của Sàn trước khi thực hiện giao dịch."},"answer":"C"},{"id":32,"question":"Nguồn thông tin nào về cung bất động sản được coi là có độ tin cậy pháp lý cao nhất?","options":{"A":"Thông tin từ các nhóm bán hàng của chủ đầu tư trên mạng xã hội.","B":"Thông tin từ các nhà môi giới có thâm niên trong khu vực.","C":"Các quảng cáo trên báo, đài hoặc các trang rao vặt lớn.","D":"Thông tin trực tiếp từ giấy chứng nhận quyền sử dụng đất, hồ sơ pháp lý dự án, hoặc cơ quan nhà nước có thẩm quyền."},"answer":"D"},{"id":33,"question":"Khi môi giới giao dịch bất động sản thuộc sở hữu của doanh nghiệp, ai có thẩm quyền ký hợp đồng chuyển nhượng?","options":{"A":"Chỉ cần kế toán trưởng xác nhận về mặt tài chính.","B":"Bất kỳ cá nhân nào có tên trong danh sách nhân viên của doanh nghiệp.","C":"Giám đốc, Tổng Giám đốc hoặc người được ủy quyền hợp pháp theo Điều lệ công ty.","D":"Chủ tịch Hội đồng Quản trị hoặc Hội đồng Thành viên."},"answer":"C"},{"id":34,"question":"Hồ sơ thương vụ môi giới (Deal File) được lập ra nhằm mục đích gì?","options":{"A":"Để nộp cho cơ quan thuế khi giao dịch hoàn thành.","B":"Chỉ để nhà môi giới xem xét nội bộ, không có giá trị pháp lý.","C":"Để lưu trữ, quản lý thông tin, và làm cơ sở giải quyết tranh chấp (nếu có).","D":"Để gửi cho đối thủ cạnh tranh nhằm mục đích học hỏi kinh nghiệm."},"answer":"C"},{"id":35,"question":"Khi lập hồ sơ cho bất động sản hình thành trong tương lai, tài liệu pháp lý quan trọng nhất cần thu thập là gì?","options":{"A":"Hợp đồng bảo hiểm cháy nổ của toàn bộ dự án.","B":"Giấy chứng nhận về quyền sở hữu căn hộ mẫu của dự án.","C":"Hợp đồng lao động của Giám đốc Chủ đầu tư.","D":"Văn bản chấp thuận cho phép bán, cho thuê mua của cơ quan nhà nước có thẩm quyền."},"answer":"D"},{"id":36,"question":"Khi môi giới bất động sản đang bị thế chấp tại ngân hàng, nhà môi giới cần làm gì để đảm bảo giao dịch hợp pháp?","options":{"A":"Chỉ cần thông báo bằng miệng cho bên mua về việc đang thế chấp.","B":"Ký hợp đồng mua bán và cam kết sẽ giải chấp sau.","C":"Yêu cầu bên bán phải tất toán khoản nợ trước khi ký hợp đồng đặt cọc.","D":"Bắt buộc phải có văn bản đồng ý của bên nhận thế chấp (ngân hàng) về việc bán bất động sản đó."},"answer":"D"},{"id":37,"question":"Việc kiểm tra thông tin về thế chấp bất động sản được thực hiện ở đâu?","options":{"A":"Tại cơ quan thuế của địa phương có bất động sản.","B":"Tại Văn phòng Đăng ký đất đai hoặc cơ quan đăng ký giao dịch bảo đảm có thẩm quyền.","C":"Tại tổ chức tín dụng (ngân hàng) mà bên bán giao dịch.","D":"Tại công ty bảo hiểm nơi bất động sản được mua bảo hiểm."},"answer":"B"},{"id":38,"question":"Bước nào sau đây thường là bước cuối cùng trong một thương vụ môi giới thành công?","options":{"A":"Ký kết hợp đồng dịch vụ môi giới độc quyền.","B":"Hỗ trợ bên mua thực hiện vay vốn ngân hàng.","C":"Hoàn thành thủ tục công chứng, đăng ký sang tên và chi trả thù lao môi giới.","D":"Đàm phán giá bán bất động sản giữa bên bán và bên mua."},"answer":"C"},{"id":39,"question":"Mục tiêu chính của Marketing bất động sản là gì?","options":{"A":"Đảm bảo bất động sản được bán với giá cao hơn thị trường.","B":"Đẩy mạnh quảng cáo để mọi người đều biết đến bất động sản đó.","C":"Thu hút và xác định đúng khách hàng mục tiêu để tối ưu hóa hiệu quả giao dịch.","D":"Giúp nhà môi giới nổi tiếng và có nhiều người theo dõi trên mạng xã hội."},"answer":"C"},{"id":40,"question":"Nguyên tắc pháp lý nào cần tuân thủ khi thực hiện quảng cáo bất động sản?","options":{"A":"Chỉ được quảng cáo trên các kênh truyền thông chính thống của nhà nước.","B":"Đảm bảo nội dung quảng cáo trung thực, chính xác và không gây nhầm lẫn.","C":"Bắt buộc phải có chữ ký của Chủ tịch UBND tỉnh.","D":"Chỉ được sử dụng ảnh chụp bằng điện thoại cá nhân."},"answer":"B"},{"id":41,"question":"Trong đàm phán giá bất động sản, nhà môi giới nên giữ vai trò như thế nào?","options":{"A":"Người đứng về phía bên bán để tối đa hóa hoa hồng.","B":"Người đứng về phía bên mua để có được mức giá thấp nhất.","C":"Người đưa ra quyết định cuối cùng về giá.","D":"Người trung lập, đưa ra các luận cứ khách quan và đề xuất giải pháp hài hòa."},"answer":"D"},{"id":42,"question":"Khi niêm yết thông tin bất động sản tại Sàn giao dịch, cần tuân thủ nguyên tắc nào?","options":{"A":"Niêm yết tại tất cả các khu vực công cộng trên địa bàn thành phố.","B":"Chỉ niêm yết khi khách hàng yêu cầu.","C":"Niêm yết công khai, đầy đủ và dễ tiếp cận tại nơi kinh doanh của Sàn.","D":"Chỉ niêm yết giá bán, không cần niêm yết thông tin pháp lý."},"answer":"C"},{"id":43,"question":"Hệ thống quản lý thông tin khách hàng (CRM) đóng vai trò gì?","options":{"A":"Giúp theo dõi và kiểm soát giờ làm việc của từng nhà môi giới.","B":"Cung cấp thông tin tài chính cá nhân của khách hàng.","C":"Hỗ trợ thu thập, phân loại, lưu trữ và theo dõi quá trình giao dịch với khách hàng.","D":"Chỉ dùng để ghi nhận các giao dịch đã thất bại."},"answer":"C"},{"id":44,"question":"Yếu tố pháp lý nào quan trọng nhất cần kiểm tra khi soạn thảo Hợp đồng dịch vụ môi giới?","options":{"A":"Hợp đồng phải được in màu và có dấu mộc đỏ.","B":"Thời hạn thực hiện hợp đồng không được quá 01 năm.","C":"Xác định chính xác năng lực hành vi dân sự và thẩm quyền ký kết của các bên.","D":"Mức thù lao môi giới phải được ghi rõ bằng số và bằng chữ."},"answer":"C"},{"id":45,"question":"Các thông tin về BĐS cần thu thập gồm:","options":{"A":"Thông tin về kinh tế kỹ thuật.","B":"Thông tin về tình trạng pháp lý.","C":"Thông tin về môi trường xã hội, lịch sử phát triển.","D":"Cả 3 câu trên đều đúng."},"answer":"D"},{"id":46,"question":"Nếu Hợp đồng dịch vụ môi giới không ghi rõ mức thù lao, thù lao được tính thế nào?","options":{"A":"Bằng 1% giá trị giao dịch thành công.","B":"Nhà môi giới không được nhận bất kỳ khoản thù lao nào.","C":"Hợp đồng môi giới đó bị vô hiệu do thiếu điều khoản quan trọng.","D":"Các bên thỏa thuận lại, hoặc áp dụng theo giá dịch vụ thông thường trên thị trường."},"answer":"D"},{"id":47,"question":"Công nghệ thực tế ảo (VR) được ứng dụng trong môi giới nhằm mục đích gì?","options":{"A":"Giúp khách hàng xem nhà từ xa, tiết kiệm thời gian và chi phí di chuyển.","B":"Bắt buộc phải sử dụng theo quy định của Bộ Xây dựng.","C":"Chỉ dùng để thiết kế các bài quảng cáo trên Facebook.","D":"Giúp nhà môi giới giấu đi các nhược điểm của bất động sản."},"answer":"A"},{"id":48,"question":"Chị A thấy một tin đăng bán nhà giá rẻ hơn 15% trên trang web lạ. Chị nên làm gì đầu tiên?","options":{"A":"Ngay lập tức đăng lại bài quảng cáo đó để tìm kiếm khách hàng.","B":"Yêu cầu khách hàng tiềm năng đặt cọc giữ chỗ.","C":"So sánh và xác minh tính chính xác, pháp lý của thông tin tại cơ quan quản lý.","D":"Liên hệ với người đăng tin yêu cầu cung cấp ngay sổ đỏ bản gốc."},"answer":"C"},{"id":49,"question":"Khách hàng muốn mua căn hộ 3 tỷ ở trung tâm nhưng thực tế thị trường không có mức giá đó. Môi giới nên làm gì?","options":{"A":"Chấp nhận và tiếp tục tìm kiếm vô vọng.","B":"Tư vấn khách hàng thay đổi nhu cầu sang căn ít phòng ngủ hơn hoặc ở xa hơn.","C":"Yêu cầu khách hàng phải tăng ngân sách lên 5 tỷ.","D":"Khuyên khách hàng chờ thêm 1 năm nữa."},"answer":"B"},{"id":50,"question":"Kế toán trưởng Công ty Y ký hợp đồng môi giới với bạn. Bạn cần kiểm tra giấy tờ gì?","options":{"A":"Giấy chứng nhận Quyền sử dụng đất bản gốc.","B":"Hợp đồng lao động của Kế toán trưởng.","C":"Giấy ủy quyền hợp pháp của người đại diện theo pháp luật hoặc Nghị quyết của Hội đồng quản trị.","D":"Lịch sử giao dịch trước đây của công ty."},"answer":"C"},{"id":51,"question":"Môi giới phát hiện diện tích trên sổ đỏ và thực tế khác nhau. Nên xử lý thế nào?","options":{"A":"Điều chỉnh lại thông tin trên sổ đỏ bằng tay.","B":"Ghi nhận cả hai và tư vấn khách hàng đo đạc, làm rõ pháp lý trước khi ký hợp đồng chính thức.","C":"Bỏ qua sổ đỏ, chỉ ghi diện tích thực tế.","D":"Hủy bỏ thương vụ ngay lập tức."},"answer":"B"},{"id":52,"question":"Khách hàng mua nhà đang thế chấp, ngân hàng đã đồng ý cho bán. Bước tiếp theo quan trọng nhất là gì?","options":{"A":"Chỉ cần ngân hàng xác nhận số dư nợ.","B":"Yêu cầu ngân hàng cung cấp Hợp đồng tín dụng ban đầu.","C":"Các bên cùng đến ngân hàng thanh toán nợ, ký giải chấp và rút sổ đỏ gốc.","D":"Ký hợp đồng chuyển nhượng trước rồi mới trả nợ sau."},"answer":"C"},{"id":53,"question":"Ông A nói đã trả hết nợ ngân hàng và đang xóa thế chấp. Bạn cần xác minh bằng cách nào?","options":{"A":"Kiểm tra biên lai nộp tiền cuối cùng.","B":"Gọi điện cho Giám đốc ngân hàng.","C":"Yêu cầu văn bản xác nhận xóa đăng ký thế chấp của Văn phòng Đăng ký đất đai.","D":"Yêu cầu ông A ủy quyền cho mình tự đi kiểm tra."},"answer":"C"},{"id":54,"question":"Hợp đồng môi giới sắp hết hạn, khách quay lại muốn mua. Để bảo vệ quyền lợi, môi giới nên làm gì?","options":{"A":"Ký ngay hợp đồng mới kéo dài thời gian.","B":"Hỗ trợ các bên ký biên bản ghi nhớ hoặc đặt cọc có sự xác nhận của môi giới trước khi hợp đồng cũ hết hạn.","C":"Yêu cầu khách mua giá cao hơn 10%.","D":"Chờ hết hạn và không can thiệp."},"answer":"B"},{"id":55,"question":"Môi giới dùng hình ảnh 3D có bể bơi nhưng thực tế dự án không có. Hành vi này vi phạm gì?","options":{"A":"Bảo mật thông tin khách hàng.","B":"Nguyên tắc trung thực, chính xác trong quảng cáo.","C":"Quy định về kinh doanh đa cấp.","D":"Quy định về đăng ký sàn giao dịch."},"answer":"B"},{"id":56,"question":"Bên bán đột ngột đòi tăng 200 triệu lúc đàm phán cuối. Môi giới xử lý thế nào?","options":{"A":"Khuyên bên bán giữ giá và đe dọa chấm dứt hợp đồng.","B":"Bảo vệ bên bán bằng cách nói mức giá đó hợp lý.","C":"Giữ thái độ trung lập, tìm hiểu lý do và phân tích lợi ích/rủi ro cho cả hai.","D":"Đề nghị bất động sản khác cho bên mua."},"answer":"C"},{"id":57,"question":"Môi giới liên tục ngắt lời khách để khoe thành tích. Vi phạm kỹ năng gì?","options":{"A":"Kỹ năng quảng cáo.","B":"Quyền kiểm soát cuộc trò chuyện.","C":"Kỹ năng lắng nghe tích cực, làm khách cảm thấy không được tôn trọng.","D":"Kỹ năng soạn thảo hợp đồng."},"answer":"C"},{"id":58,"question":"Sàn giao dịch niêm yết lô đất đang tranh chấp ranh giới. Có vi phạm không?","options":{"A":"Không, miễn là có giá bán đầy đủ.","B":"Có, nhưng chỉ khi tòa án đã thụ lý.","C":"Không, vì tranh chấp là chuyện riêng của chủ nhà.","D":"Có, vì Sàn có nghĩa vụ cung cấp thông tin trung thực và chịu trách nhiệm về tính chính xác của thông tin niêm yết."},"answer":"D"},{"id":59,"question":"Công ty môi giới có 5 người nhưng chỉ có Giám đốc có chứng chỉ. Công ty có được kinh doanh không?","options":{"A":"Không, vì phải có ít nhất 2 người.","B":"Được, vì điều kiện tối thiểu chỉ cần 01 người có chứng chỉ.","C":"Được nhưng phải nộp phạt.","D":"Chỉ được môi giới nhà dưới 5 tỷ."},"answer":"B"},{"id":60,"question":"Ông K quản lý Sàn giao dịch nhưng chưa có giấy chứng nhận hoàn thành khóa học quản lý, điều hành sàn giao dịch bất động sản Ông K nên làm gì?","options":{"A":"Từ chức hoặc làm việc không liên quan môi giới.","B":"Nộp hồ sơ xin cấp chứng chỉ không qua thi.","C":"Bổ nhiệm người khác có giấy chứng nhận hoàn thành khóa học quản lý, điều hành sàn giao dịch bất động sản hoặc tham gia khóa đào tạo về quản lý, điều hành sàn giao dịch bất động sản theo quy định.","D":"Chuyển đổi thành công ty tư vấn."},"answer":"C"},{"id":61,"question":"Môi giới lô đất nền chưa hoàn thiện hạ tầng. Cần tư vấn khách kiểm tra giấy tờ gì?","options":{"A":"Giấy phép kinh doanh môi giới của bạn.","B":"Báo cáo tài chính của công ty bán đất.","C":"Văn bản chấp thuận của cơ quan nhà nước cho phép chuyển nhượng đất đã đầu tư hạ tầng.","D":"Hóa đơn nộp thuế của bên bán."},"answer":"C"},{"id":62,"question":"Môi giới đăng số điện thoại khách cũ lên mạng để khoe thành công. Vi phạm nguyên tắc gì?","options":{"A":"Kỹ năng soạn thảo hợp đồng.","B":"Bảo mật thông tin khách hàng và đạo đức nghề nghiệp.","C":"Quảng cáo trung thực.","D":"Quy định về Sàn giao dịch."},"answer":"B"},{"id":63,"question":"Môi giới bất động sản phân tích theo quy định của Luật Kinh doanh bất động sản hiện hành là?","options":{"A":"Công việc chuyên môn của các cá nhân.","B":"Việc làm trung gian giúp cho cho các bên trong mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản.","C":"Hình thành theo sự phân công lao động xã hội.","D":"Kết nối nhu cầu bên mua với nhu cầu bên bán bất động sản."},"answer":"B"},{"id":64,"question":"Nghề môi giới bất động sản nếu phân tích theo quan điểm kinh tế thị trường là gì?","options":{"A":"Công việc chuyên môn của các cá nhân","B":"Làm trung gian giúp cho việc mua, bán bất động sản được thực hiện","C":"Hình thành theo sự phân công lao động xã hội","D":"Kết nối nhu cầu bên mua với nhu cầu bên bán bất động sản."},"answer":"D"},{"id":65,"question":"Khi một bất động sản tạo ra dòng tiền thu nhập thụ động âm (ví dụ cho thuê không đủ bù các khoản chi và các khoản khấu hao đầu tư…). Nhằm làm cho nó trở thành một khoản đầu tư hấp dẫn đối với nhà đầu tư, ta nên chứng minh thế nào?","options":{"A":"Sẽ có những giảm trừ thích hợp.","B":"Sẽ có một chút trì hoãn nhỏ trong việc bảo hành sửa chữa bất động sản này.","C":"Sẽ có một sự giảm giá đáng kể.","D":"Sẽ có một sự gia tăng đáng kể trong giá trị tài sản."},"answer":"D"},{"id":66,"question":"Một khách hàng nhờ bạn môi giới bán căn nhà. Khi kiểm tra hồ sơ, bạn phát hiện giấy tờ pháp lý chưa đầy đủ (thiếu bản vẽ hoàn công). Khách hàng yêu cầu bạn “cứ đăng bán trước, có khách thì bổ sung sau”. Nhà môi giới cần làm gì?","options":{"A":"Đồng ý đăng vì thiếu một giấy tờ không ảnh hưởng nhiều","B":"Đăng bán nhưng ghi chú “hồ sơ đang hoàn thiện”","C":"Giải thích và yêu cầu khách hàng bổ sung hồ sơ pháp lý trước khi niêm yết","D":"Vẫn đăng nhưng chỉ gửi cho khách thân quen"},"answer":"C"},{"id":67,"question":"Trong một giao dịch, cả bên mua và bên bán cùng muốn thuê bạn làm đại diện. Bạn nên xử lý thế nào?","options":{"A":"Nhận cả hai để tăng thu nhập","B":"Nhận đại diện cả hai bên nhưng không nói cho họ biết","C":"Chỉ được đại diện một bên và phải thông báo rõ ràng","D":"Nhận đại diện bên trả hoa hồng cao hơn"},"answer":"C"},{"id":68,"question":"Bạn biết thông tin khu vực sắp có quy hoạch mở đường nhưng thông tin chưa được công bố chính thức. Khách hàng hỏi: “Có quy hoạch gì không?”. Bạn phải làm gì?","options":{"A":"Nói không có gì để khách yên tâm mua","B":"Đưa ra dự đoán cá nhân","C":"Che giấu hoàn toàn","D":"Chỉ cung cấp thông tin chính thống và cảnh báo khách về rủi ro khi thông tin chưa xác thực"},"answer":"D"},{"id":69,"question":"Khách hàng yêu cầu bạn giảm hoa hồng xuống mức thấp hơn quy định của công ty. Bạn xử lý sao?","options":{"A":"Đồng ý vì muốn chốt giao dịch","B":"Giảm mà không báo công ty","C":"Giải thích mức phí do công ty quy định và không được tự ý thay đổi","D":"Thu thêm phí ngoài hợp đồng để bù lại"},"answer":"C"},{"id":70,"question":"Một đồng nghiệp cung cấp cho bạn thông tin sản phẩm họ đang niêm yết. Bạn dùng thông tin này để tiếp cận chủ nhà trực tiếp mà không thông qua đồng nghiệp. Hành vi này là:","options":{"A":"Được phép nếu bạn chốt nhanh hơn","B":"Đúng nếu đồng nghiệp không phản đối","C":"Sai vì vi phạm đạo đức và cạnh tranh không lành mạnh","D":"Chỉ sai khi bạn không báo lại kết quả"},"answer":"C"},{"id":71,"question":"Bạn đang môi giới cho người bán. Một khách khác là bạn thân đề nghị bạn “giữ kín thông tin có bất lợi” để dễ chốt. Bạn phải làm gì?","options":{"A":"Đồng ý vì tạo lợi thế cho người mua","B":"Từ chối và cung cấp đầy đủ thông tin theo đúng quy tắc nghề nghiệp","C":"Chỉ nói một phần","D":"Tùy xem giá trị giao dịch lớn hay nhỏ"},"answer":"B"},{"id":72,"question":"Bạn phát hiện người bán muốn cố tình giấu việc căn nhà đang trong diện tranh chấp. Bạn nên làm gì?","options":{"A":"Tiếp tục môi giới vì tranh chấp có thể giải quyết sau","B":"Giấu thông tin để giao dịch nhanh","C":"Yêu cầu người bán giải quyết tranh chấp trước, hoặc từ chối nhận sản phẩm","D":"Đưa ra mức giá rẻ hơn để dễ bán"},"answer":"C"},{"id":73,"question":"Điều kiện để xuất hiện hoạt động môi giới bất động sản","options":{"A":"Xuất hiện quan hệ giữa các bên (bên cung và bên cầu về bất động sản hoặc chung cư).","B":"Các bên không thể giải quyết được công việc của mình hay giải quyết không hiệu quả.","C":"Tồn tại người thứ ba là nhà môi giới bất động sản có đủ năng lực, điều kiện để giải quyết các công việc liên quan đến các bên.","D":"Cả ba ý trên đều đúng."},"answer":"D"},{"id":74,"question":"Để tìm được nguồn BĐS phù hợp nhu cầu, thông tin cơ bản nhất cần thu thập từ khách hàng là?","options":{"A":"Mục tiêu sử dụng BĐS.","B":"Yêu cầu về giao thông, cơ sở hạ tầng kỹ thuật, giá cả … của BĐS.","C":"Khả năng tài chính của khách hàng.","D":"Nghề nghiệp, độ tuổi của khách hàng."},"answer":"A"},{"id":75,"question":"Đạo đức nghề nghiệp của Nhà môi giới Bất động sản?","options":{"A":"Tuân thủ pháp luật.","B":"Cung cấp thông tin trung thực về Bất động sản.","C":"Đặt lợi ích của khách hàng lên trên hết.","D":"Cả A, B, C đều đúng."},"answer":"D"},{"id":76,"question":"Nhà Môi giới Bất động sản được nhận thù lao?","options":{"A":"Từ một bên trong hợp đồng.","B":"Từ hai bên trở lên.","C":"Không phụ thuộc vào việc giao dịch có thực hiện thành công hay không","D":"Cả A, B,C đều đúng."},"answer":"C"},{"id":77,"question":"Đạo đức nghề nghiệp nào mà Nhà môi giới không được phép làm?","options":{"A":"Nhận các khoản thù lao ngoài hợp đồng.","B":"Giới thiệu về mình và đơn vị mình làm việc.","C":"Làm việc với tinh thần tận tâm với khách hàng.","D":"Lắng nghe ý kiến thắc mắc của khách hàng"},"answer":"A"},{"id":78,"question":"Toàn bộ quá trình thiết kế, thu thập, xử lý, phân tích các thông tin và báo cáo được gọi là:","options":{"A":"Marketing.","B":"Nghiên cứu.","C":"Phân phối.","D":"Quản trị"},"answer":"B"},{"id":79,"question":"Vì sao hai bên cung - cầu bất động sản cần có môi giới:","options":{"A":"Vì hoạt động môi giới sẽ làm lành mạnh hóa, minh bạch hoạt động và giúp thị trường phát triển.","B":"Vì hoạt động môi giới sẽ tìm ra hướng giải quyết tối ưu cho khách hàng.","C":"Vì bất động sản có quyền năng phức tạp và thị tường bất động sản là thị trường không hoàn hảo.","D":"Vì môi giới là một trong ba pháp nhân tham gia vào thị trường bất động sản."},"answer":"C"},{"id":80,"question":"Quy trình tư vấn cho khách hàng về dự án bất động sản bao gồm?","options":{"A":"Giới thiệu quy hoạch 1/500; thông báo giá, ký hợp đồng dịch vụ môi giới.","B":"Giới thiệu hồ sơ dự án, đưa ra mức giá bán, ký hợp đồng dịch vụ môi giới.","C":"Giới thiệu đầy đủ hồ sơ pháp lý của dự án, tư vấn cho khách hàng chi tiết đầy đủ. Các thông tin và dịch vụ kèm theo sản phẩm chào bán, giới thiệu chính xác các mức giá, các ưu đãi của dự án, hỗ trợ tài chính, ngân hàng (nếu có). Giải thích các điều khoản hợp đồng mua bán mẫu của dự án và đưa khách hàng xem mô hình dự án, căn hộ mẫu (nếu có).","D":"Cả A, B và C đều đúng."},"answer":"C"},{"id":81,"question":"Trong tình hình thị trường bất động sản bị đóng băng, khi một người dự định bán bất động sản của mình, anh ta nên quảng cáo ở đâu thì có lợi và tốn ít chi phí nhất?","options":{"A":"Sử dụng tổng hợp các phương tiện.","B":"Thông qua sàn giao dịch bất động sản hoặc các công ty môi giới.","C":"Thông qua phương tiện truyền thông đại chúng.","D":"Tự treo bảng trước nhà hoặc những nơi dễ nhìn thấy."},"answer":"D"},{"id":82,"question":"Trong môi giới BĐS, vấn đề văn hóa phải được các môi giới viên chú trọng tìm hiểu và nắm rõ. Ví dụ, việc sai hẹn có khi chỉ vài phút cũng có thể làm đối tác (đặc biệt là người Mỹ) khó chịu; Người phương Tây thường đi ngay vào mục đích làm việc và có xu hướng nhanh chóng ra quyết định, trong khi người phương Đông thường không đi thẳng vào vấn đề, giải quyết công việc theo cách thoải mái hơn, và thường tránh nói không. Ví dụ này thuộc khía cạnh nào trong văn hóa?","options":{"A":"Yếu tố vật chất (Material elements).","B":"Cách cư xử và phong tục (Manner and customs).","C":"Giá trị và thái độ (Values and Attitudes).","D":"Giáo dục (Education)."},"answer":"B"},{"id":83,"question":"Nguyên nhân nào dẫn đến hiện tượng sốt nóng ảo trên thị trường bất động sản?","options":{"A":"Do giới đầu cơ thao túng làm biến động mạnh về cầu bất động sản.","B":"Do kém minh bạch về thông tin; Các nhà đầu cơ lợi dụng thông tin quy hoạch, điều chỉnh chính sách để thổi phồng giá trị bất động sản.","C":"Do giới đầu cơ tạo ra “cầu ảo” nhằm làm tăng giá, thu hút đám đông tham gia.","D":"Đáp án A, B và C đều đúng."},"answer":"D"},{"id":84,"question":"Kỹ năng nào sau đây là cần thiết cho người môi giới hoặc người đại diện cho người mua nhà?","options":{"A":"Tư vấn và đàm phán.","B":"Quản lý thời gian và kỹ năng vi tính.","C":"Căn bản vững chắc về khía cạnh tài chính.","D":"Kỹ năng quản trị tệp khách hàng."},"answer":"A"},{"id":85,"question":"Để lập hồ sơ thương vụ môi giới BĐS, bên cung cần cung cấp","options":{"A":"Thông tin chủ sở hữu, các loại giấy tờ, hồ sơ pháp lý của BĐS","B":"Các giấy tờ liên quan đến thương vụ như giấy đặt cọc, phiếu thu chi …","C":"Hợp đồng dịch vụ môi giới","D":"Cả 3 câu trên đều đúng"},"answer":"D"},{"id":86,"question":"Rủi ro nào thường gặp nhất đối với hợp đồng đặt cọc mua BĐS, kể cả khi có công chứng?","options":{"A":"Công chứng viên thu phí đặt cọc quá cao.","B":"Bên bán không giao BĐS đúng hạn.","C":"Đặt cọc trá hình huy động vốn cho dự án chưa đủ điều kiện hoặc đặt cọc qua môi giới không ràng buộc được chủ đầu tư.","D":"Hợp đồng đặt cọc quá dài."},"answer":"C"},{"id":87,"question":"Trong hoạt động môi giới bất động sản, nhà môi giới thường KHÔNG phải khắc phục những bất đồng nào sau đây:","options":{"A":"Bất đồng về thông tin giữa các bên.","B":"Bất đồng về lợi ích giữa người mua và người bán.","C":"Bất đồng về quan điểm, cảm xúc của các bên tham gia giao dịch.","D":"Bất đồng về thời tiết trong ngày giao dịch"},"answer":"D"},{"id":88,"question":"Những đặc điểm có thể liệt kê trong “kỹ thuật cộng” khi đàm phán về giá cả BĐS","options":{"A":"Thành phần cấu tạo, đặc tính sử dụng, vị trí địa lý BĐS","B":"Thông tin quy hoạch, cơ sở hạ tầng, đặc điểm dân cư","C":"Thời gian giao BĐS, thời hạn bảo hành","D":"Câu A và C"},"answer":"D"},{"id":89,"question":"Tâm lý chung của khách hàng mua căn hộ lần đầu tiên là","options":{"A":"Sợ rằng rủi ro tài chính sẽ rất lớn","B":"Tìm hiểu thông tin liên quan rất kỹ","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"answer":"C"},{"id":90,"question":"Nhà môi giới cần phải quan tâm đến kỹ năng nào sau đây:","options":{"A":"Kỹ năng giao tiếp","B":"Kỹ năng thu thập thông tin","C":"Kỹ năng đàm phán","D":"Tất cả kỹ năng trên"},"answer":"D"},{"id":91,"question":"Một nhà môi giới và khách hàng của anh ta đang đàm phán thỏa thuận mua một bất động sản tại Hà Nội. Họ đã thực hiện xong công tác tiếp xúc, thăm dò đối tác, lập các phương án thỏa thuận mua bán, xác định chiến lược đàm phán với người bán bất động sản này. Họ thậm chí đã đàm phán thử với đối tác nhưng chưa mang lại kết quả. Bước nào họ nên thực hiện tiếp theo?","options":{"A":"Rút kinh nghiệm và tiến hành các bước tiếp xúc, thăm dò đối tác lại.","B":"Tiến hành đàm phán hợp nhất: Thảo luận về các mục tiêu chung và các mục tiêu xung đột, nhượng bộ và nhân nhượng nhằm phá vỡ tình huống căng thẳng.","C":"Đàm phán phân bổ: Trình bày quan điểm yêu cầu của mình và lắng nghe đối tác trình bày quan điểm của họ.","D":"Chuẩn bị các hợp đồng đã soạn thảo sẵn để đưa ra đàm phán lại."},"answer":"B"},{"id":92,"question":"Trong hoạt động môi giới bất động sản, nhà môi giới thường phải khắc phục những bất đồng nào sau đây, ngoại trừ:","options":{"A":"Bất đồng về thông tin giữa các bên.","B":"Bất đồng về lợi ích giữa người mua và người bán.","C":"Bất đồng về quan điểm, cảm xúc của các bên tham gia giao dịch.","D":"Bất đồng về thời tiết trong ngày giao dịch"},"answer":"D"},{"id":93,"question":"Đâu là hình thức quảng cáo trực tuyến (Online)?","options":{"A":"Quảng cáo trực quan hiển thị trên các nền tảng.","B":"Quảng cáo tìm kiếm theo từ khóa đấu thầu trên các nền tảng Google search (tìm kiếm).","C":"Email Marketing.","D":"Đáp án A, B và C đều đúng."},"answer":"D"},{"id":94,"question":"Người đại diện cho người mua BĐS được thuê để làm gì?","options":{"A":"Thể hiện ý kiến và mối quan tâm của người mua thông qua các giao dịch.","B":"Trưng bày và giới thiệu tài sản.","C":"Đàm phán trên cương vị của người mua.","D":"Tất cả lựa chọn đều đúng."},"answer":"D"},{"id":95,"question":"Tình huống: Một khách hàng mua căn nhà trị giá 7,5 tỷ đồng. Ngân hàng đồng ý cho vay tối đa 70% giá trị căn nhà. Hỏi khách hàng phải chuẩn bị số tiền trả trước là bao nhiêu?","options":{"A":"2,25 tỷ đồng.","B":"3,50 tỷ đồng.","C":"5,25 tỷ đồng.","D":"7,5 tỷ đồng"},"answer":"A"},{"id":96,"question":"Chủ đầu tư có được phép đưa công trình vào khai thác, sử dụng ngay sau khi tự tổ chức nghiệm thu hoàn thành không?","options":{"A":"Được phép đối với mọi công trình.","B":"Chỉ được phép đối với công trình nhà ở riêng lẻ.","C":"Phải có văn bản chấp thuận kết quả nghiệm thu của cơ quan chuyên môn về xây dựng đối với các công trình quan trọng, quy mô lớn, ảnh hưởng cộng đồng.","D":"Chỉ cần có biên bản nghiệm thu của nhà thầu thi công"},"answer":"C"},{"id":97,"question":"Cá nhân kinh doanh BĐS quy mô nhỏ theo Luật KDBĐS 2023 có bắt buộc phải thành lập doanh nghiệp không?","options":{"A":"Có, mọi hoạt động kinh doanh BĐS đều phải lập doanh nghiệp","B":"Không, nhưng phải kê khai nộp thuế theo quy định","C":"Chỉ cần đăng ký hộ kinh doanh cá thể","D":"Được miễn nếu giao dịch dưới 100 triệu đồng"},"answer":"B"},{"id":98,"question":"Thông tin về nguồn cung Bất động sản Nhà môi giới thu thập từ các kênh nào?","options":{"A":"Từ các phương tiện thông tin đại chúng.","B":"Từ các cơ quan Quản lý Sở Xây dựng, Sở Nông Nghiệp & Môi trường, Sở Quy hoạch - Kiến trúc.","C":"Từ văn phòng Môi giới.","D":"Tất cả câu A, B, C là đúng."},"answer":"D"},{"id":99,"question":"Tổ chức, cá nhân nước ngoài được thực hiện những hình thức kinh doanh dịch vụ bất động sản nào trong các hình thức sau:","options":{"A":"Kinh doanh dịch vụ môi giới bất động sản; Sàn giao dịch bất động sản.","B":"Kinh doanh dịch vụ tư vấn bất động sản.","C":"Kinh doanh dịch vụ quản lý bất động sản.","D":"Đáp án A, B, C đều đúng."},"answer":"D"},{"id":100,"question":"Để lập hồ sơ cho một thương vụ môi giới bất động sản, bên cung ứng bất động sản cần cung cấp những thông tin, giấy tờ nào?","options":{"A":"Hồ sơ pháp lý về quyền sở hữu, quyền sử dụng bất động sản.","B":"Bản dự báo thị trường bất động sản trong 5 năm tới.","C":"Thông tin cá nhân của các môi giới khác trên thị trường.","D":"Thông tin về xu hướng truyền thông trên mạng xã hội."},"answer":"A"},{"id":101,"question":"Khi nghiên cứu thị trường bất động sản, nguồn nào sau đây thường được sử dụng để thu thập thông tin về nguồn cầu bất động sản?","options":{"A":"Khách hàng, nhà đầu tư có nhu cầu mua, thuê bất động sản.","B":"Ngân hàng, tổ chức tín dụng..","C":"Báo cáo thị trường của cơ quan quản lý nhà nước.","D":"Tất cả các phương án trên"},"answer":"D"},{"id":102,"question":"Các bước trong tiếp cận khách hàng mua, thuê BĐS gồm:","options":{"A":"Tìm khách hàng tiềm năng, liên lạc và thỏa thuận hợp đồng","B":"Tiếp cận khách hàng, giới thiệu sản phẩm, xử lý thắc mắc và kết thúc chào bán","C":"Tiếp cận khách hàng, giới thiệu sản phẩm","D":"Liên lạc, tiếp cận khách hàng, giới thiệu sản phẩm và thỏa thuận hợp đồng."},"answer":"B"},{"id":103,"question":"Phương pháp thu thập thông tin về cầu bất động sản chủ động không bao gồm hoạt động nào sau đây:","options":{"A":"Gửi thư trực tiếp tới khách hàng tiềm năng.","B":"Tiếp cận tận nơi: đón hoặc gọi điện.","C":"Tìm kiếm qua các phương tiện thông tin đại chúng .","D":"Đón tại văn phòng môi giới bất động sản."},"answer":"D"},{"id":104,"question":"Điểm khác biệt cơ bản giữa đàm phán kiểu cứng và đàm phán kiểu nguyên tắc là gì?","options":{"A":"Kiểu cứng tập trung vào thắng - thua, kiểu nguyên tắc tập trung vào lợi ích chung.","B":"Kiểu cứng nhấn mạnh quan hệ lâu dài, kiểu nguyên tắc tập trung vào lợi ích trước mắt..","C":"Kiểu cứng thường linh hoạt, kiểu nguyên tắc thì cứng nhắc.","D":"Kiểu cứng dựa vào tiêu chuẩn khách quan, kiểu nguyên tắc dựa vào sức ép"},"answer":"A"},{"id":105,"question":"Yếu tố nào ảnh hưởng đến sự phát triển nghề môi giới?","options":{"A":"Tài chính ngân hàng phát triển, tạo điều kiện cho vay để đầu tư Bất động sản.","B":"Thị trường xây dựng phát triển.","C":"Sự tăng trưởng về dân số.","D":"Cả A, B, C đều đúng."},"answer":"D"},{"id":106,"question":"Tâm lý chung của khách hàng mua căn hộ lần thứ hai là","options":{"A":"Sợ rằng rủi ro tài chính sẽ rất lớn.","B":"Tìm hiểu thông tin liên quan rất kỹ.","C":"Đáp án A và B đúng.","D":"Đáp án A và B sai."},"answer":"B"},{"id":107,"question":"Những biểu hiện nào sau đây cho phép xác định đối tượng khách hàng của bạn là “khách hàng thụ động”?","options":{"A":"Dễ chịu, tươi cười, tế nhị, không thích bị ép.","B":"Né tránh, sợ bị gạt, không dám quyết định một mình.","C":"Có vẻ không đồng ý, hơi nghi ngờ, hay so sánh với sản phẩm khác của đối thủ.","D":"Tươi cười, xởi lởi, tỏ vẻ quan tâm."},"answer":"B"},{"id":108,"question":"Trong quy trình môi giới, người môi giới BĐS cần thực hiện các nhiệm vụ sau:","options":{"A":"Chứng thực, sao lưu các loại giấy tờ, tìm kiếm khách hàng.","B":"Khảo sát thực địa, hồ sơ pháp lý, thẩm định giá, quảng bá, giới thiệu BĐS.","C":"Đàm phán điều khoản, lập hợp đồng, thu phí môi giới.","D":"Cả 3 câu trên đều đúng."},"answer":"B"},{"id":109,"question":"Kỹ năng vượt qua thắc mắc của khách hàng:","options":{"A":"Ghi chép thông tin, phân loại ý kiến khách hàng, đồng cảm khi trả lời khách hàng, lôi kéo sự đồng ý của khách hàng.","B":"Lắng nghe cẩn thận, bình tĩnh, không ngắt lời.","C":"Lặp lại câu phản đối dưới dạng câu hỏi, nói chuyện ôn hòa, đồng cảm khi trả lời khách hàng, lôi kéo sự đồng ý của khách hàng.","D":"Đáp án B và C."},"answer":"D"},{"id":110,"question":"Theo Luật kinh doanh bất động sản 2023 (hiệu lực 01/08/2024), điều kiện tiên quyết để một cá nhân được hành nghề môi giới bất động sản là gì?","options":{"A":"Có ít nhất 5 năm kinh nghiệm.","B":"Phải là thành viên của Hiệp hội bất động sản Việt Nam.","C":"Có Chứng chỉ hành nghề môi giới bất động sản và phải làm việc trong một tổ chức kinh doanh dịch vụ bất động sản.","D":"Phải có bằng đại học chuyên ngành Luật hoặc Kinh tế."},"answer":"C"},{"id":111,"question":"Việc pháp luật yêu cầu nhà môi giới bất động sản phải có Chứng chỉ hành nghề nhằm mục đích chính là gì?","options":{"A":"Tăng nguồn thu từ lệ phí thi và cấp chứng chỉ.","B":"Hạn chế số lượng người tham gia vào nghề môi giới bất động sản.","C":"Đảm bảo nhà môi giới bất động sản có kiến thức chuyên môn, pháp luật và đạo đức cơ bản, góp phần nâng cao chất lượng dịch vụ và bảo vệ người tiêu dùng.","D":"Giúp các trường đại học có thêm chương trình đào tạo."},"answer":"C"},{"id":112,"question":"Một cá nhân có Chứng chỉ hành nghề môi giới bất động sản nhưng không làm việc cho công ty nào, tự đứng ra nhận tiền của khách để tìm nhà giúp họ từ ngày 01/08/2024. Hành vi này có phù hợp với quy định mới không?","options":{"A":"Hoàn toàn phù hợp vì đã có chứng chỉ.","B":"Không phù hợp, cá nhân phải hành nghề thông qua một tổ chức kinh doanh dịch vụ bất động sản.","C":"Chỉ phù hợp nếu giao dịch giá trị thấp.","D":"Chỉ phù hợp nếu khách hàng đồng ý."},"answer":"B"},{"id":113,"question":"Điều kiện về \"cơ sở vật chất, kỹ thuật\" đối với doanh nghiệp kinh doanh dịch vụ môi giới bất động sản nhằm đảm bảo điều gì?","options":{"A":"Văn phòng phải thật sang trọng, hoành tráng.","B":"Doanh nghiệp có địa điểm hoạt động rõ ràng, có đủ trang thiết bị tối thiểu để phục vụ hoạt động nghiệp vụ và lưu trữ hồ sơ theo quy định.","C":"Doanh nghiệp phải có website riêng.","D":"Doanh nghiệp phải có ít nhất 10 máy tính."},"answer":"B"},{"id":114,"question":"Việc Luật kinh doanh bất động sản Việt Nam công nhận và quy định về nghề môi giới bất động sản có ý nghĩa gì đối với sự phát triển của nghề?","options":{"A":"Hạn chế sự phát triển của nghề.","B":"Tạo cơ sở pháp lý chính thức, khẳng định vai trò xã hội, thúc đẩy sự chuyên nghiệp hóa và tạo điều kiện cho nghề phát triển một cách bài bản, có quản lý.","C":"Khiến việc hành nghề trở nên khó khăn hơn không cần thiết.","D":"Không có ý nghĩa gì đáng kể."},"answer":"B"},{"id":115,"question":"Trong các ý sau, ý nào chưa chính xác khi nói về nhóm các yếu tố tự nhiên liên hệ trực tiếp đến bất động sản:","options":{"A":"Nhu cầu của bất động sản trên thị trường","B":"Vị trí, kích thước, hình thể, diện tích thửa đất…","C":"Địa hình tọa lạc và hình thức bên ngoài của bất động sản","D":"Đặc điểm trên mặt đất- dưới lòng đất, và tình trạng môi trường, các tiện lợi và nguy cơ rủi ro của tự nhiên"},"answer":"A"},{"id":116,"question":"Tại sao nhà môi giới bất động sản cần có kiến thức về các yếu tố ảnh hưởng đến cung, cầu bất động sản (kinh tế vĩ mô, tài chính, xã hội...)?","options":{"A":"Chỉ để phục vụ việc thi lấy chứng chỉ.","B":"Để có thể phân tích, dự báo (ở mức độ nhất định) xu hướng thị trường, từ đó tư vấn chiến lược phù hợp cho khách hàng (thời điểm mua/bán, mức giá hợp lý, tiềm năng đầu tư...).","C":"Để có thể tự đầu tư Bất động sản hiệu quả hơn.","D":"Để có chuyện nói với khách hàng."},"answer":"B"},{"id":117,"question":"Tình huống: Công ty môi giới bất động sản M chỉ có một người duy nhất sở hữu Chứng chỉ hành nghề môi giới bất động sản. Nếu người này nghỉ việc, công ty M có còn đủ điều kiện kinh doanh dịch vụ môi giới bất động sản theo Luật kinh doanh bất động sản 2023 không?","options":{"A":"Vẫn đủ điều kiện bình thường.","B":"Không còn đủ điều kiện và phải bổ sung người có chứng chỉ khác hoặc tạm dừng hoạt động.","C":"Chỉ cần giám đốc công ty có chứng chỉ là đủ.","D":"Vẫn đủ điều kiện nếu công ty có doanh thu cao."},"answer":"B"},{"id":118,"question":"Sự phát triển của các nền tảng công nghệ bất động sản tại Việt Nam ảnh hưởng đến vai trò của nhà môi giới bất động sản truyền thống như thế nào?","options":{"A":"Hoàn toàn thay thế vai trò của nhà môi giới bất động sản.","B":"Không ảnh hưởng gì đáng kể.","C":"Tạo ra cả thách thức (yêu cầu môi giới phải nâng cao kỹ năng công nghệ, đối mặt cạnh tranh từ nền tảng) và cơ hội (công cụ tìm kiếm khách hàng, quản lý công việc, marketing hiệu quả hơn).","D":"Chỉ làm tăng chi phí hoạt động cho nhà môi giới bất động sản."},"answer":"C"},{"id":119,"question":"Tình huống: Nhà môi giới bất động sản A được người bán ủy thác bán nhà. Sau đó, chính môi giới A lại muốn mua căn nhà đó. Để đảm bảo đạo đức và tránh xung đột lợi ích, môi giới A cần làm gì?","options":{"A":"Tự mình mua với giá thấp hơn thị trường vì đang là người môi giới.","B":"Thông báo rõ ràng ý định muốn mua của mình cho người bán, từ bỏ vai trò môi giới đại diện cho người bán trong giao dịch này và tiến hành mua bán một cách công bằng như một người mua thông thường (có thể cần bên thứ ba hỗ trợ).","C":"Nhờ người nhà đứng tên mua hộ để che giấu.","D":"Vừa đóng vai trò môi giới vừa là người mua để tự thương lượng giá."},"answer":"B"},{"id":120,"question":"Tình huống: Doanh nghiệp môi giới bất động sản B sử dụng Chứng chỉ hành nghề môi giới bất động sản của nhân viên C (đã nghỉ việc) để đăng ký hoạt động. Hành vi này có vi phạm pháp luật không?","options":{"A":"Không vi phạm nếu nhân viên C đồng ý.","B":"Vi phạm nghiêm trọng quy định về điều kiện kinh doanh dịch vụ môi giới (sử dụng chứng chỉ không đúng người, không còn người đủ điều kiện làm việc).","C":"Chỉ vi phạm nếu bị cơ quan chức năng phát hiện.","D":"Không vi phạm nếu doanh nghiệp vẫn hoạt động tốt."},"answer":"B"},{"id":121,"question":"Yếu tố nào sau đây KHÔNG phải là vai trò trực tiếp của nhà môi giới bất động sản chuyên nghiệp?","options":{"A":"Cung cấp thông tin thị trường.","B":"Thúc đẩy giao dịch thành công","C":"Quyết định phê duyệt quy hoạch đô thị.","D":"Tư vấn về quy trình, thủ tục pháp lý cơ bản."},"answer":"C"},{"id":122,"question":"Việc quy định doanh nghiệp môi giới phải có \"quy chế hoạt động dịch vụ\" nhằm mục đích gì?","options":{"A":"Chỉ để làm thủ tục đăng ký kinh doanh.","B":"Thiết lập các quy tắc, quy trình làm việc nội bộ rõ ràng, đảm bảo hoạt động chuyên nghiệp, tuân thủ pháp luật và quản lý rủi ro hiệu quả.","C":"Hạn chế quyền tự do kinh doanh của doanh nghiệp.","D":"Quy định mức lương tối thiểu cho nhân viên."},"answer":"B"},{"id":123,"question":"Tại sao nói hoạt động môi giới bất động sản góp phần \"thúc đẩy đổi mới chính sách quản lý bất động sản\"?","options":{"A":"Vì nhà môi giới bất động sản trực tiếp tham gia soạn thảo luật.","B":"Vì các vướng mắc, bất cập phát sinh trong thực tế hoạt động môi giới là nguồn thông tin phản hồi quan trọng để cơ quan quản lý xem xét, điều chỉnh chính sách cho phù hợp hơn.","C":"Vì nhà môi giới bất động sản luôn yêu cầu thay đổi chính sách.","D":"Vì hoạt động môi giới làm giảm vai trò của cơ quan quản lý."},"answer":"B"},{"id":124,"question":"Việc một nhà môi giới bất động sản chủ động tư vấn cho khách hàng về các rủi ro tiềm ẩn của một bất động sản (thay vì chỉ nói về ưu điểm) thể hiện điều gì?","options":{"A":"Sự thiếu tự tin vào khả năng bán hàng.","B":"Tính chuyên nghiệp, trung thực và đặt lợi ích lâu dài của khách hàng lên trên việc chốt giao dịch bằng mọi giá.","C":"Sự thiếu hiểu biết về marketing.","D":"Mong muốn làm nản lòng khách hàng."},"answer":"B"},{"id":125,"question":"Tình huống : Chủ đầu tư dự án Y đưa ra mức hoa hồng rất cao..., đồng thời \"gợi ý\" các môi giới nên bỏ qua một vài thông tin chưa thuận lợi về pháp lý... Nhà môi giới nên ứng xử thế nào cho đúng đạo đức?","options":{"A":"Nhận lời ngay và làm theo gợi ý để đạt hoa hồng cao.","B":"Từ chối bán sản phẩm của dự án này.","C":"Vẫn tham gia bán hàng nhưng phải cung cấp thông tin một cách trung thực, đầy đủ về cả ưu điểm và các vấn đề pháp lý chưa thuận lợi cho khách hàng biết, đặt lợi ích và sự an toàn của khách hàng lên trên hoa hồng.","D":"Chỉ tư vấn cho những khách hàng dễ tính, ít hỏi về pháp lý."},"answer":"C"},{"id":126,"question":"Tình huống: Một doanh nghiệp môi giới bất động sản mới thành lập, chỉ có 1 người có chứng chỉ hành nghề (là giám đốc). Doanh nghiệp này có được phép tuyển thêm 10 nhân viên kinh doanh chưa có chứng chỉ để hỗ trợ tìm kiếm khách hàng và dẫn khách xem nhà không?","options":{"A":"Không được phép, tất cả nhân viên kinh doanh đều phải có chứng chỉ.","B":"Được phép, miễn là các hoạt động tư vấn chuyên sâu, ký kết hợp đồng dịch vụ do người có chứng chỉ thực hiện hoặc chịu trách nhiệm giám sát.","C":"Chỉ được phép tuyển tối đa 5 nhân viên không có chứng chỉ.","D":"Chỉ được phép nếu giám đốc ủy quyền cho họ."},"answer":"B"},{"id":127,"question":"Nếu nhà môi giới bất động sản không có Chứng chỉ hành nghề mà vẫn thực hiện hoạt động môi giới và thu phí, họ có thể đối mặt với hậu quả pháp lý nào?","options":{"A":"Chỉ bị khách hàng nhắc nhở.","B":"Bị xử phạt vi phạm hành chính theo quy định của pháp luật về kinh doanh bất động sản và có thể không được pháp luật bảo vệ quyền lợi về hoa hồng.","C":"Được phép tiếp tục hành nghề nếu nộp phạt.","D":"Không có hậu quả gì nếu khách hàng không khiếu nại."},"answer":"B"},{"id":128,"question":"Nhà môi giới có nên giữ bản gốc Giấy chứng nhận (GCN - Sổ hồng /Sổ đỏ) của khách hàng không?","options":{"A":"Nên giữ để đảm bảo khách hàng không bán cho người khác.","B":"Chỉ nên giữ khi khách hàng yêu cầu.","C":"Tuyệt đối không nên giữ, chỉ xem, sao chụp và hoàn trả ngay.","D":"Nên giữ và giao cho ngân hàng nếu khách hàng vay vốn."},"answer":"C"},{"id":129,"question":"Nhà môi giới phát hiện thông tin trên Sổ hồng (diện tích) có sai “diện tích nhỏ hơn so với đo đạc thực tế”. Hành động nào thể hiện sự chuyên nghiệp và quản lý rủi ro tốt nhất?","options":{"A":"Phớt lờ sự khác biệt vì cho rằng không đáng kể.","B":"Chỉ thông báo cho bên có lợi từ sự khác biệt đó.","C":"Minh bạch thông báo cho cả bên mua và bên bán về sự khác biệt, giải thích về sai số cho phép (nếu có) và tư vấn các bên kiểm tra kỹ lưỡng hoặc đo đạc lại nếu cần.","D":"Tự ý sửa lại thông tin trên hồ sơ giới thiệu cho khớp với Sổ hồng."},"answer":"C"},{"id":130,"question":"Tại sao nhà môi giới cần giúp khách hàng (đặc biệt là người mua lần đầu) hiểu rõ các điều khoản trong Hợp đồng Đặt cọc/Mua bán?","options":{"A":"Để thể hiện mình là người soạn thảo hợp đồng giỏi.","B":"Vì khách hàng thường chủ quan, không đọc kỹ hoặc không hiểu hết các thuật ngữ pháp lý, có thể dẫn đến rủi ro hoặc tranh chấp không đáng có.","C":"Để kéo dài thời gian ký kết hợp đồng.","D":"Để tính thêm phí tư vấn hợp đồng."},"answer":"B"},{"id":131,"question":"Nhà môi giới bất động sản có được phép nhận đặt cọc để mua căn hộ từ khách hàng không?","options":{"A":"Được phép khi có văn bản ủy quyền của chủ đầu tư và/hoặc chủ bất động sản","B":"Không được phép thực hiện theo đúng nội dung ủy quyền","C":"Hoàn toàn không được phép","D":"Cả A, B, C đều sai"},"answer":"A"},{"id":132,"question":"Nhà môi giới có nên từ chối làm việc với một khách hàng có yêu cầu phi thực tế hoặc không rõ ràng sau khi đã cố gắng tư vấn không?","options":{"A":"Không bao giờ, phải cố gắng đáp ứng mọi yêu cầu.","B":"Nên từ chối một cách lịch sự và chuyên nghiệp.","C":"Nên tiếp tục làm việc nhưng không cần nỗ lực nhiều.","D":"Nên báo cáo khách hàng này với hiệp hội bất động sản."},"answer":"B"},{"id":133,"question":"Đâu là hạn chế chính của việc chỉ dựa vào các mối quan hệ cá nhân để tìm kiếm khách hàng trong môi giới bất động sản?","options":{"A":"Khách hàng từ mối quan hệ thường khó tính hơn.","B":"Nguồn khách hàng bị giới hạn trong phạm vi mạng lưới quen biết, khó mở rộng quy mô kinh doanh.","C":"Phí hoa hồng thường thấp hơn.","D":"Khó xây dựng lòng tin với khách hàng."},"answer":"B"},{"id":134,"question":"Thái độ nào là KHÔNG phù hợp khi nhà môi giới nhận được một lời phàn nàn gay gắt từ khách hàng?","options":{"A":"Lắng nghe chăm chú để hiểu rõ vấn đề.","B":"Đổ lỗi ngược lại cho khách hàng hoặc bên thứ ba.","C":"Xin lỗi về trải nghiệm không tốt của khách hàng (ngay cả khi lỗi không hoàn toàn do mình).","D":"Đề xuất hướng giải quyết hoặc khắc phục (nếu có thể)."},"answer":"B"},{"id":135,"question":"Điều gì tạo nên sự khác biệt cốt lõi giữa một nhà môi giới bất động sản đơn thuần và một nhà tư vấn bất động sản chuyên nghiệp?","options":{"A":"Số lượng giao dịch thành công.","B":"Mức phí hoa hồng cao hơn.","C":"Khả năng cung cấp giải pháp toàn diện, dựa trên sự thấu hiểu sâu sắc nhu cầu khách hàng, kiến thức thị trường và phân tích chuyên môn, thay vì chỉ kết nối mua bán.","D":"Thời gian hoạt động trong nghề lâu hơn."},"answer":"C"},{"id":136,"question":"Khi thị trường bất động sản có dấu hiệu trầm lắng, người bán không muốn giảm giá, nhà môi giới nên tập trung vào chiến lược nào?","options":{"A":"Tạm dừng mọi hoạt động marketing.","B":"Chuyển sang chỉ làm việc với người mua.","C":"Tăng cường marketing sáng tạo, nhấn mạnh các giá trị độc đáo của bất động sản","D":"Yêu cầu người bán phải giảm giá bằng mọi cách."},"answer":"C"},{"id":137,"question":"Trong trường hợp thị trường bất động sản biến động mạnh (tăng hoặc giảm giá nhanh), kỹ năng nào của nhà môi giới trở nên đặc biệt quan trọng?","options":{"A":"Kỹ năng thiết kế nội thất.","B":"Kỹ năng phân tích thị trường, dự báo (ở mức độ nhất định) và tư vấn chiến lược kịp thời, linh hoạt cho khách hàng.","C":"Kỹ năng chụp ảnh bất động sản.","D":"Kỹ năng soạn thảo văn bản hành chính."},"answer":"B"},{"id":138,"question":"Việc từ chối cung cấp thông tin sai lệch theo yêu cầu của khách hàng (ví dụ: yêu cầu nói dối về tình trạng bất động sản) thể hiện điều gì ở nhà môi giới?","options":{"A":"Sự thiếu linh hoạt.","B":"Sự cứng nhắc, không biết chiều khách.","C":"Tính chính trực và tuân thủ đạo đức nghề nghiệp.","D":"Sự thiếu tự tin vào khả năng bán hàng."},"answer":"C"},{"id":139,"question":"Đâu là hạn chế của việc thẩm định giá bất động sản chỉ dựa vào phương pháp so sánh thị trường?","options":{"A":"Phương pháp này quá phức tạp.","B":"Có thể không chính xác nếu thị trường có ít giao dịch tương đồng hoặc bất động sản có tính độc đáo cao.","C":"Chỉ áp dụng được cho bất động sản thương mại.","D":"Luôn cho ra kết quả thấp hơn giá trị thực."},"answer":"B"},{"id":140,"question":"Khi người bán muốn giá 2 tỷ, người mua trả 1.9 tỷ, chiến thuật nào KHÔNG phù hợp để môi giới thu hẹp khoảng cách?","options":{"A":"Đề xuất chia đôi khoảng chênh lệch.","B":"Tìm kiếm các yếu tố phi giá cả để thương lượng (nội thất, thời gian bàn giao...).","C":"Nhấn mạnh vào điểm yếu của bất động sản để ép người bán giảm giá sâu hơn nữa.","D":"Phân tích chi phí cơ hội nếu không đạt được thỏa thuận cho cả hai bên."},"answer":"C"},{"id":141,"question":"Tình huống: Hợp đồng mua bán có điều khoản \"Giá bán không bao gồm thuế, phí liên quan đến việc chuyển nhượng\". Vậy, lệ phí trước bạ sẽ do ai chịu trách nhiệm nộp?","options":{"A":"Người bán.","B":"Người mua.","C":"Nhà môi giới.","D":"Cơ quan công chứng."},"answer":"B"},{"id":142,"question":"Tình huống: Nhà môi giới M muốn sử dụng hình ảnh khách hàng đã giao dịch thành công để làm tư liệu marketing. Nhà môi giới M cần làm gì trước tiên?","options":{"A":"Tự ý lấy ảnh trên Facebook của khách hàng và đăng tải.","B":"Xin phép khách hàng một cách rõ ràng bằng văn bản (hoặc hình thức có giá trị tương đương) về việc sử dụng hình ảnh và ý kiến của họ cho mục đích marketing.","C":"Chỉ sử dụng hình ảnh che mặt của khách hàng.","D":"Yêu cầu khách hàng bắt buộc phải cung cấp testimonial."},"answer":"B"},{"id":143,"question":"Tình huống: Một bất động sản được đồng sở hữu bởi 3 anh em. Một người trong số đó liên hệ nhà môi giới N để bán. Nhà môi giới N cần yêu cầu giấy tờ gì để đảm bảo giao dịch hợp lệ?","options":{"A":"Chỉ cần CMND/CCCD của người liên hệ.","B":"Giấy chứng nhận quyền sử dụng đất và văn bản đồng ý/ủy quyền bán có chữ ký hợp lệ của cả 3 anh em (nên được công chứng/chứng thực).","C":"Giấy khai sinh của cả 3 anh em.","D":"Hợp đồng lao động của người liên hệ."},"answer":"B"},{"id":144,"question":"Tình huống: Hợp đồng mua bán bất động sản quy định thời hạn bên bán phải bàn giao nhà là 30 ngày sau khi ký công chứng. Đến ngày thứ 30, bên bán vẫn chưa dọn đi và xin thêm 1 tuần. Bên mua nên:","options":{"A":"Đồng ý ngay lập tức mà không cần điều kiện gì.","B":"Yêu cầu bên bán bồi thường thiệt hại do chậm bàn giao.","C":"Xem xét lý do chậm trễ, nếu hợp lý có thể đồng ý gia hạn nhưng nên lập thành văn bản (phụ lục hợp đồng) ghi rõ thời hạn mới và có thể kèm theo điều kiện (ví dụ: bên bán chịu chi phí thuê nhà phát sinh cho bên mua trong 1 tuần đó).","D":"Thuê người đến chuyển đồ của bên bán đi."},"answer":"C"},{"id":145,"question":"Tình huống: Trong quá trình đàm phán, nhà môi giới nhận thấy cả bên mua và bên bán đều có thiện chí nhưng gặp khó khăn trong việc tìm tiếng nói chung về một vài điều khoản nhỏ. Nhà môi giới nên đóng vai trò gì?","options":{"A":"Đứng về phía bên trả hoa hồng cao hơn.","B":"Đề xuất các giải pháp trung gian, các phương án thỏa hiệp công bằng cho các điều khoản nhỏ đó để giúp hai bên vượt qua điểm nghẽn và đi đến thỏa thuận cuối cùng.","C":"Để hai bên tự giải quyết các vấn đề nhỏ đó.","D":"Tuyên bố đàm phán thất bại."},"answer":"B"},{"id":146,"question":"Tình huống: Hợp đồng đặt cọc không ghi rõ về việc ai sẽ chịu chi phí công chứng hợp đồng mua bán. Theo thông lệ tại nhiều địa phương ở Việt Nam, chi phí này thường do ai chịu?","options":{"A":"Người bán chịu hoàn toàn.","B":"Người mua chịu hoàn toàn.","C":"Nhà môi giới chịu.","D":"Thường do người mua chịu, hoặc hai bên thỏa thuận chia đôi."},"answer":"D"},{"id":147,"question":"Những phương pháp nào sau đây Nhà môi giới sử dụng để thu thập thông tin về cầu Bất động sản?","options":{"A":"Tìm kiếm qua phương tiện thông tin đại chúng.","B":"Gọi điện trực tiếp cho khách hàng.","C":"Gửi mail trực tiếp cho khách hàng.","D":"Tất cả câu A, B, C là đúng."},"answer":"D"},{"id":148,"question":"Nguyên tắc đạo đức \"Trung thành\" của nhà môi giới bất động sản đối với khách hàng bị vi phạm trong trường hợp nào sau đây?","options":{"A":"Môi giới tư vấn cho người bán nên sửa chữa lại nhà trước khi bán để được giá tốt hơn.","B":"Môi giới đại diện người mua nhưng lại cố tình giới thiệu bất động sản giá cao hơn thị trường để nhận hoa hồng cao hơn từ người bán (nếu có thỏa thuận ngầm).","C":"Môi giới từ chối tiết lộ thông tin tài chính cá nhân của người bán cho người mua.","D":"Môi giới nỗ lực đàm phán để đạt được các điều khoản có lợi nhất cho khách hàng của mình."},"answer":"B"},{"id":149,"question":"Tình huống: Nhà môi giới A đang làm việc với khách hàng B (người mua). Khách hàng B bày tỏ lo ngại về vấn đề tài chính và hỏi liệu có thể \"lách\" một số quy định để được vay vốn dễ dàng hơn không. Nhà môi giới A nên:","options":{"A":"Hướng dẫn khách hàng cách \"lách luật\".","B":"Từ chối thẳng thừng và dừng làm việc với khách hàng.","C":"Giải thích rõ ràng các quy định về tín dụng, nhấn mạnh tầm quan trọng của việc cung cấp thông tin trung thực cho ngân hàng, đồng thời tư vấn các phương án tài chính hợp pháp khác hoặc giới thiệu chuyên gia tư vấn tài chính nếu cần.","D":"Phớt lờ câu hỏi của khách hàng."},"answer":"C"},{"id":150,"question":"Hợp đồng mua bán bất động sản được công chứng có giá trị pháp lý như thế nào so với hợp đồng không công chứng (viết tay)?","options":{"A":"Giá trị pháp lý như nhau.","B":"Hợp đồng công chứng có giá trị chứng cứ cao hơn.","C":"Hợp đồng viết tay có giá trị hơn vì thể hiện đúng ý chí các bên.","D":"Chỉ hợp đồng công chứng mới phải nộp thuế."},"answer":"B"},{"id":151,"question":"Khi kết thúc một thương vụ thành công, hành động nào thể hiện sự chuyên nghiệp và giúp duy trì mối quan hệ tốt đẹp với khách hàng?","options":{"A":"Ngắt mọi liên lạc với khách hàng.","B":"Gửi lời cảm ơn chân thành, hỏi thăm về trải nghiệm và đề nghị hỗ trợ nếu có vấn đề phát sinh (trong phạm vi hợp lý).","C":"Yêu cầu khách hàng viết đánh giá tốt ngay lập tức.","D":"Chỉ gửi hóa đơn thu phí hoa hồng."},"answer":"B"},{"id":152,"question":"Dịch vụ môi giới bất động sản là gì?","options":{"A":"Là việc tìm kiếm đối tác để thực hiện giao dịch bất động sản.","B":"Là việc đại diện cho một bên để đàm phán hợp đồng mua bán bất động sản.","C":"Là dịch vụ cung cấp thông tin và tư vấn về pháp lý bất động sản.","D":"Là bên trung gian và nhận thù lao từ hoạt động môi giới mua bán, chuyển nhượng, cho thuê, cho thuê mua bất động sản."},"answer":"D"},{"id":153,"question":"Khi giao dịch mua bán bất động sản chưa đủ điều kiện giao dịch, bên mua và bên bán sử dụng “vi bằng” thay cho hợp đồng công chứng. Hậu quả pháp lý của việc sử dụng vi bằng là:","options":{"A":"Vi bằng có giá trị pháp lý tương đương hợp đồng công chứng","B":"Người mua không được bảo đảm quyền sở hữu tài sản, gây tranh chấp sau này","C":"Vi bằng giúp tiết kiệm chi phí mà vẫn đảm bảo quyền lợi","D":"Cơ quan công chứng sẽ tự động chuyển đổi vi bằng thành hợp đồng công chứng"},"answer":"B"},{"id":154,"question":"Theo Luật Kinh doanh bất động sản 2023, Sàn giao dịch bất động sản được định nghĩa là gì?","options":{"A":"Là nơi chỉ dành để trưng bày và quảng cáo bất động sản của các chủ đầu tư dự án.","B":"Là nơi giao dịch bắt buộc đối với tất cả các loại bất động sản trên thị trường sơ cấp.","C":"Là tổ chức kinh tế có chức năng chính là quản lý và điều hành thị trường bất động sản.","D":"Là nơi diễn ra các giao dịch về mua bán, chuyển nhượng, cho thuê, cho thuê lại, cho thuê mua bất động sản."},"answer":"D"},{"id":155,"question":"Sau khi ký kết hợp đồng dịch vụ môi giới, bước đầu tiên nhà môi giới cần làm là gì?","options":{"A":"Tiến hành Marketing đại trà trên mọi kênh.","B":"Chờ đợi bên mua chủ động liên hệ tìm kiếm.","C":"Thu thập, thẩm định thông tin về bất động sản và đối tác.","D":"Yêu cầu khách hàng đặt cọc một khoản phí dịch vụ."},"answer":"C"},{"id":156,"question":"Khi người môi giới đại diện cho bên bán làm việc với bên mua, phần nào sau đây không thuộc nhiệm vụ thực hiện của người môi giới đối với bên mua?","options":{"A":"Nhiệm vụ ủy thác","B":"Tư vấn sửa chữa, thanh lý hợp đồng mua bán BĐS","C":"Tư vấn cho khách hàng để có sự hiểu rõ toàn diện về BĐS.","D":"Cả A, B, C đều đúng."},"answer":"A"},{"id":157,"question":"Rủi ro pháp lý nghiêm trọng nhất khi môi giới một bất động sản là gì?","options":{"A":"Bất động sản có vị trí không đẹp như quảng cáo.","B":"Khách hàng từ chối trả tiền hoa hồng sau khi giao dịch.","C":"Bất động sản không đủ điều kiện kinh doanh hoặc đang có tranh chấp.","D":"Giá bán bất động sản thấp hơn so với giá kỳ vọng."},"answer":"C"},{"id":158,"question":"Sau khi ký hợp đồng, bên mua muốn chậm thanh toán 1 tháng. Môi giới nên làm gì?","options":{"A":"Đồng ý bằng miệng vì chỉ là kéo dài thời gian.","B":"Lập Phụ lục hợp đồng hoặc văn bản thỏa thuận bổ sung có công chứng.","C":"Yêu cầu bên mua trả thêm phí phạt.","D":"Coi như không có chuyện gì xảy ra."},"answer":"B"},{"id":159,"question":"Bản chất của hoạt động môi giới BĐS là?","options":{"A":"Là sự kết nối các bên để thiết lập 1 thương vụ.","B":"Là một ngành nghề, kinh doanh dịch vụ, hoạt động nhằm thu lợi.","C":"Là hoạt động không chịu sự quản lý của cơ quan nhà nước.","D":"Là hoạt động không cần phần chứng chỉ hành nghề và giấy phép kinh doanh."},"answer":"B"},{"id":160,"question":"Một khách mua muốn bạn nâng giá BĐS lên 200 triệu để họ vay được nhiều hơn từ ngân hàng. Bạn nên làm gì?","options":{"A":"Chấp nhận vì không thiệt hại cho ai","B":"Làm theo để được hoa hồng","C":"Từ chối vì hành vi gian lận và vi phạm pháp luật","D":"Đề nghị nâng thêm nhiều hơn"},"answer":"C"},{"id":161,"question":"Tiêu chí nào sau đây thuộc lập trường đàm phán theo kiểu nguyên tắc?","options":{"A":"Đánh lạc hướng về giới hạn cuối cùng.","B":"Lùi bước trước nguyên tắc chứ không lùi bước trước áp lực.","C":"Đi tìm một câu trả lời mà đối tác chấp nhận.","D":"Gây áp lực dựa trên nguyên tắc."},"answer":"B"},{"id":162,"question":"Sử dụng kỹ năng trình bày FAB (Features, Advantages, Benefits) trong trường hợp nào?","options":{"A":"Thắc mắc về giá cả","B":"Thắc mắc về chất lượng","C":"Thắc mắc về pháp lý","D":"Tất cả các trường hợp trên"},"answer":"D"},{"id":163,"question":"Khi thuyết trình giới thiệu bất động sản, vấn đề quan trọng nhất cần trình bày là gì?","options":{"A":"Giá cả sản phẩm.","B":"Đặc điểm nổi bật trong thiết kế.","C":"Giá trị và lợi ích của sản phẩm mang lại cho khách hàng.","D":"Tất cả đều sai."},"answer":"C"},{"id":164,"question":"Khách hàng quan tâm điều gì nhất trong loại hình BĐS là chung cư?","options":{"A":"Hạ tầng kỹ thuật, giá cả, diện tích sử dụng.","B":"Giá cả, diện tích sử dụng, vị trí giao thông.","C":"Môi trường sống, chi phí sử dụng, diện tích khu vực.","D":"Chất lượng, mẫu mã, diện tích sử dụng."},"answer":"B"},{"id":165,"question":"Yếu tố nào sau đây có ảnh hưởng GIÁN TIẾP nhưng lại mang tính quyết định đến sự sôi động hay trầm lắng của nghề môi giới bất động sản trong dài hạn?","options":{"A":"Quy định về mẫu hợp đồng môi giới.","B":"Số lượng các khóa đào tạo môi giới được mở.","C":"Tình hình kinh tế vĩ mô và chu kỳ của thị trường bất động sản.","D":"Mức lệ phí cấp chứng chỉ hành nghề."},"answer":"C"},{"id":166,"question":"Yếu tố nào sau đây KHÔNG ảnh hưởng trực tiếp đến mức phí hoa hồng môi giới bất động sản?","options":{"A":"không phụ thuộc vào giá của giao dịch được môi giới bất động sản.","B":"Tỷ lệ hoa hồng thỏa thuận trong hợp đồng dịch vụ.","C":"Tình trạng pháp lý của nhà môi giới bất động sản (có chứng chỉ hay không).","D":"Mức độ phức tạp của giao dịch và công sức của nhà môi giới bất động sản."},"answer":"A"},{"id":167,"question":"Rủi ro lớn nhất khi mua bán bất động sản thông qua hợp đồng ủy quyền là gì?","options":{"A":"Phí ủy quyền cao.","B":"Thời gian làm thủ tục lâu hơn.","C":"Hợp đồng ủy quyền có thể không hợp lệ. D, Khó vay vốn ngân hàng hơn."},"answer":"C"},{"id":168,"question":"Đâu là rủi ro khi nhà môi giới quá tập trung vào việc \"chốt sale\" nhanh chóng mà bỏ qua bước thẩm định thông tin kỹ lưỡng?","options":{"A":"Nhận được hoa hồng nhanh hơn.","B":"Có thể dẫn đến giao dịch thất bại giữa chừng, tranh chấp pháp lý, mất uy tín và gây thiệt hại cho khách hàng.","C":"Được khách hàng đánh giá cao vì sự nhanh nhẹn.","D":"Tiết kiệm được chi phí hoạt động."},"answer":"B"},{"id":169,"question":"Tình huống: Hợp đồng mua bán bất động sản có điều khoản \"Bên bán cam kết bất động sản không có bất kỳ tranh chấp nào\". Sau khi mua, bên mua phát hiện có tranh chấp ranh giới từ trước đó. Bên mua có quyền gì?","options":{"A":"Không có quyền gì vì đã ký hợp đồng.","B":"Có quyền yêu cầu bên bán giải quyết dứt điểm tranh chấp hoặc yêu cầu hủy hợp đồng và bồi thường thiệt hại do bên bán đã vi phạm cam kết.","C":"Chỉ có quyền yêu cầu giảm giá bán.","D":"Phải tự mình giải quyết tranh chấp với hàng xóm."},"answer":"B"},{"id":170,"question":"Thị trường bất động sản phân theo cấp độ tham gia vào thị trường thì thị trường cấp 1 được hiểu là:","options":{"A":"Thị trường sơ cấp","B":"Thị trường giao dịch giữa cơ quan quản lý, người đầu tư xây dựng bất động sản với các tổ chức dịch vụ, hoặc người sử dụng bất động sản để bán, cho thuê hoặc sử dụng..","C":"Cả A và B đều đúng","D":"Cả A và B đều sai"},"answer":"C"}]};
